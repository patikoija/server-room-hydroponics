# =============================================================================
# Hydroponics — crop-driven ebb-and-flow control with reboot-safe state machine
# =============================================================================
# Self-contained HA package (loaded via `homeassistant: packages:`). ONE switch runs
# everything: tick "Buckets Occupied" and lights + flooding start on the selected
# crop's schedule; untick it (harvest/remove) and they stop. Schedules come from a crop
# PROFILE table, so you never set times by hand.
#
# TWO AXES, DELIBERATELY SEPARATE (renamed 2026-07-30 — see "the rebrand" below):
#   input_boolean.hydro_occupied     — are there plants in the buckets at all?
#   input_select.hydro_growth_stage  — how mature are they? germination -> seedling -> mature
# Under the old tray workflow these collapsed into one flag, because plants only ENTERED the
# buckets at transplant and arrived already past seedling. Direct sowing separates them: a
# bucket is occupied from day 0 but the plant is not mature for ~10 days. Keeping them apart
# is also the smaller blast radius — only `hydro_occupied` gates the pumps.
#
# THE REBRAND: this package no longer speaks of "transplant". Nothing changes location any
# more; cubes are sown in the bucket they will finish in. The axis is PLANT MATURITY, so the
# vocabulary is germination / seedling / mature. Old -> new, for anyone reading old commits:
#   input_boolean.hydro_transplanted   -> input_boolean.hydro_occupied
#   input_datetime.hydro_transplant_date -> input_datetime.hydro_stage_started
#   stage value `established`          -> `mature`
#   input_select.hydro_light_stage     -> input_select.hydro_growth_stage
#
# REBOOT SAFETY (the floor-flood problem):
#   Z-Wave plugs hold their physical state across an HA restart (a running fill pump keeps
#   running), and `delay:`-based scripts are killed on restart (the drain never fires). So we
#   track the PHYSICAL phase in input_select.hydro_phase, which PERSISTS across reboot (no
#   `initial:` => HA restores its last value). On HA start, hydro_startup_recovery force-offs
#   BOTH pumps and, if the last phase was anything but `empty`, DRAINS to a known-empty state
#   before any flooding can resume. Belt-and-suspenders: the flood scheduler also refuses to
#   start unless phase == empty. The true hardware backstop for "HA is fully down while the
#   fill pump is on" is the plug's own Z-Wave auto-off timer — see hydroponics-build.md.
#
# DISABLED until you tick Buckets Occupied: input_boolean.hydro_occupied defaults OFF, so a
# deploy actuates nothing. The three independent failsafes (fill-overflow, drain-runaway,
# both-pumps interlock) are always armed and latch input_boolean.hydro_fault_latch on a trip,
# which halts auto-flooding until you clear it (lights and the manual button are unaffected).
# =============================================================================

input_boolean:
  hydro_occupied:
    name: Buckets Occupied
    icon: mdi:sprout
  # Opt-OUT for the circulation fans (ZEN20 port 5), default on. Exists so the fans can be
  # silenced for a evening without unpicking the crop schedule — untick and the reconcile
  # turns them off within 5 minutes and leaves them off.
  # Not a safety control: fans move air, they cannot flood a floor, so they are deliberately
  # NOT wired into hydro_fault_latch or the maintenance interlock. A fault should not stop
  # air moving over wet media; that is when you want it most.
  hydro_fans_enabled:
    name: Circulation Fans Enabled
    icon: mdi:fan
    initial: true
  # Set when a polish drain ran and the low float STAYED WET. That is the only version of this
  # condition worth waking someone for, and it is what the observer now reports on instead of
  # the raw contradiction. Cleared the moment a polish succeeds.
  hydro_polish_failed:
    name: Hydro polish drain did not clear the float
    icon: mdi:water-alert
  # ── DID THE FILL ACTUALLY REACH DEPTH? THE DAY'S TALLY DEPENDS ON IT. ─────────────────────
  #
  # counter.hydro_cycles_today increments on the phase transition draining -> empty, with the
  # stated intent that "a flood that never drained must NOT count as watering delivered". The
  # intent is right; the test is wrong in BOTH directions:
  #
  #   * THE WATCHDOG ALSO DRAINS TO EMPTY when it recovers a stall, so a FAILED fill produced
  #     draining -> empty and counted as a watering. That is why cycles_today read 3 on
  #     2026-10-23, a day with ZERO completed fills, and why the pace observer stayed quiet while
  #     the crop went unwatered. An alert that cannot see failure is worse than no alert.
  #   * hydro_fill_only PARKS water and never drains, so a legitimate half-cycle counts as
  #     nothing and the observer would page "0 of 3" with water sitting in the buckets.
  #
  # Set ONLY on the fill's success branch -- the same branch that writes "Filled to target depth"
  # -- and cleared when a fill starts. The tally then means WATER REACHED THE TARGET FLOAT AND WAS
  # DRAINED, which is what "we flooded N times" is supposed to assert.
  # ── A HUMAN PARKED THIS WATER. IT IS NOT A STALL. ─────────────────────────────────────────
  #
  # hydro_fill_only deliberately fills and leaves the water, with no timer -- that is the whole
  # point of it, measuring how long a 9in fill really takes. But hydro_phase_watchdog treats a
  # long `full` as a stuck cycle: on 2026-10-24 it drained the owner's fill-only run after 511s
  # against a 420s budget and latched a fault. So the calibration tool could not be used at all.
  #
  # The watchdog cannot tell INTENT from FAILURE, and that is the same gap as clearing a fault
  # without knowing what set it. This flag is the intent.
  hydro_fill_parked:
    name: "Fill parked on purpose (fill-only, no drain)"
    initial: false

  hydro_fill_reached_target:
    name: "Last fill reached its target depth (system)"
    initial: false

  hydro_fault_latch:
    name: Hydro Fault (auto-flood halted)
    icon: mdi:alert
  # MAINTENANCE is a SEPARATE control from FAULT, deliberately.
  #
  # Both stop auto-flooding, so one boolean would technically do. But they mean opposite
  # things about the system: a fault says something went wrong and needs investigating;
  # maintenance says a person is deliberately working on it. Collapsing them means the next
  # person to see "Hydro Fault" while someone has their hands in the reservoir does the
  # reasonable thing — investigates, finds nothing wrong, and clears it. That re-arms the
  # pumps under them.
  #
  # It also survives being forgotten better: a fault is expected to be transient and cleared,
  # while maintenance being on is a normal state that nobody feels pressure to "fix".
  # Pin the growth stage by hand, overriding the automatic transitions.
  #
  # The stage is a proxy for ROOT DEPTH, not for calendar age, and the two come apart when a
  # crop develops slowly.
  #
  # IT NOW FORCES THE DEEP-SOAK DEPTH, which is what its label always claimed. The old note
  # said a crop held at `seedling` floods "~1.5" deeper than its age would call for" -- true
  # under the stage-driven depth model, and FALSE since the depth moved to a sow-age gate:
  # hydro_target_float reads sow age and never looks at growth_stage, so this switch pinned a
  # stage that no longer influenced depth. A control that looks like it works.
  # While it is on, both hydro_target_float and sensor.hydro_target_depth take the hard-limit
  # depth regardless of age. Turn it off when the roots catch up and the crop should drop to
  # the age-appropriate depth.
  hydro_stage_manual_hold:
    name: Hydro Stage Manual Hold (pin the flood depth)
    icon: mdi:pin

  hydro_maintenance:
    name: Hydro Maintenance (hands-on work in progress)
    icon: mdi:wrench-clock

  # ---------------------------------------------------------------------------
  # FLOAT TEST — "I am about to make the floats disagree on purpose."
  # ---------------------------------------------------------------------------
  # WITHOUT THIS, THE MONTHLY PROOF TEST LATCHES A FAULT AND PAGES URGENTLY.
  #
  # Lifting one of the upper floats by hand while the buckets are empty IS wet-above-dry —
  # it is the exact signature `hydro_float_disagreement_guard` exists to catch, which is what
  # makes it a good test and also what makes it punishing. That guard waits 30s and then
  # latches, forces phase to `fault`, and sends the urgent tone. The reminder text tells you
  # to hold the float "until HA shows it wet", which takes longer than 30s, so the instruction
  # walked straight into it.
  #
  # A safety check nobody can afford to run is a safety check that does not get run. The
  # unproven floats are the ones above the waterline — precisely the ones whose test trips
  # this — so the cost landed entirely on the tests that matter most.
  #
  # WHAT THIS DOES AND DOES NOT SUPPRESS. The guard still fires and still CUTS POWER TO BOTH
  # PUMPS; that is the protective action and it costs nothing when they are already off. What
  # is suppressed is the LATCH, the phase change and the urgent page — those are workflow,
  # meaning "stop everything until a human looks at this", and during a test a human is
  # already looking. Protection is untouched; only the summons is.
  #
  # It is BOUNDED and FAILS CLOSED: it stamps an expiry, self-clears, refuses to arm unless
  # the system is idle, and is forced off on every HA start. A test mode that quietly survives
  # a restart is a disabled safety that nobody remembers disabling.
  hydro_float_test:
    name: Float Test (expect disagreement)
    icon: mdi:test-tube

  # ---------------------------------------------------------------------------
  # MANUAL OVERRIDE — "I have set this state by hand; stop correcting me."
  # ---------------------------------------------------------------------------
  # SEPARATE FROM MAINTENANCE, DELIBERATELY, and the reason is concrete. Maintenance means
  # "do not move water" — it gates the flood script and the scheduler. The obvious-looking
  # shortcut of reusing it to suppress reconciliation breaks the exact workflow this exists
  # for: on 2026-08-16 the growth stage was set by hand IN ORDER TO run a flood cycle at a
  # different target depth. Under a shared flag that is unachievable — maintenance on keeps
  # the override but forbids the flood, maintenance off allows the flood but reverts the
  # override within five minutes. Two meanings, two switches.
  #
  # Reconciliation pauses under EITHER this or maintenance: if hands are in the tank, the
  # system should not be quietly rewriting state either.
  #
  # IT SUPPRESSES CORRECTION, NEVER VISIBILITY. binary_sensor.hydro_state_drift stays live
  # and still alarms while this is on. An override that also silenced the alarm would rebuild
  # the original bug — silent divergence — with official sanction.
  hydro_manual_override:
    name: Hydro Manual Override (stop reconciling from the tracker)
    icon: mdi:hand-back-right

input_select:
  # Current crop — drives the light window + flood cadence from the profile table below.
  # No `initial:` => persists your choice across restarts; first option is the create-time default.
  hydro_crop:
    name: Current Crop
    icon: mdi:leaf
    options:
      - "Lettuce (leaf/romaine)"
      - "Butterhead lettuce"
      - "Basil"
      - "Spinach"
      - "Bok choy / pak choi"
      - "Arugula / Asian greens"
      - "Herbs (mixed)"
      - "Strawberries"
  # GROWTH STAGE — how mature the current batch is. Drives which of the crop's three
  # photoperiods is active, and is the axis that replaced the old location-based
  # "transplanted" flag: germination -> seedling -> mature.
  # No `initial:` so it persists; `mature` FIRST = safe create-time default, which is also
  # the correct state for a batch already growing in the buckets.
  # See the profile table for the windows and the DLI reasoning.
  hydro_growth_stage:
    name: Growth Stage
    icon: mdi:sprout-outline
    options:
      - mature
      - germination
      - seedling
  # MANUAL FLOOD DEPTH — the depth float that stops the fill pump for a HAND-RUN flood only
  # (the dashboard "RUN a flood now" button). 'Auto' = follow the growth stage, exactly as the
  # scheduler does. The three explicit depths map to the physical floats: deepest early,
  # shallower as roots grow down (day0 9" germination -> mid 7.5" seedling -> mature 6"). This
  # is honoured ONLY for manual runs: the scheduler, recovery and auto-flood callers pass
  # `scheduled: true` and ignore this entirely, so a left-over selection cannot change an
  # automatic flood. No `initial:` so it persists; 'Auto' first = safe default. (internal tracker)-adjacent.
  hydro_manual_flood_depth:
    name: Manual flood depth (fill-stop float)
    icon: mdi:arrow-collapse-down
    # Labelled by INCHES, not float name, because stage no longer equals float height: the
    # four physical floats are 11"=hard limit, 9"=day0, 7.5"=mid, 6"=mature. 'Auto' follows the
    # growth stage, which since 2026-10-31 means the hard-limit float for the first
    # hydro_deep_soak_days (see the scheduled branch of hydro_target_float).
    #
    # 11" IS THE CEILING FLOAT, DELIBERATELY OFFERED. Owner 2026-10-31: "we also need to modify the
    # manual flood tool's logic to have an option for an 11in depth." Listed LAST rather than in
    # depth order, so the deepest and least reversible choice does not sit next to 'Auto'.
    options:
      - "Auto (growth stage)"
      - '9 in'
      - '7.5 in'
      - '6 in'
      - '11 in'
  # PERSISTENT physical phase — the reboot-safe state log. NEVER give this an `initial:`.
  # First option `empty` is the safe create-time default.
  hydro_phase:
    name: Hydro Phase (persistent)
    icon: mdi:state-machine
    options:
      - empty
      - filling
      - full
      - draining
      - fault

# SYSTEM calibration + safety — NOT user knobs. Every actual fill/drain time is COMPUTED from
# these + the target flood depth (sensor.hydro_target_depth). Measured once; you should ignore
# these on the dashboard (they live in a "System" section).
input_number:

  # ── LATCH RETRY PROBE ─────────────────────────────────────────────────────────────────────────
  #
  # hydro_drain_probe_seconds WAS HERE AND IS REMOVED (2026-11-03). Its rationale read: "A probe
  # runs the drain pump briefly with no water guaranteed to be there, so it is a small,
  # deliberate amount of dry-running." That premise is wrong for this automation:
  # hydro_latch_retry_drain requires binary_sensor.hydro_all_floats_dry to be OFF, so a float is
  # reporting water -- it is not a blind poke at a possibly-empty bucket. And if the float is
  # lying (stuck wet with no water), hydro_drain_runaway_guard cuts the pump on its dry-power
  # trigger within ~25s, which is tighter than the 10s-to-60s this knob could express anyway.
  #
  # The retry now waits for the bottom float to PROVE dry, bounded by hydro_drain_seconds, so
  # nothing reads this value. Leaving a knob on the dashboard labelled "retry probe seconds"
  # with min 5 / max 60 that controls nothing is the trap worth avoiding: someone tunes it,
  # watches for an effect, and concludes the recovery is already as aggressive as it can be.
  #
  # The per-day budget below is unchanged and still meaningful -- it is what stops an endless
  # hourly nudge -- and reaching it now raises an alarm rather than going quiet. See
  # binary_sensor.hydro_recovery_exhausted.
  hydro_drain_probes_max_today:
    name: Hydro drain retry probes allowed per day
    min: 0
    max: 48
    step: 1
    initial: 12
  # TWO, not unlimited. One auto-clear is "a transient resolved itself". Repeated auto-clears mean
  # the condition keeps coming back, which is the signature of a physical fault -- and the whole
  # risk of self-healing is that it makes that invisible. After this many, the latch stays set and
  # a human is told why.
  hydro_latch_autoclears_max_today:
    name: Hydro latch auto-clears allowed per day
    min: 0
    max: 10
    step: 1
    initial: 2
  # Days from sow before the system flips Buckets Occupied itself and flooding begins.
  #
  # 10 is not arbitrary: this package's own header puts maturity at "~10 days" after direct
  # sowing, and the last tray-grown crop was moved on day 9 (sown 07-21, moved 07-30). Roots
  # want to be at the bottom of the cube before the first flood, or the cube wicks water it
  # cannot yet drink and stays saturated.
  #
  # Tunable because it is crop-dependent -- leaf lettuce is quicker than the fruiting crops in
  # the profile table. Erring LATE is the safe direction here, which is the opposite of the
  # germination->seedling light step (see hydro_stage_emergence): a late flood costs a little
  # growth, an early one risks rotting the cube.
  # ── RE-MEASURED 2026-11-04 FROM THREE CONSECUTIVE CYCLES, pump-on to 11-inch float wet ──────
  #     16:10:00 -> 16:15:24   324 s
  #     23:15:00 -> 23:20:28   328 s
  #     02:45:00 -> 02:50:34   334 s        mean 329 s, spread 10 s
  #
  # The old figure said "260s fills to 10in => 26 s/inch". Measured at 11in it is 29.9 s/inch,
  # so the expectation was ~13% optimistic and sensor.hydro_fill_time read 286 s against a real
  # 329 s -- 43 s short. A fill that routinely overruns its own expected duration makes every
  # downstream judgement wrong: the watchdog budget, the blind-fill timeout, and the operator
  # reading "fill-timeout" and looking for a fault in the floats.
  #
  # 313 s is chosen so the DERIVED figure carries the owner's 15 s margin:
  #     11.0 * 313 / 10.0 = 344 s  =  measured 329 + 15
  #
  # IF THIS CHANGES AGAIN, CHECK hydro_pump_autooff_minutes IN THE SAME BREATH. The blind-fill
  # timeout fires at fill_time + 45, and the ZEN20 relay cuts itself at the auto-off; if the
  # guard lands after the hardware, the hardware wins silently and the guard is dead.
  # test-hydro-fill-guard-beats-hardware.py enforces that ordering.
  #
  # 285s drains 10" => 28.5 s/inch; the drain measured 295 s on 2026-11-04 (02:58:00 -> 03:02:55)
  # against a computed 324 s, so the drain figure is close enough to leave alone for now.
  hydro_fill_seconds:
    name: "Fill sec @ calib depth (system)"
    min: 5
    max: 900
    step: 1
    initial: 313
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-play
  hydro_drain_seconds:
    name: "Drain sec @ calib depth (system)"
    min: 5
    max: 900
    step: 1
    initial: 285
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-stop
  hydro_cal_depth_in:
    name: "Calibration depth (system)"
    min: 1
    max: 12
    step: 0.5
    initial: 10
    unit_of_measurement: in
    mode: box

  # How long a manual override lasts before reconciliation resumes by itself. Four hours covers
  # a long hands-on session; anything that legitimately needs longer should be re-armed
  # deliberately rather than by raising this, because the value of the expiry lies in it being
  # short enough that forgetting is survivable.
  hydro_override_hours:
    name: Hydro Override Duration
    min: 0.5
    max: 24
    step: 0.5
    initial: 4
    unit_of_measurement: h
    mode: box

  # Depth at which the hard-limit float reaches full articulation, measured 2026-08-16.
  # Declared rather than hardcoded because the stuck-float backstop is derived from it: the
  # bound is "long enough to have filled past the hard limit from empty", so if that float is
  # ever moved, the backstop has to move with it or it stops being a backstop.
  # 11in, NOT 13. Owner 2026-10-31: "it literally can't be 13in the buckets are only 12in deep."
  # The old default was physically impossible, and it is not inert — the stuck-float backstop is
  # derived from it ("long enough to have filled past the hard limit from empty"), so every bound
  # computed from it was sized for a depth the rig cannot reach. max lowered to 12 so the bucket
  # depth is enforced rather than just documented.
  hydro_hard_limit_depth_in:
    name: "Hard-limit float depth"
    min: 1
    max: 12
    step: 0.5
    initial: 11
    unit_of_measurement: in
    mode: box
    icon: mdi:ruler
  # LOWERED 300 -> 260 (2026-08-15). 300 s at the measured 26 s/inch is 11.5 INCHES of fill,
  # and the bucket's marked fill line — the engineered overflow, and the build doc's "one
  # catastrophic failure mode" — is at ~10". The failsafe was set ABOVE the ceiling it exists
  # to defend, so a runaway fill would have hit the overflow before the cutoff.
  #
  # 260 s == 10" exactly, at the 6-bucket calibration. It cannot truncate a legitimate fill:
  # the deepest scheduled target is 8" (208 s), and even raising it to 9" for the measured
  # ~9" root depth is 234 s.
  #
  # ⚠️ MIGRATING TO 12 BUCKETS DOUBLES THE RATE to ~52 s/inch, which makes 260 s only 5".
  # This number is calibration-dependent and must be re-derived, not carried over — the same
  # warning the build doc gives about the fill/drain times.
  #
  # ⚠️ CHANGING `initial:` DOES NOT CHANGE THE RUNNING SYSTEM. HA applies `initial` only when
  # there is no restored state, so the live entity keeps its current 300 until it is set
  # explicitly. Set input_number.hydro_fill_max_seconds to 260 in the UI as well; this edit
  # only makes a fresh deploy correct.
  # How long to let the buckets equalise before deciding whether the fill actually landed.
  #
  # 30s, not 15. Measured 2026-08-16: a fill that stopped at the 9" float settled back to
  # 7.5" once water gravity-fed out to the plant buckets — a 1.5" drop, a quarter of the
  # working range. Owner observed equalisation takes 30-60s. Re-checking at 15s means topping
  # up while the level is still falling, which overshoots and needs more passes to converge.
  hydro_settle_seconds:
    name: Settle wait before re-check
    min: 5
    max: 180
    step: 5
    initial: 30
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand

  # Day, counted from SOWING, at which flooding may begin.
  #
  # THIS IS THE GUARD THAT REPLACES A HUMAN. Under direct sowing the seed sits in a rockwool
  # cube in the bucket from day zero, and occupancy is true from day zero — so without this the
  # flood scheduler starts flooding the day you sow. That is not a theoretical objection: batch
  # 1 (sown 2026-07-06) was DISCARDED for damping off, "cubes kept saturated + low airflow,
  # seedlings collapsed flat and went white ~day 15". Flooding a fresh cube reproduces exactly
  # that.
  #
  # 14 days because the crop notes put roots through the bottom of the cube at ~d10 for Jericho
  # and ~d14-21 for basil; before roots reach the flood zone a flood only soaks the cube, and
  # after they do it is the only way the plant is fed. Raise it for a slow crop rather than
  # lowering it for impatience.
  # Days after sowing before the circulation fans are allowed to run. SEPARATE from
  # hydro_flood_start_day on purpose -- when to water and when to move air are different
  # decisions carrying different risks, and tying them together means tuning one silently
  # retunes the other.
  #
  # Default 21: a full week past the mature boundary (the tracker calls a batch mature at day
  # 14). Chosen deliberately high after the 2026-10-07 loss. Lower it when the canopy is
  # established enough that stagnant air is the bigger worry than drying out.
  # DAY 1. Owner 2026-10-31: "fans start day 1, but we flood to 11in to compensate and keep the
  # rockwool wet." The two are a pair and should not be split: airflow from day 1 dries rockwool
  # faster, and the deep soak is what offsets it. Changing one without the other is the failure
  # mode this comment exists to prevent.
  hydro_fan_start_day:
    name: "Fans start, days after sowing"
    min: 0
    max: 60
    step: 1
    initial: 1
    unit_of_measurement: d
    mode: box
    icon: mdi:fan-clock

  # How many times a short fill may drain and retry before the system stops trying and latches.
  # BOUNDED ON PURPOSE: the failure this recovers from is indistinguishable from a DEAD TARGET
  # FLOAT, and an unbounded retry against a dead float pumps the reservoir at the buckets forever.
  # ── TOP-UP DOSE CALCULATOR: HOW MUCH FRESH WATER WENT IN ──────────────────────────────────
  #
  # Requested 2026-10-25. Fresh water DILUTES the working solution, so the dose owed is reckoned against
  # the gallons ADDED, not the whole reservoir -- which is what docs/hydroponics-nutrient-dosing.md
  # means by dosing "the deficit volume".
  #
  # Set this to the gallons you poured in; the markdown card on the dashboard renders the grams and
  # millilitres. It is an input, not a measurement, and the card says so: the EC meter is the
  # authority and this is only the starting point.
  hydro_water_added_gal:
    name: "Fresh water added (gal) — for the dose calculator"
    min: 0
    max: 60
    step: 0.5
    initial: 0
    unit_of_measurement: gal
    mode: box

  hydro_fill_retry_max:
    name: "Short-fill retries before latching"
    min: 0
    max: 3
    step: 1
    initial: 2
    mode: box

  # ── RESERVOIR CAPACITY, MEASURED 2026-10-24. THIS IS WHY THREE FILLS FAILED. ────────────────
  #
  # ONE FILL TO 9" DRAWS ~15 GALLONS out of the reservoir. The reservoir was down to ~10 gallons,
  # so a 9" flood was physically impossible -- the level stalled around 7" every time and the fill
  # hit its timer. Observed three times (2026-10-23 08:44, 09:30, and the self-recovery retries)
  # and each time the system blamed a sensor or a lost pump command.
  #
  # I SPENT THE DAY ON THE WRONG LAYER. The fill is float-terminated, so when it never terminates
  # the suspicion falls on the float -- and day0 had never been proven, which made it a perfect
  # suspect. But the retry path falls back to 7.5" (the mid float, proven 2026-09-30) and THAT
  # failed too. Two different targets at two different heights, both unreached, water stopping at
  # the same ~7": that is not a sensor, that is not enough water. The owner found it by looking in
  # the reservoir, which no amount of log reading would have done.
  #
  # THE SYSTEM CANNOT SEE THIS, AND THAT IS THE REAL GAP. There is no reservoir level sensor, so
  # nothing can refuse a fill it has no water to finish -- it will always attempt, stall, and
  # latch, and every diagnosis will point at the floats. A float sensor on the reservoir at the
  # 15-gallon mark would turn an unexplainable timeout into "not enough water to flood to 9"".
  # Tracked separately; the calibration figure is recorded here so the next person has the number.
  #
  # RULE OF THUMB until there is a sensor: ~15 gal per 9" fill, ~10 gal gets you ~7". Top the
  # reservoir up before expecting a 9" flood.

  # 0 = FLOOD FROM THE SOW DAY. Owner 2026-10-31, from the crop itself: "the plants in the hydro
  # setup that stay wet grow the best... i want to change the logic and stop hand watering at all."
  #
  # This single value IS the hand-watering regime. binary_sensor.hydro_hand_water_due is
  # `age >= 0 and age < flood_start_day`, so 0 makes it permanently false and there is no
  # automation to delete — the window simply closes. 1 would leave a <24h window on the sow day.
  #
  # It replaces a 14-day dry fortnight justified by "flooding drowns the cube" before roots reach
  # the flood zone. That reasoning predicted the opposite of what the rig produced, and the rig
  # wins: staying wet grew better. The deep soak below is the compensating change.
  # HOW LONG THE DEEP SOAK LASTS. Owner 2026-10-31: "it needs to do that for like the first 2
  # weeks." A knob rather than a constant because "2 weeks" is an estimate from one crop, and the
  # next one will refine it — which is a value change, not a code change.
  #
  # Measured from the SOW DATE, not from stage_started: the deep soak is about the rockwool cube
  # staying wet, which starts at sowing regardless of when any stage transition happens to fire.
  hydro_deep_soak_days:
    name: "Deep soak (hard-limit float) days after sowing"
    min: 0
    max: 40
    step: 1
    initial: 21
    unit_of_measurement: d
    mode: box
    icon: mdi:waves

  hydro_flood_start_day:
    name: First flood, days after sowing
    min: 0
    max: 40
    step: 1
    initial: 0
    unit_of_measurement: d
    mode: box
    icon: mdi:sprout-outline

  # DRAIN HAS THE SAME LAG AS FILL, IN REVERSE. Measured by the owner 2026-08-16: the low float
  # goes dry and then another 1/2"-3/4" leaves the buckets over the following 10-15 seconds.
  # Gravity does not stop when the sensor does.
  #
  # 20s, not 15, so the window closes AFTER the observed lag rather than at its edge — the
  # measurement is "10-15 seconds", and a bound set at the top of an observed range converts
  # normal variation into intermittent faults.
  #
  # Separate from hydro_settle_seconds (30s) on purpose: that one waits for twelve buckets to
  # equalise through a shared manifold on the way UP, which is a slower process than water
  # falling out of them. Tying them together would mean tuning one to fix the other.
  # Duration for the ZEN20's OWN auto-off timer, in minutes — the device's unit, not ours.
  # It only accepts whole minutes (min 1), which is why this is not derived from the second-
  # based fill bounds: the granularity would round away any precision we pretended to have.
  #
  # SIX, revised down from seven on 2026-08-16 after checking what the margin COST at the
  # other end — which the first pass did not do:
  #
  #   overflow point   13"   = 338s
  #   7 min            420s  = 16.2"  -> ~82s pumping past overflow, roughly 10-15 gallons
  #   6 min            360s  = 13.8"  -> ~22s past overflow, roughly 2-4 gallons
  #
  # Six is still 20% above HA's own 300s fill ceiling and 54% above the longest real fill
  # (~234s empty to the 9" float), so it retains the property that actually matters: it cannot
  # fire during normal operation, and therefore will not be resented and switched off.
  #
  # The wider lesson is that "add margin" has a direction. Seven bought interference-immunity
  # already guaranteed at six, and paid for it in gallons on the floor.
  # ── REVERTED 8 -> 6 ON 2026-11-04. RAISING IT WAS MY MISTAKE. ───────────────────────────────
  # (internal MR) raised this to 8 minutes to keep the blind-fill software guard firing before the relay
  # cut itself. That optimised the wrong variable, and the comment immediately above had already
  # computed why: this bound is not "a backstop above the software ceiling", it is THE LAST THING
  # between a stuck fill relay and water on the floor, so it is governed by the OVERFLOW LINE.
  #
  # Recomputed with the MEASURED rate (329 s to 11in = 29.9 s/inch, not the 26 assumed above):
  #
  #     overflow line  13in  = 389 s
  #     6 min = 360 s -> 12.0 in   SAFE, still below the overflow
  #     7 min = 420 s -> 14.0 in   1.0 in past
  #     8 min = 480 s -> 16.0 in   3.0 in PAST THE OVERFLOW
  #
  # So 8 minutes put the last backstop three inches past the point where the buckets spill. The
  # slower measured rate actually makes 6 SAFER than the 2026-08-16 estimate assumed (12.0in
  # rather than 13.8in), so there was never a reason to move it.
  #
  # THE SOFTWARE GUARD DOES NOT GET TO SET THIS. If the blind-fill guard cannot fire before
  # 360 s, the guard's bound is what comes down -- see hydro_fill_blind_max_seconds, which
  # replaces the `fill_time + 45` derivation precisely so a fill-time re-calibration can never
  # push a safety bound outward again.
  hydro_pump_autooff_minutes:
    name: Pump hardware auto-off (ZEN20 firmware)
    min: 1
    max: 30
    step: 1
    initial: 6
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-lock-outline

  # How long a polish drain may run. Measured twice on 2026-08-25 (16:46 and 18:13): the low
  # float went dry 5 SECONDS after the pump started, both times. 45s is therefore a bound that
  # a healthy polish never reaches, not a duration anything is expected to use — if a polish
  # ever runs to this bound, the inflow is no longer the trickle this was written for.
  hydro_polish_max_seconds:
    name: Polish drain bound
    min: 10
    max: 120
    step: 5
    initial: 45
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand
  # Polishes per day past which this stops being routine and starts being a leak. At the
  # observed rate (water reaching the low float roughly hourly while idle) a normal day sits
  # well under this; crossing it means the inflow has grown.
  # Failed polishes in a row before this is called broken. Not 1: a single failure is within
  # the noise of a float settling or a pump not catching, and alarming on it recreates exactly
  # the hair-trigger this work set out to remove. Not 10 either — the drain either works or it
  # does not, and three attempts is enough to know.
  # Matches hydro_polish_max_consecutive_failures (3) deliberately: same question, same answer.
  # Three identical failures in a row is where "the logic can resolve this" stops being credible.
  hydro_fill_max_consecutive_faults:
    name: Consecutive fill faults before latching
    min: 1
    max: 10
    step: 1
    initial: 3
    mode: box
    icon: mdi:lock-alert

  hydro_polish_max_consecutive_failures:
    name: Consecutive failed polishes before alarming
    min: 1
    max: 10
    step: 1
    initial: 3
    mode: box
    icon: mdi:alert-octagon
  hydro_polish_max_per_day:
    name: Polish drains per day before alarming
    min: 1
    max: 48
    step: 1
    initial: 8
    mode: box
    icon: mdi:counter
  hydro_drain_settle_seconds:
    name: Drain settle wait (gravity lag)
    min: 5
    max: 120
    step: 5
    initial: 20
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand-complete

  # Bound on the top-up loop. Without it, a leak or a float that never stays wet is an
  # infinite pump. Four passes is far more than convergence needs: each top-up replaces only
  # what drained out of the fill bucket, so the deficit shrinks fast.
  # ── HOW LONG A SINGLE TOP-UP MAY PUMP ───────────────────────────────────────────────────────
  #
  # SEPARATE FROM hydro_fill_max_seconds, AND THAT CONFLATION IS WHAT BROKE 2026-11-04. The
  # repeat loop used the PRIMARY fill ceiling (600 s) as the timeout for EVERY iteration,
  # including top-ups, while the phase watchdog only budgets
  # max(fill_time, fill_max_seconds) + margin = 720 s for the whole `filling` phase. So:
  #
  #     primary fill            333 s   (reached 11in)
  #     settle                  +30 s
  #     top-up 1                +29 s   (reached 11in)
  #     settle                  +30 s
  #     top-up 2, dry          +358 s   <- entitled to 600 s, so it just kept pumping
  #     ------------------------------
  #     filling phase           780 s   vs budget 720 s -> watchdog killed it mid-top-up
  #
  # One dry top-up is therefore GUARANTEED to blow the phase budget before its own timeout can
  # fire, so the retry logic can never run to completion when water is short. Worse, the failure
  # always presents as the watchdog's "phase 'filling' stuck ... a pump command was almost
  # certainly lost" -- which sent the investigation at the pump and the Z-Wave strip on 10-23 and
  # again on 11-03, when both were fine and the reservoir was empty.
  #
  # 90 s is deliberately generous: every top-up that has ever SUCCEEDED took 28, 18, 14 or 29 s
  # (measured 11-03 and 11-04). 600 s was ~20x what the operation needs, and the only thing that
  # extra entitlement bought was a longer dry run against an empty reservoir.
  #
  # BOUNDED BY ARITHMETIC, NOT TASTE: the whole loop must fit the watchdog budget, so
  #     fill_time + (max_topups * (topup_max_seconds + settle_seconds)) + margin <= budget
  # test-hydro-topup-fits-phase-budget.py enforces exactly that, so raising this knob or
  # max_topups without raising the budget fails in CI rather than at 03:00 in the grow room.
  hydro_fill_topup_max_seconds:
    name: "Max seconds for ONE top-up (system)"
    min: 10
    max: 600
    step: 5
    initial: 90
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand

  # 4 -> 2 ON 2026-11-04, so the whole loop fits the phase watchdog budget WITHOUT touching the
  # watchdog. With the per-top-up bound above at 90 s:
  #     344 (primary) + 2 x (90 + 30 settle) + 120 (margin) = 704 s  <=  720 s budget
  # At 4 it was 944 s against 720 s, i.e. the designed loop could never complete inside its own
  # watchdog -- true before today's re-calibration as well, which is why the `filling` phase hit
  # 780 s and got killed on both 11-03 and 11-04.
  #
  # TWO IS ALSO ENOUGH ON THE MERITS, not just the arithmetic. The primary fill REACHES the
  # target -- 333 s to 11in, confirmed by the float, on both days. The level then equalises
  # across six buckets and settles just below the float, which no number of top-ups changes;
  # they are chasing an equilibrium, not finishing the job. Observed re-dry after the 30 s
  # settle: 8 s every time. Two attempts distinguishes "settled a little low, nudge it" from
  # "there is no water left", and the second answer is the one that matters -- it is the
  # reservoir, which the rig still cannot see .
  #
  # Raising this again requires raising the phase watchdog budget in the same change;
  # test-hydro-topup-fits-phase-budget.py fails otherwise.
  # ── 2 -> 0 ON 2026-11-04. TOP-UPS CANNOT SUCCEED ON THIS RIG, SO THEY ONLY CAUSE FAULTS. ────
  #
  # The primary fill REACHES the target float every time -- 324/328/334/333 s across four
  # measured cycles, float-confirmed. What happens next is physics, not a fault: the column
  # equalises across six buckets through the shared manifold and settles just below the float.
  # The re-dry after the 30 s settle was 8 s on EVERY observed occasion, never once longer.
  #
  # So a top-up is chasing an equilibrium it cannot change. What it actually does is drain the
  # remainder of the reservoir and then run the pump dry: on 11-03 three top-ups succeeded and
  # the fourth ran 266 s with no level rise; on 11-04 one succeeded and the second ran 358 s at
  # 13.5 W, which is below the wattage this system already recognises as a pump pulling air.
  # Every one of those ended in a latched fault and an the notification service.
  #
  # At 0 the loop runs once: fill to the target float, hold, drain. The `until` condition is
  # `target wet or repeat.index >= max_topups + 1`, so index 1 satisfies it and the primary fill
  # is unaffected. The flood still reaches 11in; it simply stops pretending it can hold it there.
  #
  # IF THE RESERVOIR LADDER  EVER MAKES TOP-UPS VIABLE, raising this requires raising
  # the phase watchdog budget in the same change -- test-hydro-topup-fits-phase-budget.py fails
  # otherwise -- and wants fresh evidence that a top-up can hold the level, which nothing has
  # demonstrated yet.
  # ── 0 -> 2 ON 2026-11-04. SETTING THIS TO 0 WAS MY MISTAKE, AND IT COST WATERING DEPTH. ─────
  #
  # I zeroed it hours earlier on the reasoning that "top-ups chase an equilibrium they cannot
  # change". That reasoning ignored the comment sitting directly above the loop they drive, which
  # states the actual mechanism:
  #
  #     "the floats sit in the FILL bucket, which leads the rest of the system: water
  #      gravity-feeds out to the plant buckets over 30-60s afterwards. Measured 2026-08-16 -- a
  #      fill stopped at the 9in float settled to 7.5in. The plants got 7.5in when the schedule
  #      said 9in."
  #
  # So a top-up is not cosmetic and it is not chasing the sensor. It is how the PLANT buckets
  # reach target depth rather than only the bucket the float lives in. At 0 the crop gets the
  # settled level, and the `never-settled` fault that followed was CORRECTLY reporting that
  # target was never reached.
  #
  # AND THEY DEMONSTRABLY WORK WHEN THERE IS HEADROOM. Every cycle on 10-31 and 11-01 was a 183 s
  # fill followed by top-ups of 16 s, 8 s and 6 s -- small, converging, successful, over and over.
  # They only grew and then failed once the target moved to 11in, which needs ~18 gal against a
  # reservoir whose reachable volume is the open question .
  #
  # 2 rather than the original 4 because that is what fits the phase watchdog budget:
  #     344 + 2 x (90 + 30) + 120 = 704 s  <=  720 s
  # test-hydro-topup-fits-phase-budget.py enforces it. The failure mode is also far cheaper than
  # it was this morning: the fill dry-run guard now stops a dry top-up in ~40 s instead of 358 s,
  # and a short fill escalates over three cycles instead of latching on the first.
  hydro_fill_max_topups:
    name: Max fill top-ups
    min: 0
    max: 10
    step: 1
    initial: 2
    mode: box
    icon: mdi:repeat

  # RAISED 260 -> 330 BECAUSE THE DEEP SOAK DOES NOT FIT UNDER 260.
  # Calibration is 260s for 10.0in, i.e. 26 s/in. An 11in fill therefore needs ~286s, so with the
  # old 260s ceiling the failsafe would cut EVERY deep flood short of its float and the cycle would
  # read as a stall — a new regime that faults on its first run. 330 is 286 + ~15% margin.
  #
  # Tradeoff, stated rather than buried: this also loosens the ceiling for shallow fills, where a
  # 7.5in flood now has 330s instead of 260s before the backstop bites. The float still stops those
  # first; the ceiling only matters when a float has failed, and in that case the depth-derived
  # expected duration (sensor.hydro_fill_time) is what flags the anomaly.
  # ── 330 WAS TERMINATING EVERY FILL. MEASURED 2026-11-02. ──────────────────────────────────
  # This is a FAILSAFE CUTOFF -- a backstop for a failed float -- and it had become the thing
  # that ends a normal fill. Two consecutive cycles, from HA's own history:
  #
  #     23:00:00 filling -> full at 23:05:32   = 332s
  #     01:30:00 filling -> full at 01:35:32   = 332s
  #
  # 332s twice, against a 330s cutoff, is not a coincidence: the fill is hitting the ceiling and
  # being cut off. input_boolean.hydro_fill_reached_target was `off` throughout, so the system
  # already knew it had not arrived -- and nothing escalated, because a cutoff-terminated fill
  # was not treated as a fault. The flood has not reached its target depth on any cycle today.
  #
  # THE CALIBRATION TABLE ABOVE IS ROUGHLY 2x OPTIMISTIC. It claims 260s/10in (26 s/in) and
  # predicts 9in = 234s. The fill ran 332s and had still not reached 9in, so the real rate is
  # at least 37 s/in -- and that is a floor, not a measurement, because it never arrived. The
  # drain half is worse: the table predicts 9in = 266s and tonight's drain took
  #
  #     01:40:32 draining -> empty at 01:49:50 = 558s
  #
  # which is 2.1x the model and 228s PAST the 330s drain cutoff. counter.hydro_watchdog_
  # recoveries_today and counter.hydro_latch_autoclears_today both read 1, stamped 01:49:50 and
  # 01:50:00 -- that overrun is what they are.
  #
  # WHY THE TABLE IS WRONG, probably: it was derived from one calibration at a single depth and
  # extrapolated linearly. Fill rate falls as the column rises (the pump works against more
  # head) and drain rate falls as it empties (less head to push it), so a linear s/in taken at
  # one depth under-predicts both ends. The table's own 11in row says drain = 324s against a
  # 330s cutoff -- SIX SECONDS of margin, which was never going to hold.
  #
  # SET FROM THE OBSERVED WORST CASE, NOT FROM THE MODEL: 600s. The float is the authority for
  # ending a fill; this number exists only to stop a runaway when a float has failed, so it
  # should be comfortably clear of any legitimate fill. Erring high costs a longer runaway in
  # the rare float-failure case; erring low costs every single cycle, which is what was
  # happening.
  hydro_fill_max_seconds:
    name: Hydro Fill Failsafe Cutoff
    min: 10
    max: 1200
    step: 1
    initial: 600
    unit_of_measurement: s
    mode: box
    icon: mdi:water-alert
  # Wattage below which the drain pump is judged to be pulling air rather than moving water.
  # MEASURED on this pump: 20-23 W loaded, 12.7-16.5 W once it starts sucking air (2026-08-16
  # drains + two probes 2026-08-22). 16 sits in that gap. Re-measure if the pump is replaced.
  # ── FILL PUMP DRY-RUN THRESHOLD ─────────────────────────────────────────────────────────────
  #
  # THE FILL PUMP HAD NO DRY-RUN DETECTION AT ALL UNTIL 2026-11-04, while the drain has had it
  # for months (hydro_drain_dry_watts below). That asymmetry cost a day of wrong diagnosis.
  #
  # Measured during the failed cycle of 2026-11-04, relay 3 wattage:
  #     13:05:02  20.7 W   primary fill, moving water
  #     13:08:01  21.1 W
  #     13:11:06  21.3 W   top-up 1, moving water, reached the float in 29 s
  #     13:12:05  16.8 W   top-up 2 -- supply failing
  #     13:15:04  13.5 W   still running, moving nothing
  #     13:18:02   0.0 W   phase watchdog finally killed the whole cycle
  #
  # A centrifugal pump draws LESS with no hydraulic load, so 21 -> 16.8 -> 13.5 W is the pump
  # losing its water supply. It ran like that for 358 SECONDS and nothing was watching. The
  # drain's own threshold for "pulling air" is 16 W, so the fill pump spent most of that below a
  # level this system already recognises as dry -- on the other pump.
  #
  # 15 rather than the drain's 16: the fill pump's loaded draw (20.7-21.3 W) and its dry draw
  # (13.5 W) are close enough that the gap is only ~7 W, so the threshold sits just under the
  # lowest dry reading observed rather than midway. Erring LOW is the safe direction here --
  # a missed dry run wastes water and mis-reports a fault, while a false positive stops a fill
  # that the next scheduler tick retries anyway.
  # ── WHERE THE BUCKETS SPILL. Every fill bound is checked against this. ──────────────────────
  # The buckets are 12in deep and the marked fill line / engineered overflow is at 13in of
  # equivalent column ((internal tracker) settled this; the file briefly claimed three different heights).
  # At the measured 29.9 s/inch that is 389 s of pumping from empty.
  #
  # IT IS A KNOB SO THE GUARDS CAN BE CHECKED AGAINST IT rather than each re-deriving a bound
  # from the fill calibration. On 2026-11-04 a fill-time re-calibration silently pushed BOTH the
  # hardware auto-off AND the stuck-float backstop past this line, because both were computed
  # from the fill rate and neither was ever compared with the thing that actually matters.
  hydro_overflow_depth_in:
    name: "Overflow / spill depth"
    min: 1
    max: 24
    step: 0.5
    initial: 13
    unit_of_measurement: in
    mode: box
    icon: mdi:waves

  # ── BLIND FILL CEILING, ABSOLUTE AND NOT DERIVED FROM THE FILL CALIBRATION ──────────────────
  # Used only when binary_sensor.hydro_floats_healthy is off -- when no float can be trusted to
  # stop the fill and a clock is all there is.
  #
  # It REPLACES `sensor.hydro_fill_time + 45`. That derivation is what let a routine accuracy fix
  # (fill_time 286 -> 344 s) move a SAFETY bound from 331 s to 389 s, landing it exactly on the
  # overflow line and past the hardware auto-off. A safety ceiling must not be a function of a
  # number that gets re-tuned for accuracy reasons.
  #
  # 340 s: just above the longest real fill to 11in (334 s, max of four measured cycles) and
  # comfortably under both the 360 s relay auto-off and the 389 s overflow. In blind mode the
  # fill cannot be verified anyway, so stopping just after a normal fill would have finished is
  # the correct bias -- an under-filled bucket is recoverable, a spill is not.
  hydro_fill_blind_max_seconds:
    name: "Blind fill ceiling (no trusted float)"
    min: 30
    max: 600
    step: 5
    initial: 340
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-alert

  # ── 9in -> 11in TRANSIT TIME, MEASURED. The 11in sensor's cross-check. ──────────────────────
  # Owner 2026-11-04: "if the 11" sensor fails, our backup logic is that if the 9" sensor goes
  # wet we cannot run for more than the time we know it to take for the 11" sensor to also go
  # wet."
  #
  # Measured across four consecutive cycles, 9in wet -> 11in wet:
  #     11-03 16:12:57 -> 16:15:24   147 s
  #     11-03 23:17:59 -> 23:20:28   149 s
  #     11-04 02:48:03 -> 02:50:34   151 s
  #     11-04 13:08:03 -> 13:10:33   150 s
  #                                  mean 149 s, spread 4 s
  #
  # 165 = 149 + the 15 s margin convention used for the fill calibration. The spread is 4 s, so
  # 15 s is ~4x the observed variation.
  #
  # WHY THIS IS THE STRONGEST GUARD ON THE RIG: it does not depend on the 11in float at all. It
  # fires precisely WHEN that float has failed, and it fires at 9in + 165 s, which is
  # 183 + 165 = 348 s -- below the 360 s relay auto-off and 41 s below the 389 s overflow. A
  # stuck-dry 11in float therefore costs an inch of over-fill, not a flooded floor.
  hydro_9_to_11_transit_seconds:
    name: "9in -> 11in transit (measured)"
    min: 30
    max: 600
    step: 5
    initial: 165
    unit_of_measurement: s
    mode: box
    icon: mdi:arrow-expand-up

  # ── NO CURRENT IS NOT A DRY PUMP ──────────────────────────────────────────────────────────
  # A centrifugal pump pulling air still SPINS, and this rig's own measurements say so:
  # loaded 20.7-21.3 W, dry 13.5-16.8 W (2026-11-04, relay 3). It never reaches zero.
  #
  # So a reading at or near 0 W is a DIFFERENT FAILURE: the relay reports 'on' but no current is
  # flowing -- a dead pump, an unplugged or failed cord, or an outlet that did not actually
  # energise. On 2026-11-21 the fill pump read 0.0 W for the full 40 s the guard waits, and the
  # system told the owner "it has lost its supply ... check the reservoir level". The reservoir
  # held 36 gallons, the buckets were dry, and nothing had moved. He spent the diagnosis arguing
  # with arithmetic that could not be made to work, because the message named the wrong cause.
  #
  # 5 W, not 1: the aim is to separate "no current" from the 13.5 W floor of a dry pump, and
  # anything under 5 W on this strip is noise rather than a motor turning.
  hydro_fill_no_current_watts:
    name: "Fill pump no-current threshold"
    min: 0
    max: 20
    step: 0.5
    initial: 5
    unit_of_measurement: W
    mode: box
    icon: mdi:power-plug-off

  hydro_fill_dry_watts:
    name: "Fill pump dry-run threshold"
    min: 1
    max: 100
    step: 0.5
    initial: 15
    unit_of_measurement: W
    mode: box
    icon: mdi:water-pump-off

  hydro_drain_dry_watts:
    name: Hydro Drain Dry-Run Watts
    min: 1
    max: 100
    step: 0.5
    initial: 16
    unit_of_measurement: W

  # 330 WAS ALREADY BEING EXCEEDED. Tonight's drain ran 558s (01:40:32 -> 01:49:50), 228s past
  # this cutoff, and tripped the watchdog plus a latch autoclear. The earlier cycle drained in
  # 237s, so the spread on the SAME nominal depth is 237-558s -- which is itself the argument
  # against a tight number here: drain time depends on how much got in, and the fill is
  # variable. 900s: the observed worst case plus room, still well inside the 1200 ceiling.
  hydro_drain_max_seconds:
    name: Hydro Drain Failsafe Cutoff
    min: 10
    max: 1200
    step: 1
    initial: 900
    unit_of_measurement: s
    mode: box
    icon: mdi:water-alert
  # How long past a phase's EXPECTED duration before the watchdog calls it stuck.
  # Generous on purpose: a Z-Wave blip of a few seconds must not trip it (the 2026-07-30
  # firmware update took the strip away for 21s mid-cycle and was harmless).
  # HOW OFTEN A PERSISTENT HEALTH CONDITION MAY RE-ANNOUNCE ITSELF.
  #
  # The health report is level-triggered (it asks "is this true now?" every 5 minutes), which is
  # right for DETECTION and wrong for NOTIFICATION: a condition that stays true re-sent itself
  # every cycle, 11 times in 2.5 hours on 2026-09-16. Dropping it from urgent to default priority
  # stopped it overriding Do Not Disturb but did not stop the pinging, because the volume was
  # never about priority.
  #
  # The counter is what carries repetition now — one message saying "watchdog recoveries today: 7"
  # tells you more than seven messages saying it once each.
  hydro_health_notify_interval_minutes:
    name: Hydro health re-notify interval (system)
    min: 15
    max: 1440
    step: 15
    initial: 360
    unit_of_measurement: min
    mode: box
    icon: mdi:bell-sleep

  hydro_phase_stuck_margin:
    name: Hydro Phase Stuck Margin (system)
    min: 30
    max: 900
    step: 10
    initial: 120
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-alert
  # DWELL FOR A DEEP (11") FLOOD, SEPARATE FROM THE NORMAL ONE. Owner 2026-10-31: "i want it to
  # flood for much shorter since the rockwool is going to absorb a lot of water. we essentially
  # only need a couple minutes."
  #
  # A deep flood and a shallow one are not the same event. At 11" the water reaches the rockwool
  # cube directly and the cube takes up what it needs quickly, so holding for the normal 300s
  # leaves the roots submerged long after the uptake has happened -- and ebb-and-flow depends on
  # the drain for oxygenation, so a longer hold is not a free "more water".
  hydro_deep_hold_seconds:
    name: Hydro Deep Flood Hold (dwell at 11in)
    min: 0
    max: 900
    step: 10
    initial: 120
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand-complete

  hydro_flood_hold_seconds:
    name: Hydro Flood Hold (dwell at depth)
    min: 0
    max: 1800
    step: 10
    initial: 300
    unit_of_measurement: s
    mode: box
    icon: mdi:timer-sand

  # How long a float may go without proving it can still move before it is called unproven.
  #
  # 35 rather than 30: the test is a monthly job done by hand, and a threshold set exactly at
  # the cadence turns "done on the 3rd instead of the 1st" into an alert. A guard that cries
  # during normal behaviour is a guard that gets muted, and a muted proof-of-life is worse
  # than none because it still looks like coverage. Same reasoning as the six-minute auto-off
  # sitting above HA's own fill ceiling rather than at it.
  hydro_float_proof_max_days:
    name: Float proof valid for
    min: 7
    max: 180
    step: 1
    initial: 35
    unit_of_measurement: d
    mode: box
    icon: mdi:calendar-check

  # How long Float Test stays armed before it clears itself. Twenty minutes is generous for
  # six floats and short enough that walking away mid-test does not leave the latch suppressed
  # overnight. The bound matters more than the number: an unbounded test mode is indis-
  # tinguishable from a permanently weakened guard, and the same reasoning already retired
  # the open-ended manual override.
  hydro_float_test_minutes:
    name: Float test window
    min: 5
    max: 60
    step: 5
    initial: 20
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-outline

  # ── HOW OLD A pH CALIBRATION MAY BE BEFORE THE PROBE STOPS BEING TRUSTED  ─────────
  # 45 days sits inside the 30-60 day budget hydroponics-build.md records for a double-junction
  # probe in a nutrient reservoir. Tunable because probe age changes it: a new probe holds
  # calibration far better than one six months in, and the honest response to a probe that is
  # drifting is to shorten this, not to ignore the sensor.
  #
  # This is a DOSING gate, not a watering gate. Exceeding it must never stop the pumps — the
  # plants still need water from a reservoir whose pH nobody has checked recently. It stops
  # automatic ACID ADDITION, which is the thing that can kill a crop if aimed by a bad number.
  hydro_ph_cal_max_age_days:
    name: "pH calibration max age"
    min: 7
    max: 180
    step: 1
    initial: 45
    unit_of_measurement: d
    mode: box
    icon: mdi:calendar-alert

counter:
  # Completed fill/drain cycles today. Incremented only on draining -> empty, i.e. a cycle that
  # actually finished, so a flood that never drained does NOT count toward the day's watering.
  # Reset at midnight; every crop profile's light window sits inside a single calendar day
  # (earliest on 06:00, latest off 22:00), so midnight never splits a window.
  # Floods that were DUE and declined because the floats could not be read (fail-closed, owner
  # 2026-09-29). A per-day rate for the same reason as the polish and watchdog tallies below:
  # "we skipped 4 waterings today" is the actionable sentence, and a counter that climbed
  # forever would cross any threshold on an arbitrary afternoon for unrelated reasons.
  #
  # ALSO THE ANTI-SPAM CARRIER. Quiet hours can suppress the notice; they cannot suppress this,
  # so the first message after 07:00 reports everything the night swallowed.
  hydro_floods_held_today:
    name: Hydro floods held today
  # Retries consumed today. Reset alongside hydro_cycles_today so a bad morning cannot mute the
  # afternoon.
  hydro_fill_retries_today:
    name: "Short-fill retries used today"
    initial: 0
    step: 1

  hydro_cycles_today:
    name: Hydro cycles completed today
    initial: 0
    step: 1
    minimum: 0

  # Polish drains run today. A polish is the automatic 'the idle bucket has water in it again,
  # pump it out' action below. It is counted because the COUNT is the signal: one or two a day
  # is the known slow seep, and a climbing count is that seep getting worse. Silently pumping
  # forever would hide exactly the trend worth seeing.
  # HOW MANY TIMES THE WATCHDOG HAD TO SAVE US TODAY.
  #
  # The watchdog recovers a stalled cycle every time it fires, which is why a lost drain command
  # has never damaged a crop. What was missing is that eleven recoveries and one recovery looked
  # identical from outside: each announced itself once, urgently, with no sense of repetition.
  # Counting them makes "this is happening every cycle" expressible — which is the actionable
  # sentence, where "failsafe tripped" repeated eleven times is not.
  #
  # Mirrors hydro_polish_drains_today, which already does exactly this for polish drains.
  hydro_watchdog_recoveries_today:
    name: Hydro watchdog recoveries today
    initial: 0
    step: 1
    icon: mdi:shield-refresh

  hydro_polish_drains_today:
    name: Hydro polish drains today
    initial: 0
    step: 1
    minimum: 0

  # CONSECUTIVE failed polishes, reset the moment one succeeds. Separate from the daily tally
  # because they answer different questions: the tally asks "is the seep getting worse", this
  # asks "has the drain stopped working". One failed polish can be a float settling oddly or a
  # pump that did not catch; three in a row cannot.
  # ── THE LATCH RETRY PROBE'S TWO TALLIES ───────────────────────────────────────────────────────
  # Both are PER-DAY rates and both reset at midnight with the others.
  hydro_drain_probes_today:
    name: Hydro drain retry probes today
    initial: 0
    step: 1
  # SEPARATE FROM THE PROBE COUNT ON PURPOSE. Probes that change nothing are cheap and expected;
  # a latch that keeps CLEARING is the interesting number, because a fault that needs an hourly
  # nudge to go away is a mechanical problem being papered over. This is the counter that stops
  # the self-healing from hiding a sideways pump.
  hydro_latch_autoclears_today:
    name: Hydro fault-latch auto-clears today
    initial: 0
    step: 1

  hydro_polish_consecutive_failures:
    name: Hydro consecutive failed polish drains
    initial: 0
    step: 1
    minimum: 0

  # ── HOW MANY TIMES IN A ROW A *RESOLVABLE* FILL FAULT HAS HAPPENED ──────────────────────────
  #
  # Owner 2026-11-04: "the human needs to set and clear the manual maintenance work toggle and
  # only use the latch if the logic can't resolve the problem."
  #
  # A fill that times out short of the target IS resolvable: the flood already happened, the
  # drain returns the water, and the next cycle's primary fill works -- measured, repeatedly. So
  # latching on the first occurrence suspends every subsequent flood for a condition the rig
  # recovers from on its own, which is the opposite of what the latch is for.
  #
  # But "resolvable" is a claim, and after enough identical failures the claim is false. This
  # counter is how the system decides which it is: retry, and escalate to a latch only once it
  # has DEMONSTRATED it cannot resolve the problem. Reset on any fill that reaches target.
  hydro_fill_faults_consecutive:
    name: Hydro consecutive resolvable fill faults
    initial: 0
    step: 1
    minimum: 0

input_datetime:
  # Stamped only by a successful auto-clear, so "when did the system last decide the fault had
  # gone away by itself" is answerable without reading the log.
  # WHEN THE RECOVERY-EXHAUSTED ALARM LAST FIRED. The dedupe for that alarm lives here rather
  # than in its trigger, because a rising-edge trigger cannot fire when the condition is already
  # true as HA starts -- which is the common case, since a wet tank does not drain itself while
  # HA is down. Observed on 2026-11-04: the sensor came up 'on' at 02:22:30 after a config
  # restart and the alarm's last_triggered stayed None.
  hydro_recovery_alarm_last:
    name: Recovery-exhausted alarm last sent
    has_date: true
    has_time: true

  hydro_last_latch_autoclear:
    name: Hydro last fault-latch auto-clear
    has_date: true
    has_time: true
  # THE INSTANT FROM WHICH counter.hydro_cycles_today HAS ACTUALLY BEEN WATCHING.
  #
  # The deficit check compares a count against a wall-clock expectation, and those two are only
  # comparable if they cover the SAME window. They did not. `expected_by_now` was prorated from
  # lights-on, while the counter can only count cycles that completed while it existed and was
  # observing. On 2026-08-22 the counter helper was created at 09:06 by the deploy that
  # introduced it; the day's one completed cycle had finished at 08:51, fifteen minutes earlier.
  # The tally therefore read 0 against an expectation of 2.1, and the observer spent the morning
  # reporting a watering failure while the pump was working correctly.
  #
  # A false "not watering" alert is not a cosmetic bug. This system's actual failure mode is a
  # silent six-day gap, and the defence against it is a human who believes these alerts. Alarms
  # that cry wolf are how that defence gets switched off.
  #
  # Set to lights-on by the midnight reset, and advanced by the trust guard whenever the counter
  # is found at zero with a flood already on the record for today.
  hydro_tally_since:
    name: Hydro cycle tally observing since
    has_date: true
    has_time: true

  # When the manual override lapses and reconciliation resumes on its own.
  #
  # THE EXPIRY IS THE POINT, not a convenience. The failure mode of a manual-override flag is
  # forgetting it is on, and a forgotten override is precisely the silent-drift bug this whole
  # change exists to fix — only sanctioned, so nothing would ever flag it. Auto-expiry bounds
  # the worst case to hours instead of indefinitely. Extend it deliberately if a job runs long;
  # do not remove it.
  hydro_override_expires:
    name: Hydro Override Expires
    has_date: true
    has_time: true
  hydro_last_flood:
    name: Hydro Last Flood Timestamp
    has_date: true
    has_time: true

  # ---- CYCLE OBSERVER STAMPS -------------------------------------------------------------
  # One timestamp per stage of a flood cycle, so an INCOMPLETE cycle is visible after the fact
  # — including across a restart, which is exactly the case nothing could see before.
  #
  # hydro_phase_watchdog only catches a phase that is STUCK. On 2026-08-22 a cycle reached
  # `full` at 14:33:48, Home Assistant was restarted by a config deploy ~90s later, and the
  # phase came back as `empty` while the buckets were still flooded. Nothing was stuck, so
  # nothing fired; the cycle simply ceased to exist and the water sat there. These stamps
  # persist, so "we recorded a full and never recorded an empty" survives the restart that
  # erased the cycle itself.
  # When the health report last actually notified. Only the throttle reads this.
  hydro_health_last_notified:
    name: Hydro health last notified
    has_date: true
    has_time: true

  hydro_t_fill_start:
    name: Hydro Cycle - fill started
    has_date: true
    has_time: true
  hydro_t_full:
    name: Hydro Cycle - reached full
    has_date: true
    has_time: true
  hydro_t_drain_start:
    name: Hydro Cycle - drain started
    has_date: true
    has_time: true
  hydro_t_empty:
    name: Hydro Cycle - back to empty
    has_date: true
    has_time: true

  # When the deadlock recovery below last ran. Rate-limits it: a stuck float would otherwise
  # have it drain hourly forever, which is a pump-destroying loop dressed up as self-healing.
  # When the last "flood held, floats unreadable" notice went out. Gates that notice to once
  # per missed flood instead of once per 5-minute scheduler tick. Read via its `timestamp`
  # attribute, never as_timestamp(state) — see the note at the notice's call site.
  hydro_last_held_notice:
    name: Hydro - last flood-held notice
    has_date: true
    has_time: true
  hydro_t_recovery_drain:
    name: Hydro Cycle - last deadlock recovery
    has_date: true
    has_time: true
  # PERSISTED at fill start so startup recovery can drain PROPORTIONALLY to how long the
  # fill actually ran (avoids running the drain pump dry for minutes on a short/partial fill).
  hydro_fill_started:
    name: Hydro Fill Started
    has_date: true
    has_time: true
  # Set when Buckets Occupied flips on; drives the growth-stage flood depth schedule.
  hydro_stage_started:
    name: Hydro Stage Started
    has_date: true
    has_time: true
  # Stamped when Growth Stage goes to `germination`. Drives the automatic
  # germination -> seedling step at day 3.
  hydro_sow_date:
    name: Hydro Sow Date
    has_date: true
    has_time: true

  # ── PER-FLOAT PROOF-OF-LIFE ────────────────────────────────────────────────────────────
  #
  # LAST TIME EACH FLOAT WAS OBSERVED TO ACTUALLY MOVE. A float that changes state has proven
  # the entire signal path in one event: the reed closed or opened, the KC868 read it, the
  # value reached HA. Nothing short of a transition proves that — a float reporting a steady
  # `off` forever is indistinguishable from a float that is disconnected, which is precisely
  # what `hydro_floats_healthy` warns about in its own comment ("detects absence, not
  # dishonesty").
  #
  # WHY THIS IS PERSISTED RATHER THAN READ FROM last_changed. HA rewrites `last_changed` on
  # restart when it restores entities. Measured on this system 2026-08-22: a cycle ran at
  # 17:05-17:16 UTC, HA restarted at 18:06, and afterwards all six floats reported
  # last_changed = 18:06. A stuck float would therefore look freshly exercised after every
  # deploy — the check would read healthy forever, which is the (internal MR) failure exactly: a check
  # that cannot fail is indistinguishable from one that is passing. input_datetime survives
  # restarts, so it records what actually happened rather than when HA last woke up.
  #
  # THE FLOATS BELOW THE TARGET STAMP THEMSELVES. Every normal cycle drives them wet on the
  # fill and dry on the drain, so their proof is never more than a few hours old and this
  # costs no attention. The floats ABOVE the current target are the point: at the `mature`
  # stage the target is the mature float, which means `mid`, `day0` and `hard_limit` are
  # NEVER wetted and nothing exercises them at all. `day0` becomes load-bearing the moment a
  # new crop is sown at germination, and `hard_limit` is the last line before water on the
  # floor next to the rack. Those three go stale on their own and ask to be tested by hand.
  #
  # THE STAMPS THEMSELVES LIVE IN input_text, NOT input_datetime — see the block under
  # `input_text:` below for why. Short version: input_datetime has no way to say "never".

  # When the armed Float Test window closes. Safe as an input_datetime because it is WRITTEN
  # every time the mode is armed, so it never has to mean "never" — the ambiguity that made
  # the proof stamps unusable does not arise here. It is read only while the boolean is on.
  hydro_float_test_expires:
    name: Float test expires
    has_date: true
    has_time: true

input_text:
  hydro_cultivar:
    # The VARIETY, which input_select.hydro_crop deliberately does not carry: that selector
    # drives the light window and flood cadence, so its options are physiological classes
    # ("Lettuce (leaf/romaine)") and adding cultivars to it would multiply the list without
    # changing a single timing decision.
    #
    # The grow log groups batches by crop name with the parenthetical stripped, so a sowing
    # filed as "Lettuce" can never be matched by a harvest logged as "Jericho lettuce". This
    # field is what lets the automatic sowing write the same name a human would type.
    name: Cultivar (grow log)
    icon: mdi:sprout
    max: 64
    initial: "Jericho lettuce (romaine)"

  # ── THE LAST FIVE FILLS: WHEN, HOW STARTED, AND HOW DEEP IT ACTUALLY GOT ──────────────────
  #
  # The third column is the one that matters, and it is NOT the target -- it is the depth the water
  # REACHED, read off the highest float actually wet when the pump stopped.
  #
  # That distinction is the whole reason this exists. Every failure this week looked like a success
  # somewhere: counter.hydro_cycles_today read 3 on a day with ZERO completed fills, and a run
  # targeting 9" that stalled at 7" got read as "it stopped at 7 inches" rather than "it never got
  # there". A log of targets would repeat that lie. A log of achieved depth cannot.
  #
  # 255 CHARS IS THE input_text CEILING, so the format is terse by necessity: "10-24 14:32 man 7in"
  # is ~19 chars, and five fit in ~100. Newest first, so truncation eats the oldest row.
  # ── WHY THE LATCH SET. WITHOUT IT, CLEARING IS GUESSWORK. ─────────────────────────────────
  #
  # Owner, 2026-10-24: "we need to clear the fault depending on what set the fault latch to begin
  # with". One boolean covers faults that mean completely different things, so nothing could judge
  # whether a later success disproved the original problem -- and the latch was cleared by hand
  # three times in two days.
  #
  # SOME FAULTS A GOOD CYCLE DISPROVES. Some it cannot:
  #   fill-timeout / watchdog-stall -> a cycle that reaches depth and drains PROVES the path
  #                                    works. Safe to clear automatically.
  #   hard-limit / float-disagree   -> a HARDWARE claim. A later good cycle does not prove a
  #                                    sensor is trustworthy. The 2026-10-21 trip was a drain-pump
  #                                    cord holding a bobber wet; a successful fill afterwards
  #                                    would not have unsnagged anything. These stay for a human.
  # NO `initial:`. It used to be "", so every HA restart erased the reason the latch had
  # tripped. Measured 2026-11-04: the restart at 02:22:22 wiped "never-settled", which was the
  # record of that morning's failed fill, while the fault itself was still live. The restarts
  # that destroy this field are the ones that FOLLOW an incident, so it was reliably empty
  # exactly when it mattered. Without `initial:` HA restores the last value.
  hydro_fault_reason:
    name: "Why the fault latched"
    max: 40

  # NO `initial:`, same reason as hydro_fault_reason above. This had read
  #   "11-03 09:18 auto LIMIT | 09:17 auto LIMIT | 09:1..."
  # which is the evidence that the fill was hitting its ceiling rather than reaching target --
  # and the restart replaced it with "". A log that is cleared by the event you want to
  # investigate is not a log.
  hydro_fill_log:
    name: "Last 5 fills (newest first)"
    max: 255

  # NO `initial:`. It was "Idle — no plants", so every restart announced an empty rig. On
  # 2026-11-04 that fired over a day-26 lettuce crop with occupancy on and growth stage mature.
  #
  # The sensor.hydro_status TEMPLATE was already fixed for precisely this in (internal MR), and its
  # comment says why: "A status that contradicts the grow log is worse than no status: it
  # invites someone to 'fix' the thing that is working." The template learned not to say it;
  # the input_text behind it kept resetting to the exact string.
  #
  # With no `initial:` a genuine first boot reads `unknown` until an automation writes, which is
  # within a minute. An honest `unknown` for a minute beats a confident falsehood indefinitely.
  hydro_status:
    name: Hydro Status
    max: 120

  # ── PER-FLOAT PROOF-OF-LIFE STAMPS ─────────────────────────────────────────────────────
  #
  # ISO timestamp of the last observed transition, or EMPTY for "never proven".
  #
  # THESE WERE input_datetime FOR ONE DEPLOY AND IT REPORTED THE OPPOSITE OF THE TRUTH.
  # An input_datetime with no `initial:` does not come up empty or at the epoch — HA gives it
  # TODAY AT MIDNIGHT. So on first deploy all six floats read as proven half a day ago, the
  # staleness sensor said `off`, and `unproven` came back `[]`. Six floats that had never once
  # been exercised were reported as healthy, and the three above the waterline — the entire
  # reason this exists — would have sat falsely confident for a full 35 days before saying so.
  #
  # `initial:` is not the fix. For input_datetime it is re-applied on every start, so it would
  # reset the proof record on every config deploy, which is worse: the stamps would never age
  # past the last restart and the check could never fire at all.
  #
  # input_text has an unambiguous empty state that no default can be confused with, and
  # as_timestamp('', 0) is 0, so "never proven" is genuinely distinguishable from "proven at
  # some particular time". The check now fails toward nagging rather than toward calm.
  #
  # This is the same bug this whole package keeps producing and the reason the pattern is
  # worth naming: a guard whose default reads as PASSING is indistinguishable from a guard
  # that works, and the only way to tell is to look at it after it ships.
  hydro_float_proven_low_guard:
    name: Float proven — low_guard
    max: 40
  hydro_float_proven_low_second:
    name: Float proven — low_second
    max: 40
  hydro_float_proven_6_inch:
    name: Float proven — 6 in
    max: 40
  hydro_float_proven_7_5_inch:
    name: Float proven — 7.5 in
    max: 40
  hydro_float_proven_9_inch:
    name: Float proven — 9 in
    max: 40
  hydro_float_proven_11_inch:
    name: Float proven — 11 in
    max: 40

  # ── NO pH CALIBRATION STAMP HELPER HERE, AND THAT IS DELIBERATE  ──────────────────
  # The obvious design is an input_text stamped by an automation on each calibration press, in
  # the same shape as the float proof stamps above. It was written that way first and then
  # removed, because HA ALREADY KEEPS THIS and keeping it twice is how the two diverge.
  #
  # A `button` entity's STATE IS THE ISO TIMESTAMP OF ITS LAST PRESS. Measured live on
  # 2026-10-06 against the real KC868:
  #
  #   button...ph_cal_mid_7_0_do_first  = 2026-10-02T03:51:16+00:00
  #   button...ph_cal_low_4_0           = 2026-10-02T03:59:49+00:00
  #   button...ph_cal_high_10_0         = 2026-10-02T04:07:17+00:00
  #   button...ph_clear_calibration     = unknown          <- never pressed
  #
  # Those are the three presses the pH calibration runbook records as its worked example, in
  # order, eight minutes apart, and they survived every restart since. So the authoritative
  # record of "when was this probe calibrated" already exists, persisted, with no helper and no
  # automation to forget to fire.
  #
  # `unknown` for a never-pressed button is the unambiguous empty state the float stamps needed
  # an input_text to get, so the gate still fails closed on a probe nobody has ever calibrated.
  #
  # This also removes the failure mode where the stamp says "calibrated" because an automation
  # ran while the calibration itself silently did not take — the stamp and the event are now the
  # same fact rather than two facts that have to agree.

# ---------------------------------------------------------------------------
# TRACKER OCCUPANCY POLL — the LEVEL-triggered half of the tracker integration.
#
# WHY THIS EXISTS: the webhook (hydro_tracker_bridge) is EDGE-triggered — the tracker
# pushes buckets_occupied only when the grow log is mutated, and never again. The payload
# was always a FACT computed from the whole log, but the DELIVERY was edge-only, so any
# event that reset HA's copy of that derived state — an entity rename (2026-07-30), a
# restore, a hand toggle — produced a divergence that nothing would ever heal. It sat
# wrong until a human happened to log a grow event. Same bug class the climate push already
# solved with its 15-min heartbeat; occupancy just never got one.
#
# The state is deliberately two LITERALS, `occupied` / `empty`. A failed fetch leaves this
# sensor `unavailable` and a garbled body leaves it `unknown` — and neither is `empty`.
# That asymmetry is the whole safety property: a tracker OUTAGE must never be readable as
# "the buckets are empty", because that would stop a live grow. Assert the body, not the 200.
# ---------------------------------------------------------------------------
rest:
  - resource: "<internal url>"
    scan_interval: 300
    timeout: 15
    sensor:

      - name: "Hydro Tracker Occupancy"
        unique_id: hydro_tracker_occupancy
        icon: mdi:clipboard-check-outline
        value_template: >-
          {{ ('occupied' if value_json.buckets_occupied else 'empty')
             if value_json.buckets_occupied is defined else 'unknown' }}
        json_attributes:
          - buckets_occupied
          - batches_in_buckets
          - crop
          - ha_crop
          # Lifecycle state (tracker MR agent-native-host!81). Occupancy already self-healed
          # from this endpoint; stage and dates did not, because the tracker never published
          # them — so HA derived them locally and the two could disagree forever with nothing
          # able to notice. On 2026-08-16 one did: germination was selected by hand to test
          # flood depth, which moved the light window to germ_on (16:00), and it surfaced
          # hours later as "the grow lights aren't on".
          #
          # An older tracker build simply omits these, so every consumer below treats a
          # missing attribute as "no opinion" rather than as a value.
          - derived_stage
          - sown_date
          - matured_date
          - stage_started_date
          - days_in_stage

# ---------------------------------------------------------------------------
# CROP PROFILE TABLE — the one place schedules live. Exposed as an attribute on
# sensor.hydro_active_profile; automations read it. Edit here to tune a crop.
#   on/off = grow-light window (photoperiod); floods = flood cycles per lights-on
#   day; ec/ph = reservoir targets (reference for mixing; not enforced by HA).
#   germ_on/seed_on = the two EARLIER-STAGE start times used by direct-sown batches
#   (input_select.hydro_growth_stage). All three windows share the crop's ONE `off`
#   time, so "dusk" never moves as the plant advances — only dawn walks earlier.
#   Rule: seed_on = off - 10h, germ_on = off - 4h. Rationale, incl. why 10h and why
#   the germination block lands in the room's coolest hours, is in hydroponics-build.md
#   ("Dry-stage lighting"). Do not retune these without re-reading that section.
# Spinach/arugula get SHORT days (long days bolt them); basil/herbs 16h + warmth;
# lettuce 14h balanced; strawberries day-neutral ~12h.
# ---------------------------------------------------------------------------
template:
  - sensor:
      # THE STATUS, DERIVED FROM STATE. The text field cannot be trusted; this can.
      #
      # input_text.hydro_status is free text written from 42 different places, and nothing ever
      # revisits it. On 2026-08-22 it read "Idle - no plants" while input_boolean.hydro_occupied
      # was ON with a 31-day-old crop. An agent read that string, believed it, and ran the drain
      # pump on a planted system. A human would have made the same call - the field is the first
      # thing you look at and it is named as though it were authoritative.
      #
      # This sensor is computed from state on every evaluation, so it CANNOT go stale. The
      # mirror automation copies it back into the text field whenever nothing is alarming, so
      # the old entity self-heals instead of needing 42 call sites rewritten.
      #
      # Fault text is passed through rather than regenerated: a guard that trips writes a
      # specific, diagnosed reason ("drain pump pulling air", "hard limit float wet") and
      # replacing that with a generic "FAULT" would throw away the only useful part.
      - name: "Hydro Status"
        unique_id: hydro_status_derived
        icon: mdi:information-outline
        state: >
          {% if is_state('input_boolean.hydro_maintenance','on') %}
            Maintenance — hands-on work in progress
          {% elif is_state('input_boolean.hydro_fault_latch','on') %}
            {{ states('input_text.hydro_status') }}
          {% elif is_state('input_boolean.hydro_occupied','off') %}
            {# OCCUPANCY OFF NO LONGER MEANS "NOTHING PLANTED", and reading it that way told the
               owner his freshly sown crop did not exist.

               Since (internal tracker)/(internal MR) occupancy deliberately stays OFF from sowing until flooding is
               due, because healing it ON early is what forced the growth stage to `mature` on
               day 0, ran the fans and killed a crop. That fix was right, but this line was
               written when `occupied == off` genuinely did mean an empty rig, so for the whole
               pre-flood window the dashboard now reports "Idle — no plants" over six buckets of
               germinating seed. A status that contradicts the grow log is worse than no status:
               it invites someone to "fix" the thing that is working.

               So: a known SOW DATE means there IS a crop, whatever occupancy says. Age is
               computed from that date rather than sensor.hydro_plant_age, which returns -1
               while occupancy is off -- i.e. throughout exactly this window. #}
            {% set sd = states('input_datetime.hydro_sow_date') %}
            {% set fsd = states('input_number.hydro_flood_start_day') | float(14) %}
            {% if sd in ['unknown','unavailable',''] %}
              Idle — no plants
            {% else %}
              {% set age = ((as_timestamp(now()) - as_timestamp(sd)) / 86400) %}
              {% if age < 0 %}
                Idle — no plants
              {% else %}
                {% set left = (fsd - age) | round(0, 'ceil') | int %}
                Sown {{ as_timestamp(sd) | timestamp_custom('%b %-d') }} —
                {{ states('input_select.hydro_growth_stage') }}, day {{ age | round(0, 'floor') | int }}.
                {% if left > 0 %}Hand-water; flooding arms in {{ left }} day{{ 's' if left != 1 }}.
                {% else %}Flooding is due — occupancy has not armed yet.{% endif %}
              {% endif %}
            {% endif %}
          {% else %}
            {% set phase = states('input_select.hydro_phase') %}
            {% set crop = states('input_select.hydro_crop') %}
            {% set n = states('counter.hydro_cycles_today') | int(0) %}
            {% set tgt = states('sensor.hydro_cycle_cadence') | int(6) %}
            {% if phase == 'filling' %}Filling — {{ states('input_select.hydro_growth_stage') }} depth
            {% elif phase == 'full' %}Flooded — holding
            {% elif phase == 'draining' %}Draining
            {% else %}Growing {{ crop }} — {{ n }}/{{ tgt }} cycles today, day {{ states('sensor.hydro_plant_age') }}
            {% endif %}
          {% endif %}

      # THE IDEAL CADENCE, DERIVED FROM THE CROP PROFILE - not a number typed anywhere.
      #
      # State is the target number of complete fill/drain cycles per day for the active crop
      # (lettuce 6, spinach/arugula 5, strawberries 8). Attributes carry the spacing and, more
      # usefully, how many SHOULD have happened by now.
      #
      # PRO-RATED, because "half the daily target" is only meaningful against elapsed time. A
      # flat comparison against the daily number is true every morning and false every evening,
      # which is an alarm that cries wolf at breakfast and stays silent during a real failure.
      # ── HOW LONG BETWEEN FLOODS. The gate that did not exist. ───────────────────────────────
      #
      # On 2026-11-04 the rig ran TWENTY floods in a day against a target of six, at :00 :15 :30
      # and :45 every hour -- roughly 96/day extrapolated. hydro_flood_scheduler is a /5
      # time_pattern whose conditions are all about SAFETY (occupied, latch off, maintenance off,
      # phase empty, floats dry) and contain nothing about TIME SINCE THE LAST FLOOD. So it
      # re-floods the instant a drain finishes.
      #
      # It was invisible until today because the faults were accidentally rate-limiting it: a
      # latched cycle could not re-arm, so the rig sat idle between failures. Fixing the faults
      # removed the accidental brake and the real cadence showed up -- 8 clean cycles back to
      # back, pumps running ~8 minutes in every 15.
      #
      # DERIVED FROM THE PROFILE, NOT A HARDCODED INTERVAL. The crop profile already carries both
      # halves: the light window (on 06:00, off 20:00 = 840 min for lettuce) and floods: 6. So the
      # spacing is window / floods = 140 min, and changing crop or photoperiod moves it without
      # anyone editing a number. Six floods at 140 min from 06:00 lands them 06:00, 08:20, 10:40,
      # 13:00, 15:20, 17:40 -- all inside the window, which is the arrangement the cadence target
      # was describing all along.
      - name: "Hydro Min Flood Gap"
        unique_id: hydro_min_flood_gap
        unit_of_measurement: min
        icon: mdi:timer-sand-complete
        state: >
          {% set p = state_attr('sensor.hydro_active_profile','profile') %}
          {% if p is mapping and p.get('on') and p.get('off') %}
            {% set on = p['on'].split(':') | map('int') | list %}
            {% set off = p['off'].split(':') | map('int') | list %}
            {% set on_m = on[0] * 60 + on[1] %}
            {% set off_m = off[0] * 60 + off[1] %}
            {% set win = (off_m - on_m) if off_m > on_m else (1440 - on_m + off_m) %}
            {% set n = p.get('floods') | int(6) %}
            {{ (win / n) | round(0) | int if n > 0 else 1440 }}
          {% else %}
            240
          {% endif %}
        attributes:
          window_minutes: >
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {% if p is mapping and p.get('on') and p.get('off') %}
              {% set on = p['on'].split(':') | map('int') | list %}
              {% set off = p['off'].split(':') | map('int') | list %}
              {% set on_m = on[0] * 60 + on[1] %}{% set off_m = off[0] * 60 + off[1] %}
              {{ (off_m - on_m) if off_m > on_m else (1440 - on_m + off_m) }}
            {% else %}unknown{% endif %}
          minutes_since_last_flood: >
            {% set ts = state_attr('input_datetime.hydro_last_flood','timestamp') %}
            {{ ((as_timestamp(now()) - ts) / 60) | round(0) | int
               if ts is not none else 'unknown' }}

      - name: "Hydro Cycle Cadence"
        unique_id: hydro_cycle_cadence
        icon: mdi:calendar-clock
        unit_of_measurement: cycles
        state: >
          {% set p = state_attr('sensor.hydro_active_profile','profile') %}
          {{ (p['floods'] | int(6)) if p is mapping else 6 }}
        attributes:
          # WHY expected_by_now MIGHT BE ZERO. Without this a reader sees "0 expected" and cannot
          # tell "too early to flood" from "the profile failed to load" -- two very different
          # states that previously looked identical on the dashboard.
          pace_suppressed: >
            {% set sd = states('input_datetime.hydro_sow_date') %}
            {# sensor.hydro_first_flood_day, not the raw knob: the two knobs disagreed by four
               days and this guard read the EARLIER one, which is how "behind pace" fired on a
               crop the hand-water reminder was still calling pre-flood. #}
            {% set dtf = states('input_number.hydro_flood_start_day') | float(14) %}
            {% if sd in ['unknown','unavailable',''] %}no sow date
            {% elif (as_timestamp(now()) - as_timestamp(sd)) < dtf * 86400 %}
            {{ 'day %d of %d before first flood is due' | format(
                 ((as_timestamp(now()) - as_timestamp(sd)) / 86400) | round(0, 'floor') | int,
                 dtf | int) }}
            {% else %}no{% endif %}
          # PRORATED FROM WHEN THE TALLY STARTED WATCHING, NOT FROM LIGHTS-ON.
          #
          # The rate is always the profile's rate (floods per light-window), but the elapsed
          # term starts at input_datetime.hydro_tally_since, which is lights-on on a normal day
          # and later than that whenever the counter demonstrably missed cycles. Expecting
          # cycles from a period the counter was not present for is what produced the phantom
          # "0 of 2.1" deficit on 2026-08-22; see the helper's comment for the full story.
          # NOTHING IS OWED BEFORE THE FIRST FLOOD IS DUE, and that is derived from the SOW DATE
          # rather than from input_boolean.hydro_occupied.
          #
          # Reported 2026-09-26: an the notification service said two cycles were missing on a crop sown two days
          # earlier. Live state at the time --
          #     hydro_sow_date        2026-09-24 23:00   (day 2)
          #     hydro_days_to_flood   10                 (first flood due ~Oct 4)   [knob since retired]
          #     hydro_growth_stage    germination
          #     hydro_occupied        ON                 <- inconsistent with all three above
          #     expected_by_now       2.9   cycles today 0   -> deficit ON, shortfall 2.9
          #
          # The deficit check's ONLY protection against a fresh crop was `hydro_occupied`, and that
          # single boolean was wrong. This file already knows better in the watering-overdue
          # backstop, which refuses to trust one timestamp because "one of them going stale must
          # not blind the alarm" -- the same argument applies to one boolean ARMING an alarm.
          #
          # Flooding a cube before its roots reach the bottom is the failure this guards: the
          # package header records seedlings that "collapsed flat and went white" and warns the
          # cube "wicks water it cannot yet drink and stays saturated". So expecting cycles this
          # early is not merely noisy, it pressures the system toward real harm.
          #
          # Reads input_number.hydro_flood_start_day, the ONE knob. It used to read a second
          # one, hydro_days_to_flood, and the two disagreed -- 10 against 14 live on 2026-10-07,
          # so for four days of every crop the pace guard thought flooding was due while the
          # hand-water reminder was still saying it was deliberately off. Captured minutes apart
          # that morning:
          #     08:00  "Day 12 of 14 - pipette the cubes. Flooding is deliberately OFF..."
          #     10:35  "CHECK - BEHIND PACE - 0 of 2.0 cycles expected by now"
          # The surviving knob is the LATER of the two values, because flooding a cube before its
          # roots reach the bottom is what killed batch 1; erring late costs a few hand-waterings,
          # erring early costs the crop. The default of 14 suits direct sowing into buckets; a
          # tray-grown start moved in on ~day 9 wants a shorter value, which is a crop decision
          # and is why this reads the helper instead of hard-coding a number.
          expected_by_now: >
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {% set sd = states('input_datetime.hydro_sow_date') %}
            {# See pace_suppressed: the LATER of the two flood-start knobs. #}
            {% set dtf = states('input_number.hydro_flood_start_day') | float(14) %}
            {% set too_young = (sd not in ['unknown','unavailable','']
                                and (as_timestamp(now()) - as_timestamp(sd)) < dtf * 86400) %}
            {% if p is not mapping or too_young %}
              0
            {% else %}
              {% set on = today_at(p['on']) %}
              {% set off = today_at(p['off']) %}
              {% set span = (off - on).total_seconds() %}
              {% set ts = states('input_datetime.hydro_tally_since') %}
              {# max() against lights-on also discards a tally_since left over from a previous
                 day, so a missed midnight reset cannot inflate the expectation. #}
              {% set start = [as_timestamp(on),
                              (as_timestamp(ts) if ts not in ['unknown','unavailable',''] else 0)
                             ] | max %}
              {# Stop the clock at lights-off: after dark no further cycles are owed. #}
              {% set elapsed = ([as_timestamp(now()), as_timestamp(off)] | min) - start %}
              {% if span <= 0 or elapsed <= 0 %}
                0
              {% else %}
                {{ (((p['floods'] | int(6)) * elapsed / span)) | round(1) }}
              {% endif %}
            {% endif %}
          actual_today: "{{ states('counter.hydro_cycles_today') | int(0) }}"
          # Surfaced so the deficit alert can be audited rather than trusted. If this reads
          # later than lights-on, the tally is knowingly measuring a partial day.
          tally_since: >
            {% set ts = states('input_datetime.hydro_tally_since') %}
            {{ ts if ts not in ['unknown','unavailable',''] else 'unset' }}
          interval_minutes: >
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {% if p is not mapping %}
              0
            {% else %}
              {% set span = (today_at(p['off']) - today_at(p['on'])).total_seconds() %}
              {{ ((span / ((p['floods'] | int(6)) or 6)) / 60) | round(0) }}
            {% endif %}
          window: >
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {{ (p['on'] ~ '-' ~ p['off']) if p is mapping else 'unknown' }}

      - name: "Hydro Active Profile"
        unique_id: hydro_active_profile
        icon: mdi:sprout
        state: "{{ states('input_select.hydro_crop') }}"
        attributes:
          # LETTUCE floods RAISED 6 -> 8 ON 2026-11-05, by the owner, from the crop itself.
          # The bucket sitting at the low point of an uneven floor was trickling over its lip for
          # three days, and the plant in it is the healthiest on the rig -- twice the size of any
          # other. So this rig wants more water than the profile's 6 was giving, and that 6 was a
          # book figure rather than a measured one.
          #
          # 8 and not more, in his words: "it doesn't need to be drowning." In the 840-minute light
          # window that is a 105-minute gap, which sensor.hydro_min_flood_gap derives -- nothing
          # else needs editing. Only lettuce changed; the other profiles keep 6 because no
          # evidence has been gathered for them.
          #
          # THE COMMENT LIVES OUT HERE, ABOVE THE KEY, AND NOT INSIDE THE `{% set t = { ... } %}`.
          # Putting it inside cost a deploy: `#` is not a comment character in Jinja, so
          # check_config rejected the whole template with
          #     TemplateSyntaxError: unexpected char '#' at 15
          # Jinja comments are {# ... #}, but a multi-line rationale inside an expression is
          # unreadable anyway. YAML comment, outside the scalar, is the right place.
          profile: >
            {% set t = {
              'Lettuce (leaf/romaine)': {'on':'06:00:00','seed_on':'10:00:00','germ_on':'16:00:00','off':'20:00:00','floods':8,'ec':'1.0-1.2','ph':'5.8-6.0','life':55},
              'Butterhead lettuce':     {'on':'06:00:00','seed_on':'10:00:00','germ_on':'16:00:00','off':'20:00:00','floods':6,'ec':'1.0-1.2','ph':'5.8-6.0','life':55},
              'Basil':                  {'on':'06:00:00','seed_on':'12:00:00','germ_on':'18:00:00','off':'22:00:00','floods':6,'ec':'1.6-1.8','ph':'5.8-6.2','life':60},
              'Spinach':                {'on':'07:00:00','seed_on':'09:00:00','germ_on':'15:00:00','off':'19:00:00','floods':5,'ec':'1.2-1.4','ph':'6.0-6.5','life':45},
              'Bok choy / pak choi':    {'on':'06:00:00','seed_on':'10:00:00','germ_on':'16:00:00','off':'20:00:00','floods':6,'ec':'1.5-2.0','ph':'6.0-7.0','life':50},
              'Arugula / Asian greens': {'on':'07:00:00','seed_on':'09:00:00','germ_on':'15:00:00','off':'19:00:00','floods':5,'ec':'1.2-1.8','ph':'6.0-7.0','life':40},
              'Herbs (mixed)':          {'on':'06:00:00','seed_on':'12:00:00','germ_on':'18:00:00','off':'22:00:00','floods':6,'ec':'1.0-1.6','ph':'5.5-6.5','life':60},
              'Strawberries':           {'on':'07:00:00','seed_on':'09:00:00','germ_on':'15:00:00','off':'19:00:00','floods':8,'ec':'1.0-1.4','ph':'5.5-6.5','life':120}
            } %}
            {{ t.get(states('input_select.hydro_crop'), t['Lettuce (leaf/romaine)']) }}
      # Growth-stage flood depth (inches). Higher early to wet the cube; lower once roots grow
      # down and want more oxygen. Weeks-since-stage-start drive it — you set nothing.
      # Days since the seed went in. The single number every schedule now hangs off, so that
      # sowing is the only thing a human has to tell the system.
      - name: "Hydro Plant Age"
        unique_id: hydro_plant_age
        unit_of_measurement: d
        icon: mdi:calendar-clock
        state: >
          {% set sd = states('input_datetime.hydro_sow_date') %}
          {% if not is_state('input_boolean.hydro_occupied','on')
                or sd in ['unknown','unavailable',''] %}
            -1
          {% else %}
            {{ ((as_timestamp(now()) - as_timestamp(sd)) / 86400) | int }}
          {% endif %}

      # True once roots should have reached the flood zone. Before this, flooding drowns the
      # cube; after it, flooding is the only way the plant eats.
      - name: "Hydro Target Depth"
        unique_id: hydro_target_depth
        unit_of_measurement: in
        icon: mdi:water-percent
        # MEASURED FROM FIRST FLOOD, NOT FROM SOWING. The ramp goes deep-to-shallow because a
        # plant whose roots have just reached the flood zone needs water brought up to them,
        # and a mature one with long roots does not. That clock starts when flooding starts.
        #
        # Under the old tray model this was the transplant date and it worked out. Direct
        # sowing moved stage_started back to the sowing, which would have skipped the 8" band
        # entirely — the first flood would land at day 14 and read as 7". Subtracting the
        # flood-start day restores the intent rather than the arithmetic.
        state: >
          {% set td = states('input_datetime.hydro_stage_started') %}
          {% if not is_state('input_boolean.hydro_occupied','on')
                or td in ['unknown','unavailable',''] %}
            9
          {% else %}
            {% set fs = states('input_number.hydro_flood_start_day') | float(14) %}
            {% set sd = states('input_datetime.hydro_sow_date') %}
            {# WHEN DID FLOODING ACTUALLY START? Two answers, and subtracting the delay
               unconditionally gets the second one wrong.

               DIRECT-SOWN: stage_started IS the sow date, the cube sat dry for flood_start_day,
               so flooding began at sow + fs.
               TRAY-GROWN (historical): stage_started is the TRANSPLANT date. That plant did its
               dry fortnight in a tray, and flooding began the moment it hit the buckets - there
               is no delay left to subtract. Subtracting anyway double-counts it.

               Caught on the live crop: sown 07-21, transplanted 07-30, and the ramp jumped from
               7" to 8" on deploy - reading a 17-day-established plant as freshly rooted. #}
            {% set direct_sown = sd in ['unknown','unavailable','']
                                 or (as_timestamp(td) - as_timestamp(sd)) < 86400 %}
            {% set days = ((as_timestamp(now()) - as_timestamp(td)) / 86400)
                          - (fs if direct_sown else 0) %}
            {# 9 / 7.5 ARE THE PHYSICAL FLOAT HEIGHTS. This returned 8/7/6, which match no
               float on the rig -- so the expected fill duration derived from it was wrong and
               the stall detector judged a normal fill against a target that does not exist.
               This value does NOT control the fill: the cycle waits on hydro_target_float and
               backstops with hydro_fill_max_seconds. It only sets the EXPECTED duration. #}
            {% set life = (state_attr('sensor.hydro_active_profile','profile') or {}).get('life', 55) | float %}
            {% set age = ((as_timestamp(now()) - as_timestamp(sd)) / 86400) if sd not in ['unknown','unavailable',''] else 0 %}
            {#- THE DEEP SOAK HAS A DEPTH, AND EVERY DURATION IS DERIVED FROM IT.
                Added 2026-11-01. (internal MR) changed which FLOAT the scheduled fill stops on (the
                hard limit, ~11") but left this sensor returning 9 or 7.5, and that is not
                cosmetic: sensor.hydro_fill_time and sensor.hydro_drain_time are both
                depth x rate, and the DRAIN USES ITS FIGURE AS A CEILING.

                Measured from the live calibration (260s/10in fill, 285s/10in drain):

                    depth    fill    drain
                     7.5in   195s    224s
                     9in     234s    266s
                    11in     286s    324s

                So a drain capped at the 9" figure while 11" of water sits in the buckets stops
                ~57s SHORT and leaves water behind -- which keeps the low float wet, and a
                polish drain that does not clear the low float is exactly what sets the fault
                latch. The owner reported one flood today with no completion detail; this is the
                most likely reason it did not read as finished.

                Reads the hard-limit float's measured depth rather than hardcoding 11, so the
                number tracks hydro_hard_limit_depth_in if the float ever moves. -#}
            {#- HONOURS THE HOLD, IN LOCKSTEP WITH hydro_target_float. These two must agree:
                the float decides where the fill STOPS and this decides the expected duration,
                and the drain uses its figure as a CEILING. If the float targets 11" while this
                still says 9", the drain stops ~57s short and leaves water on the low float --
                which is what sets the fault latch. Enforced by
                tests/test-hydro-hold-forces-deep-soak.py so the pair cannot drift. -#}
            {% set soak = states('input_number.hydro_deep_soak_days') | float(21) %}
            {% set hard = states('input_number.hydro_hard_limit_depth_in') | float(11) %}
            {% if is_state('input_boolean.hydro_stage_manual_hold','on')
                  or (sd not in ['unknown','unavailable',''] and age < soak) %}{{ hard }}
            {% elif age < (life / 2) %}9{% else %}7.5{% endif %}
          {% endif %}
      # Fill time = target depth x fill rate (cal_seconds / cal_depth), capped at the failsafe.
      - name: "Hydro Fill Time"
        unique_id: hydro_fill_time
        unit_of_measurement: s
        icon: mdi:timer-play
        state: >
          {% set d = states('sensor.hydro_target_depth') | float(8) %}
          {% set cs = states('input_number.hydro_fill_seconds') | float(260) %}
          {% set cd = states('input_number.hydro_cal_depth_in') | float(10) %}
          {% set cap = states('input_number.hydro_fill_max_seconds') | float(300) %}
          {{ [ (d * cs / cd) | round(0), cap ] | min | int }}
      # Drain time = target depth x drain rate + 10s margin (guarantees empty, no dry-running).
      - name: "Hydro Drain Time"
        unique_id: hydro_drain_time
        unit_of_measurement: s
        icon: mdi:timer-stop
        state: >
          {% set d = states('sensor.hydro_target_depth') | float(8) %}
          {% set cs = states('input_number.hydro_drain_seconds') | float(285) %}
          {% set cd = states('input_number.hydro_cal_depth_in') | float(10) %}
          {% set cap = states('input_number.hydro_drain_max_seconds') | float(330) %}
          {{ [ (d * cs / cd + 10) | round(0), cap ] | min | int }}

      # ── HOW OLD THE pH CALIBRATION IS, IN DAYS  ─────────────────────────────────
      # -1 means NEVER CALIBRATED, and it is a deliberate sentinel rather than `unknown`: a
      # numeric sensor that goes unknown cannot be compared, so every consumer would need its
      # own defensive default and one of them would eventually get it wrong in the permissive
      # direction. -1 compares as "younger than any threshold", so the AGE sensor alone must
      # never be the gate — the binary_sensor below checks the empty stamp separately, and that
      # split is the whole reason this is safe.
      # ── HOW OLD THE pH CALIBRATION IS, IN DAYS  ─────────────────────────────────
      # Read off the HIGH button's own last-press timestamp — see the note under `input_text:`
      # for why there is no stamp helper. HIGH is the correct one of the three: the runbook's
      # order is MID -> LOW -> HIGH, so HIGH is the press that COMPLETES a calibration. Using
      # MID would call a calibration "fresh" the moment it started, including one abandoned
      # half-way with the probe still in 7.0 buffer.
      #
      # -1 means NEVER CALIBRATED, and it is a deliberate sentinel rather than `unknown`: a
      # numeric sensor that goes unknown cannot be compared, so every consumer would need its
      # own defensive default and one of them would eventually get it wrong in the permissive
      # direction. -1 compares as "younger than any threshold", so the AGE sensor alone must
      # never be the gate — the binary_sensor below checks for the never case separately, and
      # that split is the whole reason this is safe.
      - name: "Hydro pH Calibration Age"
        unique_id: hydro_ph_calibration_age
        unit_of_measurement: d
        icon: mdi:calendar-clock
        state: >
          {% set s = states('button.hydroponics_inputs_ph_cal_high_10_0') %}
          {% set t = 0 if s in ['unknown','unavailable','none',''] else as_timestamp(s, 0) %}
          {{ -1 if t == 0 else ((as_timestamp(now()) - t) / 86400) | round(1) }}
        attributes:
          calibrated_at: >
            {% set s = states('button.hydroponics_inputs_ph_cal_high_10_0') %}
            {{ 'never' if s in ['unknown','unavailable','none',''] else s }}
          cleared_at: >
            {% set c = states('button.hydroponics_inputs_ph_clear_calibration') %}
            {{ 'never' if c in ['unknown','unavailable','none',''] else c }}
          points_stored: "{{ states('sensor.hydroponics_inputs_ph_calibration_points') }}"
          slope_acid: "{{ states('sensor.hydroponics_inputs_ph_probe_slope_acid') }}"
          slope_base: "{{ states('sensor.hydroponics_inputs_ph_probe_slope_base') }}"
      # MOVED OUT OF THE binary_sensor: BLOCK, 2026-11-03. It was declared there while all
      # three of its consumers read `sensor.hydro_flood_hold`, so the entity they read did
      # not exist: sensor.hydro_flood_hold returned HTTP 404 live, every consumer fell
      # through to its `| float(300)` / `| int(300)` default, and the deep 120s dwell was
      # unreachable -- a 300s soak at the 11in hard limit, which is the exact defect the
      # comment below says was fixed on 2026-11-02. That fix added the stage_manual_hold
      # term to a template whose output nothing read.
      #
      # The giveaway was the state: a template binary_sensor coerces its result to
      # truthiness, and this one returns 120 or 300, so it could only ever read "on".
      # test-hydro-deep-hold.py now asserts the declaring domain, which is the one thing it
      # did not check -- it verified that the consumers and the template agreed on the NAME,
      # and they did.
      # ── THE DWELL FOR THE FLOOD CURRENTLY BEING RUN ────────────────────────────────────────
      # ONE SENSOR, THREE CONSUMERS. The hold duration is read by the cycle's `delay`, by
      # hydro_cycle_incomplete, and by the phase-stuck `budget` attribute. Those must agree: if the
      # delay holds for 300s while the watchdog expects 120s, the watchdog calls a healthy flood
      # stuck; invert it and a stuck flood looks healthy. Before this they all read the raw knob,
      # which was fine only while there was a single hold for every depth.
      #
      # DEEP = the flood is going to the hard-limit float, which is true for an explicit '11 in'
      # manual selection and for an Auto flood inside the deep-soak window. The condition mirrors
      # hydro_target_float deliberately; if that template changes, this must change with it, and
      # test-hydro-deep-hold.py fails if the two stop agreeing.
      - name: "Hydro Flood Hold"
        unique_id: hydro_flood_hold
        unit_of_measurement: s
        icon: mdi:timer-sand
        state: >
          {% set sel = states('input_select.hydro_manual_flood_depth') %}
          {% set sd = states('input_datetime.hydro_sow_date') %}
          {% set soak = states('input_number.hydro_deep_soak_days') | float(14) %}
          {% set in_soak = sd not in ['unknown','unavailable','']
                           and ((as_timestamp(now()) - as_timestamp(sd)) / 86400) < soak %}
          {#- HONOUR hydro_stage_manual_hold, exactly as hydro_target_float and
              hydro_target_depth do. Without it this sensor disagreed with the depth it is
              supposed to describe, and on 2026-11-02 that disagreement was LIVE:

                sow 2026-10-07, 26 days elapsed, deep_soak_days 21  ->  in_soak FALSE
                stage_manual_hold ON                                ->  target_depth 11.0 (deep)
                this sensor                                         ->  deep FALSE, hold 300s

              So a scheduled flood was aiming at 11in and dwelling for the SHALLOW 300s instead
              of the deep 120s -- two and a half times the intended soak, at the deepest depth
              the rig has. The deep hold is shorter precisely because the water is deeper.

              This sensor's own comment already states the rule it was breaking: "ONE SENSOR,
              THREE CONSUMERS ... Those must agree: if the delay holds for 300s while the
              watchdog expects 120s, the watchdog calls a healthy flood stuck." It agreed with
              its consumers and disagreed with the TARGET, which is the harder drift to see. -#}
          {% set forced = is_state('input_boolean.hydro_stage_manual_hold','on') %}
          {% set deep = (sel == '11 in')
                        or (sel not in ['9 in','7.5 in','6 in'] and (in_soak or forced)) %}
          {% if deep %}
            {{ states('input_number.hydro_deep_hold_seconds') | int(120) }}
          {% else %}
            {{ states('input_number.hydro_flood_hold_seconds') | int(300) }}
          {% endif %}


  - binary_sensor:
      # HAND-WATERING IS THE CURRENT REGIME. True between sowing and the first flood, which is
      # the one window where the system deliberately does nothing and a person must. Making it
      # an entity rather than an implicit gap is the point: silence in that window reads
      # identically to "handled", and the seedlings die either way.
      - name: "Hydro Hand Water Due"
        unique_id: hydro_hand_water_due
        icon: mdi:eyedropper-variant
        state: >
          {% set age = states('sensor.hydro_plant_age') | int(-1) %}
          {{ is_state('input_boolean.hydro_occupied','on')
             and age >= 0
             and age < (states('input_number.hydro_flood_start_day') | int(14)) }}
        attributes:
          days_remaining: >
            {% set age = states('sensor.hydro_plant_age') | int(-1) %}
            {% set fs = states('input_number.hydro_flood_start_day') | int(14) %}
            {{ (fs - age) if age >= 0 and age < fs else 0 }}

      # ALL SIX FLOATS REPORTING A REAL STATE. The failsafes below are sensor-first, so this
      # is what decides whether a depth reading may be trusted as a cutoff at all. It goes
      # false when the ESP drops off wifi, when the I2C bus wedges, and briefly after an HA
      # restart before the ESPHome integration has reconnected.
      #
      # THIS DETECTS ABSENCE, NOT DISHONESTY, and the difference drives the whole guard
      # design. A float switch sitting in nutrient solution can stick — biofilm, scale, a
      # jammed reed — and a stuck float reports a completely healthy 'off' forever. So
      # `healthy` being true is licence to use the floats as the PRIMARY cutoff; it is not
      # licence to remove every time bound, which is why each guard below keeps a distant
      # backstop that only a stuck float can reach.
      - name: "Hydro Floats Healthy"
        unique_id: hydro_floats_healthy
        icon: mdi:heart-pulse
        state: >
          {% set fl = [
               'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
               'binary_sensor.hydroponics_inputs_hydro_float_low_second',
               'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
          {% set ns = namespace(bad=0) %}
          {% for e in fl %}
            {% if states(e) in ['unavailable','unknown','none',''] %}{% set ns.bad = ns.bad + 1 %}{% endif %}
          {% endfor %}
          {{ ns.bad == 0 }}
        attributes:
          unreadable: >
            {% set fl = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {{ fl | select('is_state', 'unavailable') | list
               + (fl | select('is_state', 'unknown') | list) }}

      # EMPTY MEANS EVERY FLOAT IS DRY, NOT JUST THE BOTTOM ONE.
      #
      # Until 2026-08-22 "the bucket is empty" was decided by the low guard alone (plus the
      # hard limit in the scheduler's pre-flood check). The three depth floats were consulted
      # only to pick a FILL TARGET, and `low_second` was never read for wet/dry anywhere at
      # all - a redundant float, physically installed and wired, contributing nothing.
      #
      # That matters because of the failure the comment on Floats Healthy already calls out:
      # a stuck float reports a healthy 'off' forever. A low guard stuck DRY is the dangerous
      # direction - the system believes an untouched full bucket is empty and fills it again.
      # Six floats on one ladder are six chances to notice; one float is one.
      - name: "Hydro All Floats Dry"
        unique_id: hydro_all_floats_dry
        icon: mdi:water-off
        state: >
          {% set fl = [
               'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
               'binary_sensor.hydroponics_inputs_hydro_float_low_second',
               'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
          {{ fl | map('states') | select('eq', 'off') | list | count == fl | count }}
        attributes:
          wet: >
            {% set fl = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {{ fl | select('is_state', 'on') | list }}

      # A PHYSICALLY IMPOSSIBLE READING - the payoff for having a ladder at all.
      #
      # Water in a bucket is ONE SURFACE. Read the floats bottom to top and the wet ones must
      # come first: once you hit a dry float, everything above it must also be dry. Any wet
      # float sitting above a dry one means one of the two is lying.
      #
      # This single rule covers both failure directions, which is why it is stated as physics
      # rather than as two separate checks:
      #   DRAINING - bottom dry while something above is wet. The dangerous reading, because a
      #              low guard stuck dry on a full bucket says "empty, safe to fill".
      #   FILLING  - target float wet while a float BENEATH it is dry. Reaching the target
      #              depth means every float below it is submerged; if one says otherwise the
      #              column is not what the cutoff believes it is.
      #
      # LADDER ORDER IS DECLARED HERE, ONCE, BOTTOM TO TOP - it is the one thing in this file
      # that depends on how the floats are physically hung. Note the depth floats run
      # mature -> mid -> day0 going UP, because the flood gets SHALLOWER as the crop matures
      # and its roots grow down to meet the water (see hydro_target_float). day0 is the
      # HIGHEST of the three, not the lowest. If a float is ever re-hung, fix this list and
      # nothing else.
      #
      # Ignores unreadable floats entirely: a sensor that dropped off wifi is an availability
      # problem, already reported by Floats Healthy, and treating it as disagreement would turn
      # every ESP reconnect into a fault. Reserve this for two floats that both answer and
      # cannot both be right.
      - name: "Hydro Floats Disagree"
        unique_id: hydro_floats_disagree
        device_class: problem
        icon: mdi:scale-unbalanced
        state: >
          {% set ladder = [
               'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
               'binary_sensor.hydroponics_inputs_hydro_float_low_second',
               'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
          {% set ns = namespace(dry_seen=false, bad=[]) %}
          {% for e in ladder %}
            {% if states(e) == 'off' %}{% set ns.dry_seen = true %}
            {% elif states(e) == 'on' and ns.dry_seen %}{% set ns.bad = ns.bad + [e] %}
            {% endif %}
          {% endfor %}
          {{ ns.bad | count > 0 }}
        attributes:
          wet_above_dry: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {% set ns = namespace(dry_seen=false, bad=[]) %}
            {% for e in ladder %}
              {% if states(e) == 'off' %}{% set ns.dry_seen = true %}
              {% elif states(e) == 'on' and ns.dry_seen %}{% set ns.bad = ns.bad + [e] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad }}
          # WHICH FLOAT IS ACTUALLY LYING.
          #
          # `wet_above_dry` names every float that is wet with a dry one beneath it, which is
          # the right way to DETECT the contradiction and the wrong way to REPORT it. With the
          # bottom float stuck dry and the column full, it returns four healthy floats and
          # never mentions the one that is broken.
          #
          # Water is one surface, so a dry float underneath a wet one is impossible. Either
          # that one float is stuck dry, or every float above it is simultaneously stuck wet.
          # One failure is overwhelmingly likelier than four, so the DRY float below is the
          # suspect. Reporting the wet ones sends you to inspect working hardware.
          dry_below_wet: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {% set wet_idx = ladder | map('states') | list %}
            {% set ns = namespace(top_wet=-1) %}
            {% for i in range(ladder | count) %}
              {% if wet_idx[i] == 'on' %}{% set ns.top_wet = i %}{% endif %}
            {% endfor %}
            {% if ns.top_wet < 0 %}
              {{ [] }}
            {% else %}
              {{ ladder[:ns.top_wet] | reject('is_state', 'on') | list }}
            {% endif %}
          # ACCUSE THE MINORITY, AND SAY WHICH WAY IT FAILED.
          #
          # "The dry float below is the liar" is only right when the dry ones are outnumbered.
          # Caught by testing the algorithm before shipping it: with hard_limit wet and all
          # five floats beneath it dry, that rule blamed five working floats instead of the
          # one stuck wet at the top — the same misattribution this attribute exists to fix,
          # reintroduced in the opposite direction.
          #
          # The real principle is not "dry is suspect", it is "one failure beats many". So
          # compare the two sides of the contradiction and name the smaller one.
          #
          # TIES BREAK TOWARD STUCK-DRY on purpose. A float stuck dry defeats a fill cutoff and
          # the water keeps coming; a float stuck wet raises a false fault and stops the pump.
          # When the evidence genuinely cannot distinguish them, point at the one whose failure
          # ends with water on the floor.
          primary_suspect: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {% set st = ladder | map('states') | list %}
            {% set ns = namespace(top_wet=-1, wet_above=[], dry_seen=false) %}
            {% for i in range(ladder | count) %}
              {% if st[i] == 'on' %}
                {% set ns.top_wet = i %}
                {% if ns.dry_seen %}{% set ns.wet_above = ns.wet_above + [ladder[i]] %}{% endif %}
              {% elif st[i] == 'off' %}
                {% set ns.dry_seen = true %}
              {% endif %}
            {% endfor %}
            {% set dry_below = ladder[:ns.top_wet] | reject('is_state', 'on') | list
                 if ns.top_wet >= 0 else [] %}
            {% set short = 'binary_sensor.hydroponics_inputs_hydro_float_' %}
            {% if dry_below | count == 0 and ns.wet_above | count == 0 %}
              none
            {% elif ns.wet_above | count > 0
                    and (dry_below | count == 0
                         or ns.wet_above | count < dry_below | count) %}
              {{ ns.wet_above | last | replace(short, '') }} (stuck wet)
            {% else %}
              {{ dry_below | first | replace(short, '') }} (stuck dry)
            {% endif %}

      # A FLOAT THAT HAS NOT MOVED IN WEEKS HAS NOT BEEN TESTED IN WEEKS.
      #
      # The two checks above are CONSISTENCY checks — they compare floats against each other
      # and catch a reading that contradicts the physics. They are blind by construction to a
      # float nothing ever touches, because an untouched float never contradicts anything.
      #
      # At the `mature` stage the target is the mature float, so `mid`, `day0` and
      # `hard_limit` are never submerged: three of six floats sit unexercised, agreeing
      # politely with everything, until the day one of them is suddenly load-bearing. `day0`
      # becomes the fill target the moment a crop is sown at germination. `hard_limit` is the
      # last thing between a stuck target float and water on the floor beside the rack — and
      # nothing in this file has ever proven it can fire.
      #
      # This is the same distinction as (internal MR): a guard that is passing and a guard that is
      # incapable of firing look identical from outside. The only way to tell them apart is to
      # make one fire on purpose, and then to remember when you last did.
      # ── THE FLOAT NAMES HERE MUST BE THE WRITER'S SUFFIXES, NOT THE OLD ROLE NAMES ────────
      # Until 2026-11-05 all three templates below iterated
      #     ['low_guard','low_second','mature','mid','day0','hard_limit']
      # while hydro_float_prove_on_transition stamps
      #     input_text.hydro_float_proven_<suffix>
      # with the suffix taken from the ESPHome entity name -- low_guard, low_second, 6_inch,
      # 7_5_inch, 9_inch, 11_inch. The four role names were renamed to depths at some point and
      # these lists were not. Both halves were broken at once, which is why nothing looked odd:
      #
      #   FALSE POSITIVE  states('input_text.hydro_float_proven_mature') resolves to an entity
      #                   that does not exist, as_timestamp(..., 0) returns 0, and 0 is always
      #                   more than 35 days ago -- so the sensor read `on` permanently and its
      #                   `unproven` attribute permanently named ['mature','mid','day0',
      #                   'hard_limit']. An alarm that can never clear gets ignored, and this
      #                   one had been ignorable for as long as the names were wrong.
      #   FALSE NEGATIVE  and the one that matters: the four REAL depth floats -- 6in, 7.5in,
      #                   9in and the 11in hard limit -- were never checked for staleness at
      #                   all. A reed that stopped transitioning would have gone unreported
      #                   indefinitely, which is the entire thing this sensor exists to catch.
      #
      # Measured live before the fix: unproven = ['mature','mid','day0','hard_limit'],
      # oldest_proof_days = -1, while low_guard and low_second carried timestamps from hours
      # earlier.
      #
      # test-hydro-float-proof-names-match-writer.py now derives the expected set from the
      # writer's own trigger list and fails on any divergence, because a hand-kept list that
      # mirrors another hand-kept list drifts the moment either is edited -- and a concatenated
      # entity id is invisible to every grep-based reference check, including
      # test-hydro-float-entities-exist.py, which passed throughout.
      - name: "Hydro Float Proof Stale"
        unique_id: hydro_float_proof_stale
        device_class: problem
        icon: mdi:clock-alert-outline
        state: >
          {% set floats = ['low_guard','low_second','6_inch','7_5_inch','9_inch','11_inch'] %}
          {% set maxd = states('input_number.hydro_float_proof_max_days') | float(35) %}
          {% set ns = namespace(bad=0) %}
          {% for f in floats %}
            {% set ts = as_timestamp(states('input_text.hydro_float_proven_' ~ f), 0) %}
            {% if (as_timestamp(now()) - ts) > (maxd * 86400) %}
              {% set ns.bad = ns.bad + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.bad > 0 }}
        attributes:
          # Named, not counted — the alert should say which float to go and toggle.
          unproven: >
            {% set floats = ['low_guard','low_second','6_inch','7_5_inch','9_inch','11_inch'] %}
            {% set maxd = states('input_number.hydro_float_proof_max_days') | float(35) %}
            {% set ns = namespace(bad=[]) %}
            {% for f in floats %}
              {% set ts = as_timestamp(states('input_text.hydro_float_proven_' ~ f), 0) %}
              {% if (as_timestamp(now()) - ts) > (maxd * 86400) %}
                {% set ns.bad = ns.bad + [f] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad }}
          # UNRESOLVABLE IS NOT THE SAME AS UNPROVEN, and conflating them is what hid the
          # name drift for as long as it lasted. A float that has genuinely never transitioned
          # reports an EMPTY input_text; a float whose proof entity does not exist reports
          # 'unknown' or 'unavailable'. Both produced ts == 0 and both landed in `unproven`, so
          # a configuration error read as a hardware observation and the remedy it suggested --
          # go and toggle the float by hand -- could never work.
          #
          # Reported separately and NOT silently dropped: if this is ever non-empty the names
          # above are wrong, and that is a different job from drying out a reed.
          unresolvable: >
            {% set floats = ['low_guard','low_second','6_inch','7_5_inch','9_inch','11_inch'] %}
            {% set ns = namespace(bad=[]) %}
            {% for f in floats %}
              {% if states('input_text.hydro_float_proven_' ~ f) in ['unknown','unavailable'] %}
                {% set ns.bad = ns.bad + [f] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad }}
          # Age of the OLDEST proof, in days, so the dashboard can show one honest number.
          # Reports -1 when a float has never been proven at all rather than a huge number
          # derived from the 1970 epoch default, which would read as a plausible measurement.
          oldest_proof_days: >
            {% set floats = ['low_guard','low_second','6_inch','7_5_inch','9_inch','11_inch'] %}
            {% set ns = namespace(oldest=None, never=false) %}
            {% for f in floats %}
              {% set ts = as_timestamp(states('input_text.hydro_float_proven_' ~ f), 0) %}
              {% if ts <= 0 %}
                {% set ns.never = true %}
              {% elif ns.oldest is none or ts < ns.oldest %}
                {% set ns.oldest = ts %}
              {% endif %}
            {% endfor %}
            {% if ns.never or ns.oldest is none %}
              -1
            {% else %}
              {{ ((as_timestamp(now()) - ns.oldest) / 86400) | round(1) }}
            {% endif %}

      # THE FILL-SIDE POSITIVE CHECK: target reached AND the whole column beneath it wet.
      #
      # `Floats Disagree` states the physics and catches the impossible. This states the
      # INTENT and confirms the expected: at the end of a fill the target float and every
      # float below it should be submerged. Kept separate because "nothing impossible is
      # happening" and "the thing we wanted actually happened" are different questions, and
      # only the second one belongs in a fill-complete assertion.
      #
      # Unknown target (growth stage unset or renamed) reports OFF, not ON. A confirmation
      # sensor that defaults to "confirmed" when it cannot tell is worse than not having it.
      - name: "Hydro Fill Column Confirmed"
        unique_id: hydro_fill_column_confirmed
        icon: mdi:format-vertical-align-top
        state: >
          {% set ladder = [
               'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
               'binary_sensor.hydroponics_inputs_hydro_float_low_second',
               'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
          {% set stage = states('input_select.hydro_growth_stage') %}
          {% set target = 'binary_sensor.hydroponics_inputs_hydro_float_9_inch'
               if stage == 'germination' else
               'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch'
               if stage == 'seedling' else
               'binary_sensor.hydroponics_inputs_hydro_float_6_inch'
               if stage == 'mature' else '' %}
          {% if target == '' or target not in ladder %}
            false
          {% else %}
            {{ ladder[:ladder.index(target) + 1]
               | map('states') | select('eq', 'on') | list | count
               == ladder.index(target) + 1 }}
          {% endif %}
        attributes:
          dry_below_target: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_float_low_guard',
                 'binary_sensor.hydroponics_inputs_hydro_float_low_second',
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_float_11_inch' ] %}
            {% set stage = states('input_select.hydro_growth_stage') %}
            {% set target = 'binary_sensor.hydroponics_inputs_hydro_float_9_inch'
                 if stage == 'germination' else
                 'binary_sensor.hydroponics_inputs_hydro_float_7_5_inch'
                 if stage == 'seedling' else
                 'binary_sensor.hydroponics_inputs_hydro_float_6_inch'
                 if stage == 'mature' else '' %}
            {% if target == '' or target not in ladder %}
              {{ [] }}
            {% else %}
              {{ ladder[:ladder.index(target) + 1] | reject('is_state', 'on') | list }}
            {% endif %}
      # A CYCLE THAT STARTED AND NEVER FINISHED.
      #
      # True when the last recorded `full` is NEWER than the last recorded `empty` and the hold
      # window has long since passed. That is a flood that went in and never came back out.
      #
      # Grace is hold + 10 minutes: a healthy cycle drains within seconds of the hold expiring,
      # so anything past that is not slow, it is absent. Deliberately generous rather than tight,
      # because the cost of a false alarm here is an ignored alert, and an ignored alert is how
      # the six-day watering gap survived.

      - name: "Hydro Cycle Incomplete"
        unique_id: hydro_cycle_incomplete
        device_class: problem
        icon: mdi:progress-alert
        state: >
          {% set full = states('input_datetime.hydro_t_full') %}
          {% set empty = states('input_datetime.hydro_t_empty') %}
          {# sensor.hydro_flood_hold, not the raw knob: a deep flood holds for
             hydro_deep_hold_seconds and this watchdog must expect the same number the cycle
             actually used, or it judges a healthy deep flood against a shallow flood's clock. #}
          {% set hold = states('sensor.hydro_flood_hold') | float(300) %}
          {% if full in ['unknown','unavailable',''] %}
            false
          {% else %}
            {% set f = as_timestamp(full) %}
            {% set e = as_timestamp(empty) if empty not in ['unknown','unavailable',''] else 0 %}
            {{ f > e and (as_timestamp(now()) - f) > (hold + 600) }}
          {% endif %}
        attributes:
          missing_stage: >
            {% set full = states('input_datetime.hydro_t_full') %}
            {% set drain = states('input_datetime.hydro_t_drain_start') %}
            {% set empty = states('input_datetime.hydro_t_empty') %}
            {% set f = as_timestamp(full) if full not in ['unknown','unavailable',''] else 0 %}
            {% set d = as_timestamp(drain) if drain not in ['unknown','unavailable',''] else 0 %}
            {% set e = as_timestamp(empty) if empty not in ['unknown','unavailable',''] else 0 %}
            {% if f > 0 and d < f %}drain never started
            {% elif d > 0 and e < d %}drain started but never completed
            {% else %}none{% endif %}

      # RUNNING AT OR BELOW HALF THE EXPECTED PACE.
      #
      # Requires expected_by_now >= 2 before it can fire. Below that, "half" is a fraction of a
      # single cycle and the comparison is noise - at 06:30 the expected count is 0.2 and any
      # system on earth is "behind". The floor is what makes this alertable rather than annoying.
      - name: "Hydro Cycle Deficit"
        unique_id: hydro_cycle_deficit
        device_class: problem
        icon: mdi:speedometer-slow
        state: >
          {% set exp = state_attr('sensor.hydro_cycle_cadence','expected_by_now') | float(0) %}
          {% set act = states('counter.hydro_cycles_today') | int(0) %}
          {{ is_state('input_boolean.hydro_occupied','on')
             and is_state('input_boolean.hydro_maintenance','off')
             and exp >= 2 and act <= (exp / 2) }}
        attributes:
          shortfall: >
            {% set exp = state_attr('sensor.hydro_cycle_cadence','expected_by_now') | float(0) %}
            {{ (exp - (states('counter.hydro_cycles_today') | int(0))) | round(1) }}

      # THE BACKSTOP: HAS IT WATERED RECENTLY, AT ALL, FOR ANY REASON?
      #
      # Every other check in this file detects a SPECIFIC failure. This one detects the OUTCOME,
      # and so it catches causes nobody has thought of yet. It is the check that would have
      # caught 2026-08-16..22 on day one — six days, zero floods, 31-day-old plants, no alert,
      # because the failure was a precondition that could never be satisfied and no guard was
      # watching for "nothing is happening".
      #
      # DOES NOT TRUST A SINGLE TIMESTAMP. input_datetime.hydro_last_flood silently failed to
      # persist across the 2026-08-22 restart and reverted to a six-day-old value, so this takes
      # the NEWEST of it and the observer's own `full` stamp. One of them going stale must not
      # blind the alarm; that is how a watchdog becomes decorative.
      #
      # Overdue = 3x the expected interval. Wide enough that a skipped cycle is not an alarm,
      # narrow enough that it is measured in hours, not days.
      - name: "Hydro Watering Overdue"
        unique_id: hydro_watering_overdue
        device_class: problem
        icon: mdi:water-alert
        # READS THE CROP PROFILE, THE SAME SOURCE EVERY OTHER SCHEDULE READS.
        #
        # This asked sensor.hydro_light_schedule for a `photoperiod` attribute. That entity does
        # not exist — it is one of the pre-rename names retired at the top of this file — so `p`
        # was always None and the guard silently fell back to a hard-coded 14h/6-flood interval.
        # It matched lettuce by coincidence and would have been wrong for every other profile in
        # the table: basil runs 16h, spinach short days. A backstop running on a constant it
        # inherited from whichever crop happened to be growing the day it was written is not a
        # backstop, and this is the one check the file calls the last line of defence.
        state: >
          {% set p = state_attr('sensor.hydro_active_profile','profile') %}
          {% set span = (today_at(p['off']) - today_at(p['on'])).total_seconds()
                        if p is mapping else 50400 %}
          {% set floods = (p['floods'] | int(6)) if p is mapping else 6 %}
          {% set interval = span / (floods if floods > 0 else 6) %}
          {# namespace(), NOT a bare set: a {% set %} inside a {% for %} does not survive the
             loop in Jinja, so the list came out empty and this check could never fire. It
             shipped that way on 2026-08-22 and was caught only because the attribute below
             read `unknown` instead of a number. #}
          {% set ns = namespace(ts=[]) %}
          {% for e in ['input_datetime.hydro_last_flood','input_datetime.hydro_t_full'] %}
            {% if states(e) not in ['unknown','unavailable',''] %}
              {% set ns.ts = ns.ts + [as_timestamp(states(e))] %}
            {% endif %}
          {% endfor %}
          {# DARKNESS IS NOT A MISSED WATERING. This compared wall-clock hours against a
             threshold derived from the LIGHT window, so it went ON EVERY NIGHT by construction:
             lettuce runs 14h light, giving interval*3 = 7h, while the dark period is 10h. The
             overnight gap is ALWAYS larger than the threshold. Combined with the observer alarm
             re-firing on time_pattern /15, that is a push every quarter hour from roughly 01:00
             until lights-on, every night, reporting something entirely expected. Reported by
             the owner 2026-08-23 at 03:00.

             Now: overdue only while the lights are ON, and only once the window has been open
             long enough that a flood should already have happened. since_on is negative before
             today's on-time, which reads as not-overdue rather than as an enormous gap. #}
          {% set on_ts = (today_at(p['on']) | as_timestamp) if p is mapping else none %}
          {% set since_on = (as_timestamp(now()) - on_ts) if on_ts else -1 %}
          {% if not ns.ts or is_state('input_boolean.hydro_occupied','off') %}
            false
          {% elif is_state('binary_sensor.hydro_in_light_window','off') %}
            false
          {% elif since_on < (interval * 3) %}
            false
          {% else %}
            {{ (as_timestamp(now()) - (ns.ts | max)) > (interval * 3) }}
          {% endif %}
        attributes:
          hours_since_flood: >
            {% set ns = namespace(ts=[]) %}
            {% for e in ['input_datetime.hydro_last_flood','input_datetime.hydro_t_full'] %}
              {% if states(e) not in ['unknown','unavailable',''] %}
                {% set ns.ts = ns.ts + [as_timestamp(states(e))] %}
              {% endif %}
            {% endfor %}
            {{ ((as_timestamp(now()) - (ns.ts | max)) / 3600) | round(1) if ns.ts else 'unknown' }}

      # PHASE SAYS ONE THING, THE WATER SAYS ANOTHER.
      #
      # `empty` while any float is wet is physically false, and it is the signature of BOTH
      # 2026-08-22 incidents: the orphaned flood above, and the six-day watering gap before it,
      # where phase sat at `empty` with the two low floats wet and the scheduler silently
      # refused to run because its own emptiness precondition could never pass.
      #
      # Reports only; does NOT latch a fault. A latched fault blocks flooding, and the failure
      # this detects is usually "the plants are not being watered" — latching would deepen the
      # very problem it found. Tell a human; do not take the pumps away from them.
      - name: "Hydro Phase Contradicts Floats"
        unique_id: hydro_phase_contradicts_floats
        device_class: problem
        icon: mdi:comment-question
        state: >
          {{ is_state('input_select.hydro_phase','empty')
             and is_state('binary_sensor.hydro_floats_healthy','on')
             and is_state('binary_sensor.hydro_all_floats_dry','off') }}
        attributes:
          wet: "{{ state_attr('binary_sensor.hydro_all_floats_dry','wet') | default([], true) }}"

      # HA DISAGREES WITH THE TRACKER. On whenever any reconciled field differs, INCLUDING
      # while an override is suppressing the correction — that separation is the whole design.
      # The 2026-08-16 incident was not caused by missing sync; it was caused by divergence
      # nobody could see. An override that also hid this would reintroduce exactly that.
      #
      # `unknown`/`unavailable` on the tracker sensor is NOT drift. A fetch failure means we
      # have no opinion to compare against, and reporting that as disagreement would turn every
      # tracker outage into a false alarm — and, worse, train the alarm to be ignored.
      - name: "Hydro State Drift"
        unique_id: hydro_state_drift
        device_class: problem
        icon: mdi:sync-alert
        state: >
          {% set t = states('sensor.hydro_tracker_occupancy') %}
          {% if t not in ['occupied','empty'] %}false
          {% else %}
            {% set a = state_attr('sensor.hydro_tracker_occupancy','derived_stage') %}
            {% set d = state_attr('sensor.hydro_tracker_occupancy','stage_started_date') %}
            {% set c = state_attr('sensor.hydro_tracker_occupancy','ha_crop') %}
            {% set s = state_attr('sensor.hydro_tracker_occupancy','sown_date') %}
            {{ (a is not none and a != states('input_select.hydro_growth_stage'))
               or (c is not none and c != states('input_select.hydro_crop'))
               or (d is not none and d[:10] != states('input_datetime.hydro_stage_started')[:10])
               or (s is not none and s[:10] != states('input_datetime.hydro_sow_date')[:10]) }}
          {% endif %}
        attributes:
          differences: >
            {% set t = states('sensor.hydro_tracker_occupancy') %}
            {% if t not in ['occupied','empty'] %}[]
            {% else %}
              {% set ns = namespace(d=[]) %}
              {% set a = state_attr('sensor.hydro_tracker_occupancy','derived_stage') %}
              {% set c = state_attr('sensor.hydro_tracker_occupancy','ha_crop') %}
              {% set sd = state_attr('sensor.hydro_tracker_occupancy','stage_started_date') %}
              {% set s = state_attr('sensor.hydro_tracker_occupancy','sown_date') %}
              {% if a is not none and a != states('input_select.hydro_growth_stage') %}
                {% set ns.d = ns.d + ['stage: tracker=' ~ a ~ ' ha=' ~ states('input_select.hydro_growth_stage')] %}
              {% endif %}
              {% if c is not none and c != states('input_select.hydro_crop') %}
                {% set ns.d = ns.d + ['crop: tracker=' ~ c ~ ' ha=' ~ states('input_select.hydro_crop')] %}
              {% endif %}
              {% if sd is not none and sd[:10] != states('input_datetime.hydro_stage_started')[:10] %}
                {% set ns.d = ns.d + ['stage_started: tracker=' ~ sd[:10] ~ ' ha=' ~ states('input_datetime.hydro_stage_started')[:10]] %}
              {% endif %}
              {% if s is not none and s[:10] != states('input_datetime.hydro_sow_date')[:10] %}
                {% set ns.d = ns.d + ['sow_date: tracker=' ~ s[:10] ~ ' ha=' ~ states('input_datetime.hydro_sow_date')[:10]] %}
              {% endif %}
              {{ ns.d }}
            {% endif %}
          suppressed_by: >
            {% if is_state('input_boolean.hydro_manual_override','on') %}manual override
            {% elif is_state('input_boolean.hydro_maintenance','on') %}maintenance
            {% else %}nothing — reconciler is active
            {% endif %}
      # True while the current time is inside the active crop's light window for the
      # CURRENT LIGHT STAGE. All three windows end at the crop's single `off` time;
      # only the start walks earlier as the plant advances. Falls back to the full
      # window if a profile lacks the staged keys, so an unstaged crop can't go dark.
      #
      # THIS COMMENT DESCRIBED BEHAVIOUR THE CODE DID NOT HAVE, until 2026-09-25. The
      # template read p['on'] unconditionally and never looked at hydro_growth_stage, so
      # `germ_on` and `seed_on` were dead keys in every profile and EVERY stage got the
      # full mature window.
      #
      # Caught on day 1 of a real batch: stage `germination`, lights on at 08:10 against a
      # germ_on of 16:00. Fourteen hours of light instead of four, on cubes that have no
      # water supply for ten days. The germination window is short specifically to limit
      # EVAPORATION -- moisture is the binding constraint during the dry stage, not heat --
      # so the defect attacked the one resource the stage cannot replace.
      #
      # It stayed invisible because the failure is silent and looks like success: lights
      # come on, the plants are lit, nothing errors. Only the duration was wrong, and
      # nothing measured duration against the stage.
      - name: "Hydro In Light Window"
        unique_id: hydro_in_light_window
        state: >
          {% set p = state_attr('sensor.hydro_active_profile','profile') %}
          {% if p is mapping %}
            {% set stage = states('input_select.hydro_growth_stage') %}
            {% set start = p.get('germ_on') if (stage == 'germination' and p.get('germ_on'))
                      else (p.get('seed_on') if (stage == 'seedling' and p.get('seed_on'))
                      else p['on']) %}
            {% set now_t = now().strftime('%H:%M:%S') %}
            {{ (start <= now_t < p['off']) if start <= p['off']
               else (now_t >= start or now_t < p['off']) }}
          {% else %}false{% endif %}

      # ═══ THE pH TRUST LADDER  ═════════════════════════════════════════════════
      #
      # THE GATE AUTOMATED DOSING HAS BEEN WAITING ON. hydroponics-build.md and the pH
      # calibration runbook both say it outright: "Nothing wired to dosing until a
      # calibration-staleness sensor exists — a drifted probe reports a plausible number
      # forever, the same failure class as a stuck float but it kills the crop slowly instead
      # of obviously."
      #
      # FOUR SENSORS, NOT ONE, AND THE SPLIT IS THE DESIGN. These are three INDEPENDENT ways a
      # pH number can be untrustworthy, and they fail in different directions:
      #
      #   reading_sane      the number arriving right now is physically possible
      #   calibration_stale the number is anchored to something recent and complete
      #   probe_degraded    the GLASS still responds, regardless of when it was calibrated
      #
      # Collapsing them into one boolean would mean the alert cannot say which, and the three
      # have different fixes: wait, recalibrate, replace the probe. The fourth sensor ANDs them
      # so the dosing automation has exactly one thing to check — a dosing path that has to
      # remember to check three gates is a dosing path that will one day check two.
      #
      # ALL OF THEM FAIL CLOSED. Every unknown, every unavailable, every missing entity means
      # NOT PERMITTED. This package's recurring bug is a guard whose default reads as passing;
      # here that bug would add acid to a reservoir on the strength of a number nobody has.
      - name: "Hydro pH Reading Sane"
        unique_id: hydro_ph_reading_sane
        icon: mdi:check-decagram
        # 0 AND 14 ARE NOT READINGS, THEY ARE NOISE, and this is from Atlas's own datasheet
        # rather than a guess: "the pH circuit can read micro-voltages bleeding into the water
        # from unnatural sources such as pumps, solenoid valves ... it is common to see rapidly
        # fluctuating readings or readings that are PINNED TO 14 OR 0."
        #
        # That matters enormously here. A probe pinned at 14.0 reads as maximally alkaline, so
        # a naive dosing loop would conclude "far too high" and add pH-down continuously until
        # the bottle emptied. The firmware already filters outside 0-14 to NaN; this rejects the
        # endpoints themselves, which the firmware cannot distinguish from a real reading.
        #
        # The window is deliberately wider than any growing range: this sensor answers "is this
        # a reading at all", not "is the pH where I want it".
        state: >
          {% set raw = states('sensor.hydroponics_inputs_hydro_reservoir_ph') %}
          {% if raw in ['unknown','unavailable','none',''] or raw is none %}
            false
          {% else %}
            {% set v = raw | float(-1) %}
            {{ v > 0.2 and v < 13.8 }}
          {% endif %}

      - name: "Hydro pH Calibration Stale"
        unique_id: hydro_ph_calibration_stale
        icon: mdi:calendar-remove
        # ON means DO NOT TRUST. Three separate ways to be stale, each sufficient on its own.
        state: >
          {% set hi = states('button.hydroponics_inputs_ph_cal_high_10_0') %}
          {% set cl = states('button.hydroponics_inputs_ph_clear_calibration') %}
          {% set t = 0 if hi in ['unknown','unavailable','none',''] else as_timestamp(hi, 0) %}
          {% set tc = 0 if cl in ['unknown','unavailable','none',''] else as_timestamp(cl, 0) %}
          {% set age = (as_timestamp(now()) - t) / 86400 %}
          {% set maxage = states('input_number.hydro_ph_cal_max_age_days') | float(45) %}
          {% set pts_raw = states('sensor.hydroponics_inputs_ph_calibration_points') %}
          {% set pts = pts_raw | int(-1) %}
          {#- Any one of these being true means stale: never calibrated -> cleared more recently
              than calibrated -> probe not talking -> cleared or partial -> simply too old.
              The CLEARED-AFTER check does not depend on the points sensor, so it still holds if
              the circuit stops answering between the clear press and the next poll. -#}
          {{ true if t == 0
             else true if tc > t
             else true if pts_raw in ['unknown','unavailable','none','']
             else true if pts < 3
             else age > maxage }}
        attributes:
          # The reason, because "stale" with no cause is the alert nobody acts on. The three
          # causes have three different fixes: wait, recalibrate, or replace the probe.
          reason: >
            {% set hi = states('button.hydroponics_inputs_ph_cal_high_10_0') %}
            {% set cl = states('button.hydroponics_inputs_ph_clear_calibration') %}
            {% set t = 0 if hi in ['unknown','unavailable','none',''] else as_timestamp(hi, 0) %}
            {% set tc = 0 if cl in ['unknown','unavailable','none',''] else as_timestamp(cl, 0) %}
            {% set age = (as_timestamp(now()) - t) / 86400 %}
            {% set maxage = states('input_number.hydro_ph_cal_max_age_days') | float(45) %}
            {% set pts_raw = states('sensor.hydroponics_inputs_ph_calibration_points') %}
            {% set pts = pts_raw | int(-1) %}
            {% if t == 0 %}never calibrated — the HIGH 10.0 button has never been pressed
            {% elif tc > t %}calibration CLEARED after the last calibration — recalibrate from MID
            {% elif pts_raw in ['unknown','unavailable','none',''] %}probe not reporting its calibration state
            {% elif pts == 0 %}calibration CLEARED on the circuit — 0 points stored
            {% elif pts < 3 %}only {{ pts }} of 3 points stored — calibration incomplete
            {% elif age > maxage %}{{ age | round(1) }}d since calibration, limit {{ maxage | int }}d
            {% else %}fresh{% endif %}

      - name: "Hydro pH Probe Degraded"
        unique_id: hydro_ph_probe_degraded
        icon: mdi:flask-empty-remove
        # SLOPE IS THE ONLY THING HERE THAT SEES THE GLASS ITSELF.
        #
        # A days-since-calibration number cannot detect a dying probe, and that is the gap this
        # closes: a probe calibrated YESTERDAY can already be failing, because calibration
        # succeeds by compensating for the degradation it is measuring. Atlas reports acid and
        # base slope as a percentage of the ideal response; healthy is ~95-105%.
        #
        # The band here is 85-115%, deliberately WIDER than healthy. This sensor is not a
        # quality metric, it is a refuse-to-dose trigger, and a probe at 92% is still giving
        # usable numbers. Tight bands on a safety interlock get the interlock disabled.
        #
        # Unknown slope is NOT degraded — it is handled by calibration_stale (probe not
        # reporting) instead. Two sensors firing on one cause produces two alerts for one
        # problem, and the one that names the cause correctly should be the one that speaks.
        state: >
          {% set a_raw = states('sensor.hydroponics_inputs_ph_probe_slope_acid') %}
          {% set b_raw = states('sensor.hydroponics_inputs_ph_probe_slope_base') %}
          {% if a_raw in ['unknown','unavailable','none',''] or b_raw in ['unknown','unavailable','none',''] %}
            false
          {% else %}
            {% set a = a_raw | float(100) %}
            {% set b = b_raw | float(100) %}
            {{ a < 85 or a > 115 or b < 85 or b > 115 }}
          {% endif %}
        attributes:
          slope_acid: "{{ states('sensor.hydroponics_inputs_ph_probe_slope_acid') }}"
          slope_base: "{{ states('sensor.hydroponics_inputs_ph_probe_slope_base') }}"

      # ── THE ONE ENTITY A DOSING AUTOMATION CHECKS ────────────────────────────────────────
      # ANDs the three above. There is deliberately no pump in this system yet (hardware ordered
      # 2026-10-06, (internal tracker)), so nothing consumes this today — it is being landed FIRST, on
      # purpose, because the alternative is writing the dosing logic and the gate in one change
      # and discovering the gate's bugs with a bottle of acid plumbed in.
      #
      # It is NOT "should I dose" — it carries no opinion about pH targets, reservoir volume,
      # mixing state or daily limits. It answers only "is the pH number trustworthy enough to
      # act on", which is the question that has to be answered before any of the others matter.
      - name: "Hydro pH Dosing Permitted"
        unique_id: hydro_ph_dosing_permitted
        icon: mdi:shield-check
        state: >
          {{ is_state('binary_sensor.hydro_ph_reading_sane','on')
             and is_state('binary_sensor.hydro_ph_calibration_stale','off')
             and is_state('binary_sensor.hydro_ph_probe_degraded','off') }}
        attributes:
          # Why not, in one line, for the dosing automation's own log and for the dashboard.
          blocked_by: >
            {% set r = [] %}
            {% if not is_state('binary_sensor.hydro_ph_reading_sane','on') %}
              {% set r = r + ['reading not sane (' ~ states('sensor.hydroponics_inputs_hydro_reservoir_ph') ~ ')'] %}
            {% endif %}
            {% if not is_state('binary_sensor.hydro_ph_calibration_stale','off') %}
              {% set r = r + ['calibration: ' ~ (state_attr('binary_sensor.hydro_ph_calibration_stale','reason') | default('stale', true) | trim)] %}
            {% endif %}
            {% if not is_state('binary_sensor.hydro_ph_probe_degraded','off') %}
              {% set r = r + ['probe slope out of band'] %}
            {% endif %}
            {{ r | join('; ') if r | length > 0 else 'nothing — pH is trustworthy' }}

      # ── AUTOMATED RECOVERY HAS GIVEN UP AND THE TANK IS STILL WET ───────────────────────────
      # The state nobody was told about on 2026-11-03. hydro_latch_retry_drain stops running
      # when counter.hydro_drain_probes_today reaches its cap, because that is a CONDITION --
      # so the automation does not fire, and its "still wet, latch HELD" log lives in the
      # else-branch of a probe that never ran. Between 18:07 and 23:04 nothing tried and
      # nothing said it had stopped trying. The owner noticed because the plants had been
      # watered once instead of six times, then drained it by hand.
      #
      # A guard that goes quiet at exactly the moment it fails is worse than no guard: the
      # silence is indistinguishable from "nothing to report". This makes the giving-up
      # explicit so it can be alarmed on and shown on the dashboard.
      #
      # NO RESET WIRING NEEDED. hydro_cycles_daily_reset zeroes drain_probes_today at 00:00, so
      # this returns to off by itself and the rising-edge trigger on it cannot re-alarm in
      # between -- one alert per exhausted day, not one per hour.
      - name: "Hydro Recovery Exhausted"
        unique_id: hydro_recovery_exhausted
        device_class: problem
        icon: mdi:hand-back-right-off
        state: >
          {{ (states('counter.hydro_drain_probes_today') | int(0))
             >= (states('input_number.hydro_drain_probes_max_today') | float(12) | round(0) | int)
             and is_state('binary_sensor.hydro_all_floats_dry','off') }}
        attributes:
          detail: >
            {{ states('counter.hydro_drain_probes_today') }} of
            {{ states('input_number.hydro_drain_probes_max_today') | float(12) | round(0) | int }}
            drain probes used; low guard
            {{ 'WET' if is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','on')
               else 'dry' }}, second low float
            {{ 'WET' if is_state('binary_sensor.hydroponics_inputs_hydro_float_low_second','on')
               else 'dry' }}; latch
            {{ 'SET' if is_state('input_boolean.hydro_fault_latch','on') else 'clear' }}.

  # ══ RESERVOIR DEPTH AND VOLUME ════════════════════════════════════════════════════════
  #
  # Derived from the five reservoir bobbers (6 / 9 / 12 / 15 / 18 in). See the reservoir
  # binary_sensor block for why these exist: a fill to 9 in draws ~15 gallons, and until
  # 2026-11-07 nothing in the estate could tell whether that much water was present.
  #
  # ── "AT LEAST", NEVER "IS" ────────────────────────────────────────────────────────────
  # The highest WET float is the floor of the true level, not the level. Water at 11.9 in
  # reads as 9 in here, because the 12 in bobber is still dry. The gap between floats is
  # 3 in, which at 1.958 gal/in is nearly 6 gallons of invisible headroom.
  #
  # That is why both of these are named as minimums and why `unit_of_measurement` is on the
  # value while the honesty lives in the name and the attributes. A number on a dashboard
  # gets planned against; one labelled "min" gets planned against correctly.
  #
  # ── UNAVAILABLE IS A REAL ANSWER ──────────────────────────────────────────────────────
  # When the ladder is unreadable these return 'unknown' rather than 0. Zero would be a
  # claim -- "the reservoir is empty" -- and it is the claim most likely to trigger exactly
  # the wrong response. Not knowing the level and knowing it is empty are different states
  # and the dashboard should not render them identically.
  - sensor:
      - name: Hydro reservoir depth min
        unique_id: hydro_reservoir_depth_min_in
        unit_of_measurement: "in"
        state_class: measurement
        icon: mdi:cup-water
        state: >
          {% if not is_state('binary_sensor.hydro_reservoir_floats_readable','on') %}
            unknown
          {% else %}
            {% set ladder = [
                 (6,  'binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch'),
                 (9,  'binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch'),
                 (12, 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_12_inch'),
                 (15, 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_15_inch'),
                 (18, 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_18_inch') ] %}
            {% set ns = namespace(top=0) %}
            {% for d, e in ladder %}
              {% if states(e) == 'on' and d > ns.top %}{% set ns.top = d %}{% endif %}
            {% endfor %}
            {{ ns.top }}
          {% endif %}
        attributes:
          # The reading is "between this float and the next one up", and saying so turns a
          # single number back into the range it actually represents.
          reads_as: >
            {% if not is_state('binary_sensor.hydro_reservoir_floats_readable','on') %}
              floats unreadable
            {% else %}
              {% set d = states('sensor.hydro_reservoir_depth_min') | int(-1) %}
              {% if d <= 0 %}below 6 in
              {% elif d == 18 %}18 in or more
              {% else %}{{ d }} to {{ d + 3 }} in{% endif %}
            {% endif %}

      - name: Hydro reservoir gallons min
        unique_id: hydro_reservoir_gallons_min
        unit_of_measurement: "gal"
        state_class: measurement
        icon: mdi:water
        # 1.958 gal/in: Grow1 60-gallon collapsible, 24 in x 31 in. Rounded to whole gallons
        # because the input is a 3 in step -- decimals would imply a precision the floats
        # cannot deliver.
        state: >
          {% if not is_state('binary_sensor.hydro_reservoir_floats_readable','on') %}
            unknown
          {% else %}
            {{ (states('sensor.hydro_reservoir_depth_min') | float(0) * 1.958) | round(0) }}
          {% endif %}
        attributes:
          # A flood to 9 in draws ~15 gal (measured 2026-10-24). Showing the headroom in the
          # unit the decision is made in -- "can I run a cycle" -- saves doing the division
          # at the moment it matters.
          floods_remaining_min: >
            {% if not is_state('binary_sensor.hydro_reservoir_floats_readable','on') %}
              unknown
            {% else %}
              {{ ((states('sensor.hydro_reservoir_gallons_min') | float(0)) / 15) | round(1) }}
            {% endif %}


  # ══ RESERVOIR GAUGE ═══════════════════════════════════════════════════════════════════
  #
  # Five bobbers at 6 / 9 / 12 / 15 / 18 in, wired 2026-11-07 on hub_in_4 pins 0-4. These
  # close the gap this package has been describing since 2026-10-24:
  #
  #     "THE SYSTEM CANNOT SEE THIS, AND THAT IS THE REAL GAP. There is no reservoir level
  #      sensor, so nothing can refuse a fill it has no water to finish -- it will always
  #      attempt, stall, and latch, and every diagnosis will point at the floats."
  #
  # Three fills failed on 2026-10-23 for exactly that reason, and a day was spent on the
  # wrong layer because a float-terminated fill that never terminates looks like a float
  # fault. It was an empty reservoir.
  #
  # ── THESE READ WET = ON, LIKE THE BUCKET FLOATS, BUT ONLY BECAUSE OF A FLAG ───────────
  # The reservoir bobbers are mounted UPSIDE DOWN relative to the bucket ones (the hole is
  # drilled where the float sits at 90 degrees, which measures truer). Flipping a pivot
  # float swaps which way the contact closes, so raw True = DRY on these -- the opposite of
  # the bucket. `inverted: true` in the ESPHome config normalises that, which is why the
  # ladder logic below can be identical to the bucket's. Measured on the bench 2026-11-07
  # with an unwired control on port 24 that did NOT move, proving the other five are live.
  #
  # ── VOLUME IS A LOWER BOUND, NOT A MEASUREMENT ───────────────────────────────────────
  # Five discrete floats cannot report a level between them. A wet 9 in float means "at
  # least 9 inches", so the gallons figure is the FLOOR of what is present, never an
  # estimate of it. Naming it anything other than a minimum would invite someone to plan a
  # fill against a number that could be understating by nearly 3 inches.
  #
  # 1.958 gal/in comes from the vessel: a Grow1 60-gallon collapsible, 24 in x 31 in. The
  # owner's working figure of 2.0 is accurate to about 2%.
  - binary_sensor:
      # EVERY DERIVED SENSOR BELOW DEPENDS ON THIS ONE BEING TRUE.
      #
      # (internal MR) is the reason it exists. A staleness sensor there iterated a list of float
      # names that no longer matched the entities, so four names resolved to NOTHING,
      # `states()` returned 'unknown' for each, and the comparison quietly treated them as
      # not-wet. The alarm latched on permanently and the four real floats were never
      # checked at all. A missing entity read exactly like a dry float.
      #
      # These five entity ids are DERIVED from the ESPHome names, not read back from Home
      # Assistant -- the long-lived token in the secret store is 401 , so they could not be
      # confirmed against the live registry. The derivation is sound (the bucket floats
      # follow the identical rule and are proven on the dashboard) but it is still a
      # derivation, and this sensor is what makes a wrong one LOUD instead of silent:
      # anything that is not literally 'on' or 'off' makes readable FALSE, and the gate
      # below refuses rather than guessing.
      - name: Hydro reservoir floats readable
        unique_id: hydro_reservoir_floats_readable
        device_class: connectivity
        icon: mdi:eye-check
        state: >
          {% set ladder = [
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_12_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_15_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_18_inch' ] %}
          {{ ladder | map('states') | reject('in', ['on','off']) | list | count == 0 }}
        attributes:
          # Names the offenders rather than just counting them. "3 unreadable" sends you
          # looking at all five; a list of entity ids points straight at the typo.
          unreadable: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_12_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_15_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_18_inch' ] %}
            {% set ns = namespace(bad=[]) %}
            {% for e in ladder %}
              {% if states(e) not in ['on','off'] %}{% set ns.bad = ns.bad + [e] %}{% endif %}
            {% endfor %}
            {{ ns.bad }}

      # A WET FLOAT ABOVE A DRY ONE IS PHYSICALLY IMPOSSIBLE.
      #
      # Same check the bucket ladder already runs, and it earns its place the same way: on
      # 2026-10-21 a drain-pump POWER CORD was holding a bobber up, and nothing on the
      # dashboard would have shown it. In the reservoir a stuck float is worse, because the
      # gate below trusts the ladder to decide whether a fill may start.
      - name: Hydro reservoir floats disagree
        unique_id: hydro_reservoir_floats_disagree
        device_class: problem
        icon: mdi:scale-unbalanced
        state: >
          {% set ladder = [
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_12_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_15_inch',
               'binary_sensor.hydroponics_inputs_hydro_reservoir_float_18_inch' ] %}
          {% set ns = namespace(dry_seen=false, bad=[]) %}
          {% for e in ladder %}
            {% if states(e) == 'off' %}{% set ns.dry_seen = true %}
            {% elif states(e) == 'on' and ns.dry_seen %}{% set ns.bad = ns.bad + [e] %}
            {% endif %}
          {% endfor %}
          {{ ns.bad | count > 0 }}
        attributes:
          wet_above_dry: >
            {% set ladder = [
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_12_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_15_inch',
                 'binary_sensor.hydroponics_inputs_hydro_reservoir_float_18_inch' ] %}
            {% set ns = namespace(dry_seen=false, bad=[]) %}
            {% for e in ladder %}
              {% if states(e) == 'off' %}{% set ns.dry_seen = true %}
              {% elif states(e) == 'on' and ns.dry_seen %}{% set ns.bad = ns.bad + [e] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad }}

      # ── THE ONE THE AUTOMATION WOULD GATE ON ────────────────────────────────────────────
      #
      # A fill to 9 in draws ~15 gallons, measured 2026-10-24. At 1.958 gal/in that is 7.66
      # inches of reservoir, so the 9 in float is the lowest one that can cover a full
      # flood: wet at 9 in means at least 17.6 gallons present against ~15 needed.
      #
      # THAT IS A FLOOR, NOT COMFORT. Starting a flood at exactly 9 in finishes near 2.6
      # gallons, which is almost dry and leaves nothing for the next cycle. 12 in (23.5 gal)
      # is the level to actually keep it at; `hydro_reservoir_low` below is the nudge.
      #
      # REFUSES WHEN IT CANNOT SEE. Unreadable floats or a disagreeing ladder both make this
      # false. The failure that prompted all of this was a pump running against water that
      # was not there, so "I do not know" must behave like "no" -- the opposite default
      # would reintroduce exactly the stall-and-latch loop this exists to prevent.
      # NO device_class: problem ON THIS ONE. It used to carry it, and that is why the owner
      # reported two faults on a healthy reservoir on 2026-11-15:
      #
      #   "i have no idea what the 'why not' fault even means, but 'enough water to flood to 9\"'
      #    should not be faulted. the 12\" reservoir sensor is wet meaning there are at least 24
      #    gallons in it."
      #
      # He was right, and nothing was wrong with the water. This is a CAPABILITY sensor: its state
      # is TRUE when the reservoir CAN flood -- the comment above says so plainly ("unreadable
      # floats or a disagreeing ladder both make this false"). device_class: problem inverts how
      # Home Assistant READS that: for a problem sensor `on` means a problem EXISTS, so a healthy
      # reservoir rendered as a fault and a dry one would have rendered as OK. Exactly backwards,
      # and silently -- the logic was always correct.
      #
      # His report is also the proof. For a problem sensor a FALSE state displays as "OK", so a
      # genuinely empty reservoir could not have produced the fault he saw; seeing the fault means
      # the state was true, which means there was enough water.
      #
      # The dashboard row reads "ENOUGH WATER to flood to 9 in", which is positive phrasing and
      # correct for a capability. With no device_class it renders on/off against that label and
      # says what it means. Inverting the logic instead would have been the wrong repair: the
      # why_not attribute, the comment above and the row name are all written around
      # true-means-able.
      - name: Hydro reservoir can flood
        unique_id: hydro_reservoir_can_flood
        icon: mdi:water-check
        state: >
          {{ is_state('binary_sensor.hydro_reservoir_floats_readable','on')
             and is_state('binary_sensor.hydro_reservoir_floats_disagree','off')
             and is_state('binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch','on') }}
        attributes:
          why_not: >
            {% if not is_state('binary_sensor.hydro_reservoir_floats_readable','on') %}
              reservoir floats unreadable - refusing rather than guessing
            {% elif is_state('binary_sensor.hydro_reservoir_floats_disagree','on') %}
              reservoir ladder disagrees - a bobber is stuck
            {% elif not is_state('binary_sensor.hydroponics_inputs_hydro_reservoir_float_9_inch','on') %}
              below 9 in (~17.6 gal); a flood to 9 in draws ~15 gal
            {% else %}
              ok
            {% endif %}

      # The nudge, not the gate. Below 6 in is ~11.7 gallons: not enough for a 9 in flood,
      # and the point at which topping up stops being optional.
      - name: Hydro reservoir low
        unique_id: hydro_reservoir_low
        device_class: problem
        icon: mdi:water-alert
        state: >
          {{ is_state('binary_sensor.hydro_reservoir_floats_readable','on')
             and is_state('binary_sensor.hydroponics_inputs_hydro_reservoir_float_6_inch','off') }}


# ---------------------------------------------------------------------------
# Script: one flood -> hold -> drain cycle, updating the PERSISTENT phase at each
# step so a mid-cycle reboot is recoverable. mode: single = never overlaps.
# ---------------------------------------------------------------------------
script:
  # ── FILL ONLY / DRAIN ONLY: THE HALVES OF A CYCLE, SEPARATELY ───────────────────────────────
  #
  # Requested 2026-10-24. The full cycle fills to a depth, holds, then drains. These do one half
  # and stop.
  #
  # WHY IT IS WORTH HAVING: a 9" fill has never completed, and nobody knows how long one actually
  # TAKES, because every attempt so far ended for a different reason -- a stuck bobber (a drain
  # pump cord holding it wet), a reservoir down to ~10 gal when ~15 is needed, or a human
  # intervening. The run at 25 gal was stopped BY THE OWNER mid-fill; the watchdog then reported
  # "357s stuck, a pump command was almost certainly lost", and I briefly took that as evidence the
  # time budget was too short. IT WAS NOT EVIDENCE OF ANYTHING -- the watchdog cannot distinguish a
  # lost command from a human switching the pump off, and I should not have inferred a flow problem
  # from it.
  #
  # So the honest state is: the true duration of a 9" fill is still unmeasured. hydro_fill_only has
  # NO target timer -- it runs until the float says stop, the hard limit says stop, or a human says
  # stop -- and it REPORTS THE ELAPSED SECONDS, which is the measurement nobody has yet.
  #
  # ⚠ hydro_fill_only LEAVES WATER IN THE BUCKETS INDEFINITELY, by request and by design. That is
  # NOT a normal growing state -- roots sitting in static water is how root rot starts -- so it is
  # a diagnostic and calibration tool, not a watering mode. The status text says so while it is on.
  #
  # BOTH FAILSAFES STILL APPLY. The hard limit is checked in the same wait that watches the target,
  # so the ceiling cannot be crossed while a human is distracted, and the ZEN20's own 6-minute
  # hardware auto-off on relay 3 remains the backstop underneath everything.
  # ACHIEVED DEPTH, READ OFF THE FLOATS. Walks the ladder top-down and reports the first WET one,
  # i.e. how high the water actually is, independent of what was asked for.
  hydro_log_fill:
    alias: "Hydro — record a fill in the log"
    mode: queued
    max: 5
    fields:
      source:
        description: "auto | manual | fill-only"
        example: manual
    sequence:
      - variables:
          reached: >-
            {% if is_state('binary_sensor.hydroponics_inputs_hydro_float_11_inch','on') %}LIMIT
            {% elif is_state('binary_sensor.hydroponics_inputs_hydro_float_9_inch','on') %}9in
            {% elif is_state('binary_sensor.hydroponics_inputs_hydro_float_7_5_inch','on') %}7.5in
            {% elif is_state('binary_sensor.hydroponics_inputs_hydro_float_6_inch','on') %}6in
            {% elif is_state('binary_sensor.hydroponics_inputs_hydro_float_low_second','on') %}low2
            {% elif is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','on') %}low1
            {% else %}DRY{% endif %}
          entry: "{{ now().strftime('%m-%d %H:%M') }} {{ source | default('?') }} {{ reached | trim }}"
          # BUILT HERE, NOT IN THE SERVICE CALL. check_config rejected this expression twice when
          # it lived in data.value -- "template value should be a string for dictionary value @
          # data['sequence'][1]['data']" -- first as a folded block, then as a single line, so the
          # shape of the string was never the problem. A service call's data wants simple
          # templates; `variables:` is where a complex one belongs, and the call then references a
          # plain variable.
          # split IS A STRING METHOD HERE, NOT A FILTER. check_config: "No filter named 'split'"
          # (HA deploy job 167929). `reject('eq', '')` is gone for the same reason -- rather than
          # discover which tests this Jinja has one deploy at a time, the empty case is handled
          # with a plain `if prev` and nothing exotic is used at all.
          #
          # THIRD ATTEMPT AT THIS ONE EXPRESSION, and the first two failures were me guessing at
          # the nearest plausible cause instead of reading the message: a folded block, then a
          # single line, when the validator had been pointing at the template's LOCATION and then
          # at an unknown filter. Each guess cost a merge and a deploy.
          newlog: >-
            {% set prev = states('input_text.hydro_fill_log') %}
            {% set rows = prev.split(' | ') if prev not in ['', 'unknown', 'unavailable'] else [] %}
            {{ ([entry] + rows)[:5] | join(' | ') }}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_fill_log }
        data:
          # A PLAIN VARIABLE REFERENCE. The expression that builds it lives in `variables:`
          # above, because check_config rejected it here twice -- as a folded block AND as a
          # single line. Both were valid YAML strings, so "make it one line" was never the fix;
          # the validator objects to a complex template in a service call's data, not to newlines.
          value: "{{ newlog }}"

  hydro_fill_only:
    alias: "Hydro — FILL only (no drain, no timer)"
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.hydro_maintenance
            state: "on"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "Fill refused — maintenance mode is on" }
          - stop: "Maintenance mode is on."
      # DRAIN CLOSED FIRST. Filling with the drain energised moves water in a circle and reads as
      # a fill that never rises -- which is indistinguishable from the fault being investigated.
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: filling }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_t_fill_start }
        data: { timestamp: "{{ as_timestamp(now()) | int }}" }
      - action: input_text.set_value

        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('FILL ONLY running to ' ~ states('input_select.hydro_manual_flood_depth') ~
                ' — will NOT drain itself') | truncate(118, true, '') }}
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_fill_parked }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_fill_reached_target }
      - action: switch.turn_on
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      # THIS WAIT IS NOW BOUNDED, AND THE REASON IT WAS NOT HAS EXPIRED.
      #
      # The original note read: "NO TIMEOUT ON PURPOSE -- that is the entire point of this script.
      # The hard limit is in the same wait, so the ceiling still stops it." Sound while the target
      # was always BELOW the ceiling. Since 2026-10-31 the selector offers 11", which IS the
      # ceiling float, so on that selection the condition collapses to
      #     is_state(hard_limit) or is_state(hard_limit)
      # and a stuck-dry hard-limit float leaves this script running the fill pump with nothing to
      # stop it -- the floor flood this entire file is organised around preventing.
      #
      # The bound is the fill ceiling plus a margin, so it cannot pre-empt a legitimate deep fill
      # (11" needs ~286s at 26 s/in, under hydro_fill_max_seconds at 330) but it does bound a float
      # that never goes wet. continue_on_timeout: true because the NEXT action turns the pump OFF
      # -- aborting the sequence here would leave it RUNNING, which is the opposite of safe.
      #
      # trim() on BOTH sides as belt and braces: a padded entity id here fails SILENTLY.
      - wait_template: "{{ is_state(hydro_target_float | trim, 'on') or is_state(hydro_hard_limit | trim, 'on') }}"
        timeout:
          seconds: "{{ (states('input_number.hydro_fill_max_seconds') | int(330)) + 30 }}"
        continue_on_timeout: true
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: full }
      - action: script.turn_on
        target: { entity_id: script.hydro_log_fill }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fill_parked }
        data:
          variables: { source: fill-only }
      # REPORT HOW LONG IT TOOK. This is the number the whole exercise exists to produce.
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('FILL ONLY done in ' ~
                ((as_timestamp(now()) - state_attr('input_datetime.hydro_t_fill_start','timestamp'))
                 | int) ~ 's — water left in the buckets, drain when finished')
               | truncate(118, true, '') }}
    variables:
      # ── TRIMMED, AND THAT IS NOT COSMETIC ──────────────────────────────────────────────────
      #
      # As a folded (>-) block this rendered with the spaces that surround the Jinja tags, so the
      # value was " binary_sensor..._depth_mid " -- PADDED. is_state() on a padded entity id does
      # not error; it returns False forever. The fill's stop condition was
      #     {{ is_state(hydro_target_float,'on') or is_state(hydro_hard_limit,'on') }}
      # so with the target permanently False it collapsed to the HARD LIMIT alone -- the overflow
      # float -- on a script that deliberately has NO TIMER.
      #
      # Observed 2026-10-24: a fill-only to 7.5" stopped after 139s with the mid float still DRY.
      # A silent False in a safety condition is the worst kind of bug: nothing logs, nothing
      # errors, and the guard simply is not there.
      #
      # The `| trim` is the fix; the single-line form below would also have avoided it, and both
      # are applied so neither a future reformat nor a copy-paste reintroduces it.
      hydro_target_float: >-
        {%- set sel = states('input_select.hydro_manual_flood_depth') -%}
        {%- if sel == '11 in' -%}binary_sensor.hydroponics_inputs_hydro_float_11_inch
        {%- elif sel == '9 in' -%}binary_sensor.hydroponics_inputs_hydro_float_9_inch
        {%- elif sel == '7.5 in' -%}binary_sensor.hydroponics_inputs_hydro_float_7_5_inch
        {%- else -%}binary_sensor.hydroponics_inputs_hydro_float_6_inch
        {%- endif -%}
      hydro_hard_limit: binary_sensor.hydroponics_inputs_hydro_float_11_inch

  # DRAIN TO EMPTY AND STOP. Terminates on the floats going dry, not on a duration, with the
  # drain ceiling as a cap so a stuck-wet float cannot run the pump forever.
  hydro_drain_only:
    alias: "Hydro — DRAIN only (to empty)"
    mode: single
    sequence:
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: draining }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "DRAIN ONLY running to empty" }
      - action: switch.turn_on
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - wait_template: "{{ is_state('binary_sensor.hydro_all_floats_dry','on') }}"
        timeout: "{{ (states('input_number.hydro_drain_max_seconds') | int(330)) + 30 }}"
        continue_on_timeout: true
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      # ASSERT THE OUTCOME IN THE STATUS, because "the drain ran" and "the buckets are empty" are
      # different claims and only the second one matters.
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data:
          option: "{{ 'empty' if is_state('binary_sensor.hydro_all_floats_dry','on') else 'fault' }}"
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('DRAIN ONLY finished — buckets dry'
                if is_state('binary_sensor.hydro_all_floats_dry','on')
                else 'DRAIN ONLY ran but floats are STILL WET — check for a stuck bobber or a '
                     'blocked line') | truncate(118, true, '') }}

  # ONE DOOR FOR HEALTH NOTIFICATIONS, so the throttle cannot be forgotten by the next caller.
  #
  # Both health-reporting paths route through here — the /5 level-triggered report and the
  # watchdog's successful-recovery note. Calling rest_command.hydro_alerts directly still
  # works and is deliberately not blocked (the damage channel must never be gated), but nothing
  # in this package should: that is how the /5 report came to send 11 times in 2.5 hours.
  #
  # THE THROTTLE IS ON NOTIFICATION, NOT DETECTION. The sensors keep evaluating every 5 minutes
  # and the watchdog keeps recovering every cycle — none of that changes. What changes is that a
  # condition which is STILL TRUE does not re-announce itself until the interval has passed, and
  # when it does, the message carries the day's recovery count so the repetition is visible in
  # one line instead of spread across a dozen.
  hydro_notify_health:
    alias: Hydro — notify health (throttled)
    mode: single
    sequence:
      # `timestamp`, NOT `as_timestamp(states(...))` — AND THIS THROTTLE IS WHY IT MATTERS.
      #
      # An input_datetime's state is a naive local string with no offset, so as_timestamp() hands
      # it to .timestamp(), which resolves it against the PROCESS time zone rather than HA's. The
      # container ran with no TZ from the 2026-09-04 cutover until 2026-09-16: Denver instance,
      # UTC process, every stored time reading back exactly 360 minutes early.
      #
      # This interval defaults to 360 minutes. The skew was 360 minutes. So `elapsed >= gap` was
      # true at a REAL elapsed time of zero, and the throttle added in 436420b — added precisely
      # because volume was the problem — suppressed nothing at all, for eleven days. A throttle
      # whose window happens to equal the clock error does not degrade. It vanishes, silently,
      # and the only evidence is the notifications it was supposed to stop.
      #
      # The `timestamp` attribute is computed by HA in HA's own zone and cannot drift with the
      # host. `none` is the never-notified case, which is due by definition.
      - variables:
          last: "{{ state_attr('input_datetime.hydro_health_last_notified','timestamp') }}"
          gap_min: "{{ states('input_number.hydro_health_notify_interval_minutes') | float(360) }}"
          due: >-
            {% if last is none %}
            true
            {% else %}
            {{ (as_timestamp(now()) - (last | float)) >= (gap_min | float * 60) }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ due | bool }}"
        then:
          - action: rest_command.hydro_alerts
            data: {}
            continue_on_error: true
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.hydro_health_last_notified }
            data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
        else:
          # Say so in the log rather than silently dropping it. A suppressed notification that
          # leaves no trace is indistinguishable from a monitor that stopped working.
          - action: system_log.write
            data:
              level: info
              message: >-
                HYDRO HEALTH (suppressed, re-notify in
                {{ ((gap_min | float * 60) - (as_timestamp(now()) - (last | float))) / 60
                   | round(0) }}m): {{ states('input_text.hydro_status') }}

  # I PLANTED TODAY. The single entry point for starting a crop, replacing "set the stage
  # select, then remember to tick Buckets Occupied ten days later".
  #
  # ORDER MATTERS AND IS NOT COSMETIC. hydro_stage_mature triggers on BOTH edges of
  # hydro_occupied and forces the stage back to `mature` when it goes off. So occupancy must
  # be cleared FIRST and the stage set SECOND -- do it the other way round and the fresh
  # `germination` is immediately overwritten by `mature`, the sow date never stamps, and the
  # system quietly behaves as though a full-grown crop is in the buckets.
  #
  # Setting the stage to `germination` is what stamps hydro_sow_date, via hydro_sow_stamp.
  # That date is the clock everything downstream reads: day 3 to seedling, then
  # hydro_flood_start_day to auto-occupy. So this script does not set the date itself -- one
  # writer for that value, and it is the stamp automation.
  hydro_log_planting:
    alias: "Hydro — I Planted Today"
    icon: mdi:seed
    mode: single
    sequence:
      # 1. Empty the system's idea of the old crop before the new stage lands.
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_occupied }
      # hydro_stage_mature runs on that edge; let it finish before we set germination,
      # otherwise we race it and lose.
      - delay: { seconds: 2 }
      # 2. Fresh crop. This stamps hydro_sow_date as a side effect (hydro_sow_stamp).
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_growth_stage }
        data: { option: germination }
      # 3. Clear anything that would silently stall the new crop's progression. A hold or a
      #    latched fault left over from the last crop would otherwise block auto-occupy in
      #    ten days' time, and the failure would be invisible until someone noticed dry
      #    buckets.
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_stage_manual_hold }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            Sown {{ now().strftime('%b %-d') }} — germination, pumps off. Flooding arms
            {{ (now() + timedelta(days = states('input_number.hydro_flood_start_day') | int(14))).strftime('%b %-d') }}.
      - action: system_log.write
        data:
          level: info
          message: >-
            HYDRO: planting logged. Stage -> germination, occupancy cleared, hold cleared.
            Auto-occupy in {{ states('input_number.hydro_flood_start_day') }} days.
      # 4. Record the batch in the GROW LOG. Until 2026-09-24 this script started the HA cycle
      #    and nothing else: the tracker's log was a separate, manual act, and on the evening
      #    six buckets were sown it still showed the previous crop's harvest as the latest
      #    event. One planting is one event; both systems should learn about it here.
      #
      #    LAST, and deliberately. Everything above is local state that must be correct whether
      #    or not the tracker is reachable -- the crop's entire schedule hangs off the sow stamp
      #    set in step 2. rest_command failures do not abort a script, so a tracker that is down
      #    costs a log entry, never the grow cycle.
      #
      #    This cannot feed back into control: the tracker only notifies HA on
      #    mature/harvested/discarded, and `sown` is none of those.
      - action: rest_command.hydro_log_sowing
        data: {}
      - action: script.hydro_notify_health
        data: {}

  hydro_flood_drain_cycle:
    alias: Hydro Flood/Drain Cycle
    mode: single
    icon: mdi:water-sync
    sequence:
      # REFUSE OUTRIGHT IF MAINTENANCE IS ON. The scheduler is already gated, but it is not
      # the only caller — the dashboard can run this script directly, and so can anyone
      # poking at Developer Tools. Gating only the scheduler protects against the automatic
      # path and leaves the manual one, which is precisely the path a person standing at the
      # reservoir is most likely to trigger by accident.
      #
      # `stop` with error: false because a refusal here is correct behaviour, not a failure:
      # this fires every time the maintenance switch does its job, and a script that logs an
      # error for working as designed trains people to ignore its errors.
      - if:
          - condition: state
            entity_id: input_boolean.hydro_maintenance
            state: "on"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "Cycle refused — maintenance mode is on" }
          - stop: "Maintenance mode is on; refusing to run a flood cycle."
            error: false

      # REFUSE OUTRIGHT IF THE FLOATS CANNOT BE READ. FAIL CLOSED — owner decision 2026-09-29,
      # reversing the fail-open default this package shipped with.
      #
      # WHAT THE OLD BEHAVIOUR DID, measured, because the reversal only makes sense against it:
      # the scheduler's float gate passed when `hydro_floats_healthy` was `off`, so a dead KC868
      # produced a BLIND fill. Nothing could see the target float, so the wait_template never
      # satisfied and the fill ran the full hydro_fill_max_seconds — 260s, which is 10.0" at the
      # 26 s/in 6-bucket calibration, against a 13" overflow line. It then latched a fault and
      # stopped. Bounded, but it over-floods by 4" at the mature 6" target and the ONLY thing
      # between it and the floor is a calibration constant measured once.
      #
      # THE OWNER'S CALL: hold the flood and report it, rather than water blind and hope the
      # constant still holds. The thirst risk that justified failing open is covered by the
      # scheduler announcing EVERY held flood (see hydro_flood_scheduler), so a sensor outage is
      # now loud and dry instead of silent and wet.
      #
      # DELIBERATELY NOT A FAULT LATCH. A latch would mean an ESPHome wifi blip costs a manual
      # reset before watering resumes; this refusal self-clears the moment the floats answer
      # again. `error: false` for the same reason as maintenance above — refusing is this
      # guard working, not failing.
      #
      # HERE RATHER THAN ONLY IN THE SCHEDULER, and the maintenance comment above already
      # makes the argument: this script has four callers (the scheduler, startup recovery, the
      # occupancy handler's immediate first flood, and the dashboard/Developer Tools). Gating
      # the scheduler alone would leave a blind fill reachable from the other three.
      - if:
          - condition: state
            entity_id: binary_sensor.hydro_floats_healthy
            state: "off"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                HELD — floats unreadable ({{ state_attr('binary_sensor.hydro_floats_healthy','unreadable')
                | default([], true) | count }} of 6); refusing to flood blind
          - stop: "Floats unreadable; refusing to run a flood cycle blind."
            error: false
      # --- FLOOD ---
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: filling }
      - action: switch.turn_off            # drain closed before we fill
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Flooding" }
      # stamp fill-start so recovery can drain proportionally to how long the fill ran
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_fill_started }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      # ── FILL TO A DEPTH, NOT A DURATION ────────────────────────────────────────────
      #
      # This used to be `delay: <computed seconds>`. The seconds came from target depth x a
      # calibration constant, which is an open loop: it assumed the pump moves water at a
      # known rate and that nothing had changed since the constant was measured. The build
      # doc called overflow next to the rack "the one catastrophic failure", and the only
      # thing standing between a wrong constant and that outcome was arithmetic.
      #
      # Float switches were installed and validated on 2026-08-16, so depth is now MEASURED.
      # The timer survives as a BOUND: it no longer decides when to stop, it only fires when
      # something is wrong — a pump moving no water, or a float that failed to trip. Both of
      # those are faults worth latching, not normal completions.
      #
      # THE CONSTANT WAS ALSO WRONG, which is the point. The full soak measured the FILL
      # bucket rising at ~38 s/inch; the configured calibration is 26 s/inch, measured across
      # the whole 6-bucket system. Both numbers are correct about different things — the fill
      # bucket leads while water gravity-feeds out to the plant buckets over 30-60s. A
      # duration-based fill cannot tell those apart. A float sitting at the target can.
      - variables:
          # Deepest early, shallower as roots grow down to meet the water. Entity IDs carry
          # the device/area prefix Home Assistant applies — they are NOT what the
          # ESPHome names alone would suggest, so they are written out rather than derived.
          #
          # TWO INDEPENDENT CONCEPTS (owner, 2026-10-02):
          #  1. AUTO schema — stage -> float. germination=day0 (9"), seedling=mid (7.5"),
          #     mature=mid (7.5"). mature was `mature` (6") until 2026-10-02; raised to 7.5"
          #     because 6" wets only the bottom ~1" of a mature plant's ~6" roots (~17%), below
          #     the bottom-1/3-to-3/4 flood-and-drain guidance (OSU Extension EM9458). 7.5" ≈ 42%,
          #     and still fully drains for the oxygenation ebb-and-flow depends on. The physical
          #     `mature` 6" float is now used only by a MANUAL 6" selection, never the schedule.
          #  2. MANUAL override — the dashboard "RUN a flood now" button lets a person pick the
          #     fill-stop depth for THAT run only (input_select.hydro_manual_flood_depth), so you
          #     can flood to 9" by hand even while the stage's auto cutoff is 7.5". Honoured ONLY
          #     when this script is NOT invoked by the scheduler/recovery (they pass scheduled:true).
          hydro_target_float: >-
            {%- set is_sched = scheduled | default(false) | bool -%}
            {%- set sel = states('input_select.hydro_manual_flood_depth') -%}
            {%- if not is_sched and sel == '11 in' -%}binary_sensor.hydroponics_inputs_hydro_float_11_inch
            {%- elif not is_sched and sel == '9 in' -%}binary_sensor.hydroponics_inputs_hydro_float_9_inch
            {%- elif not is_sched and sel == '7.5 in' -%}binary_sensor.hydroponics_inputs_hydro_float_7_5_inch
            {%- elif not is_sched and sel == '6 in' -%}binary_sensor.hydroponics_inputs_hydro_float_6_inch
            {%- else -%}{# ── SCHEDULED ────────────────────────────────────────────────────────
               DEEP SOAK FIRST. Owner 2026-10-31, from the crop: "the plants that stay wet grow the
               best... the first stage of our flooding [should] be to the sensor we're currently
               calling the hard stop... for like the first 2 weeks." So for hydro_deep_soak_days
               after SOWING the scheduled fill targets the HARD-LIMIT float (11"), which until now
               was only a ceiling and never a destination.

               WHAT THIS COSTS, SAID PLAINLY: the fill wait is
                   target_float OR hard_limit
               so during the soak both sides are the SAME sensor and the float ladder has no step
               above the target. The scheduled path is still bounded in time
               (hydro_fill_max_seconds, raised to 330 because 11" needs ~286s at 26 s/in), so a
               stuck-dry hard-limit float ends as a timed stall rather than a flooded floor — but
               it is a time bound, not a sensor bound, and that is strictly weaker. The manual
               hydro_fill_only script has NO timer and must not be pointed at this depth.

               Then the previous rule: half the crop's life at 9", the rest at 7.5". #}
              {#- THE HOLD MEANS "THIS CROP IS BEHIND ITS DATE", AND NOW IT REACHES THE DEPTH.
                  input_boolean.hydro_stage_manual_hold is documented as existing because "the
                  stage is a proxy for ROOT DEPTH, not for calendar age, and the two come apart
                  when a crop develops slowly" -- and it claimed holding at `seedling` floods
                  deeper than the age calls for. That stopped being true: this selector reads
                  SOW AGE and ignores growth_stage entirely, so the hold pinned a stage that no
                  longer influenced flood depth. A switch labelled "pin the flood depth" that
                  does not affect the flood depth.
                  Owner 2026-11-02: "for right now i want to do 11in to week 3 ... there's 1
                  healthy plant and the rest are too small." The crop is at day 26, so a week-3
                  window cannot cover it -- the criterion is SIZE and the gate is AGE. Rather
                  than inflate the window until it happens to span today (it would expire again
                  two days later, silently), or move the sow date (which would corrupt every
                  other age-derived thing: fan start, pace alerts, profile life), the hold now
                  forces the soak depth outright. One switch, already in the UI, already
                  documented for exactly this, and it makes its own label true again. -#}
              {% set sd0 = states('input_datetime.hydro_sow_date') %}
              {% set soak = states('input_number.hydro_deep_soak_days') | float(21) %}
              {% if is_state('input_boolean.hydro_stage_manual_hold','on')
                    or (sd0 not in ['unknown','unavailable','']
                        and ((as_timestamp(now()) - as_timestamp(sd0)) / 86400) < soak) %}
                binary_sensor.hydroponics_inputs_hydro_float_11_inch
              {% else %}{# ── AFTER THE SOAK: HALF THE CROP'S LIFE AT 9", THE REST AT 7.5" ──────
               Owner's rule 2026-10-07, replacing a STAGE-based choice that never actually
               reached 9". The stage ladder was germination->9", seedling->7.5", mature->7.5";
               but flooding does not begin until hydro_flood_start_day (14) and the crop is
               already `mature` by then, so every scheduled flood went straight to 7.5" and the
               9" float was dead code for a direct-sown crop.

               6" IS NEVER USED ON SCHEDULE. Measured on this rig: even at 55 days the roots had
               not reached a 6" flood, so it waters nothing. It stays reachable only as a manual
               selection above.

               Age from the SOW DATE, not the stage and not sensor.hydro_plant_age -- that
               sensor reads -1 while occupancy is off. Unknown sow date falls back to 9", the
               deeper and therefore safer of the two. #}
              {% set sd = states('input_datetime.hydro_sow_date') %}
              {% set life = (state_attr('sensor.hydro_active_profile','profile') or {}).get('life', 55) | float %}
              {% if sd in ['unknown','unavailable',''] %}binary_sensor.hydroponics_inputs_hydro_float_9_inch
              {% elif ((as_timestamp(now()) - as_timestamp(sd)) / 86400) < (life / 2) %}binary_sensor.hydroponics_inputs_hydro_float_9_inch
              {% else %}binary_sensor.hydroponics_inputs_hydro_float_7_5_inch{% endif %}{% endif %}{% endif %}
          hydro_hard_limit: binary_sensor.hydroponics_inputs_hydro_float_11_inch
          hydro_low_guard: binary_sensor.hydroponics_inputs_hydro_float_low_guard

      # REFUSE TO START IF THE HARD LIMIT IS ALREADY WET. Starting a fill on a bucket already at
      # 11" -- the ceiling float, on a 12" bucket -- is the one thing this must never do, and it
      # costs one condition. (Read 13" until 2026-10-31, a depth the bucket cannot reach.)
      - if:
          - condition: template
            value_template: "{{ is_state(hydro_hard_limit | trim, 'on') }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.hydro_fault_latch }
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "FAULT — hard limit already wet before fill" }
          - stop: "Hard limit float is wet before the fill started."

      # ── ALREADY AT DEPTH? THEN DO NOT PUMP ─────────────────────────────────────────
      # If the target float is already wet, the system is at the depth this cycle was going
      # to pump toward. Running the fill anyway would add water to a bucket that is already
      # where it should be — at best a no-op that wastes a pump cycle, at worst an overshoot
      # toward the hard limit.
      #
      # The floats make this knowable. Before them, the only way to answer "is it already
      # full?" was to pump and find out.
      #
      # NOTE it still HOLDS and DRAINS. Skipping the fill is not skipping the cycle: the
      # point of a flood is the soak, and water already standing at depth has been there for
      # an unknown time. Draining immediately would cut short a soak that may have only just
      # started.
      - if:
          - condition: template
            value_template: "{{ is_state(hydro_target_float, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "Already at target depth — skipping fill, holding then draining" }
        else:

        # ── TOP-UP LOOP ────────────────────────────────────────────────────────────────
        # Stopping at the target float is not the same as LANDING at the target depth. The
        # floats sit in the FILL bucket, which leads the rest of the system: water gravity-feeds
        # out to the plant buckets over 30-60s afterwards. Measured 2026-08-16 — a fill stopped
        # at the 9" float settled to 7.5". The plants got 7.5" when the schedule said 9".
        #
        # So the fill repeats: fill to the float, stop, let it equalise, and if the float has
        # gone dry again, top up. It terminates when the float is STILL WET after settling,
        # which is the only state that means the whole system is at target rather than just the
        # bucket the sensor happens to live in.
        #
        # Each pass replaces only what drained out, so the deficit shrinks quickly.
        # RESET THE EVIDENCE FLAG BEFORE THE FILL, not only in hydro_fill_only. Until now
        # input_boolean.hydro_fill_reached_target was cleared in the fill-only script and never
        # in this one, so in hydro_flood_drain_cycle it was sticky: once any fill had set it, it
        # stayed on. It is about to become the success test, and a sticky success flag would make
        # a failed fill inherit the previous one's verdict.
        - action: input_boolean.turn_off
          target: { entity_id: input_boolean.hydro_fill_reached_target }
        - repeat:
            sequence:
              - action: switch.turn_on
                target: { entity_id: switch.z_wave_plus_power_strip_3 }

              # wait_template, not wait_for_trigger: the target entity is chosen at runtime from the
              # growth stage, and a state trigger cannot take a templated entity_id.
              #
              # Waits on EITHER the target OR the hard limit, so the emergency stop is not a separate
              # racing automation that might run after the pump has already overfilled.
              # THE FIRST PASS GETS THE FULL FILL CEILING; A TOP-UP GETS MUCH LESS.
              # These are different operations and used to share one timeout. repeat.index 1 is
              # the primary fill from empty -- 333 s measured to 11in, so it needs
              # hydro_fill_max_seconds. Every later pass is topping up the settled difference,
              # which has taken 28, 18, 14 and 29 s on the occasions it has worked.
              #
              # Giving a top-up 600 s meant one dry top-up pumped for 358 s and blew the 720 s
              # phase watchdog budget, so the loop was killed mid-retry and the fault was
              # reported as a lost pump command rather than as no water. See the comment on
              # hydro_fill_topup_max_seconds for the arithmetic.
              - wait_template: >-
                  {{ is_state(hydro_target_float | trim, 'on') or is_state(hydro_hard_limit | trim, 'on') }}
                timeout:
                  seconds: >-
                    {{ (states('input_number.hydro_fill_max_seconds') | int(300))
                       if repeat.index == 1
                       else (states('input_number.hydro_fill_topup_max_seconds') | int(90)) }}
                continue_on_timeout: true

              # PUMP OFF FIRST, BRANCH SECOND. Whatever happened, stopping the water is the urgent
              # part; deciding what it means is not.
              - action: switch.turn_off
                target: { entity_id: switch.z_wave_plus_power_strip_3 }

              - choose:
                  # ── THE TOP FLOAT IS A FAULT ONLY IF WE WERE NOT AIMING AT IT ──────────────
                  # THIS BRANCH IS WHAT ACTUALLY LATCHED THE FAULT ON 2026-11-02, and it is a
                  # SECOND code path from the overflow-guard automation. The live value of
                  # input_text.hydro_status was "FAULT — hard limit tripped during fill", which
                  # is this literal verbatim; the guard writes "FAULT — <why>; auto-flood
                  # halted" instead. Fixing the guard alone (automation!1999) left this intact,
                  # so every deep-soak fill would have gone on latching a fault and halting
                  # auto-flooding with the autoclear budget exhausted.
                  #
                  # Why it fires on a SUCCESSFUL soak fill: during the deep soak
                  # hydro_target_float IS hydro_hard_limit (both the 11in float), the
                  # wait_template above returns as soon as either is wet -- the same entity --
                  # and this branch then reads "hard limit tripped" from the fill having
                  # reached exactly where it was sent.
                  #
                  # So the test is the same one the overflow guard uses, expressed in the terms
                  # available here: the top float is an overshoot only when it is not the float
                  # we were filling to. Comparing the resolved ENTITY IDS rather than depths,
                  # because that is what this script already has in hand and it cannot drift
                  # from the selector the wait above used.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ is_state(hydro_hard_limit | trim, 'on')
                             and (hydro_hard_limit | trim) != (hydro_target_float | trim) }}
                    sequence:
                      - action: input_boolean.turn_on
                        target: { entity_id: input_boolean.hydro_fault_latch }
                      - action: input_text.set_value
                        target: { entity_id: input_text.hydro_status }
                        # Name both depths. "hard limit tripped" described the ceiling and said
                        # nothing about intent, which is why the old message read as a hardware
                        # failure on fills that had simply arrived where they were sent.
                        data:
                          value: >-
                            {{ ('FAULT — overshot past ' ~ states('sensor.hydro_target_depth')
                                ~ 'in target to the hard limit during fill') | truncate(118, true, '') }}
                      - action: input_text.set_value
                        target: { entity_id: input_text.hydro_fault_reason }
                        data: { value: "hard-limit" }
                      - stop: "Hard limit tripped above target; fill aborted and fault latched."
                  # Timed out without reaching the target: pump moving no water, or a stuck float.
                  # Distinguishing those needs eyes on the bucket, so this latches rather than guesses.
                  - conditions:
                      # ── A TOP-UP THAT DOES NOT RE-TRIP IS NOT A FAILED FILL ────────────────
                      # This read `not is_state(hydro_target_float, 'on')` and is evaluated right
                      # after the pump stops on EVERY pass of the loop -- including top-ups. The
                      # column equalises below the float within 8 seconds, so on a top-up that
                      # bound out, the float is dry and this branch fired: drain, stop, no HOLD.
                      #
                      # Measured 2026-11-05 00:45, the first cycle after the previous fix:
                      #     00:50:40  hydro_fill_reached_target -> on   (the 11in float DID trip)
                      #     00:52:40  phase filling -> draining         (this branch aborted it)
                      # So the fill genuinely reached target, the flag recorded it, and the cycle
                      # was still thrown away -- because the previous fix went into the POST-LOOP
                      # success test and the abort happens INSIDE the loop, before the loop ever
                      # exits. Same mistake as the one before it: two places decide "did the fill
                      # work" and only one was corrected.
                      #
                      # So this now fires only if the target was NEVER reached on this fill. If it
                      # was, the loop finishes its remaining top-ups and exits via `until`, which
                      # lands on the post-loop test and proceeds to HOLD -- where the dwell
                      # happens and input_datetime.hydro_last_flood is stamped. That stamp is what
                      # the flood pacing reads, so without this the pacing can never engage.
                      - condition: template
                        value_template: >-
                          {{ not is_state(hydro_target_float | trim, 'on')
                             and not is_state('input_boolean.hydro_fill_reached_target', 'on') }}
                    sequence:
                      # RESOLVABLE, SO IT DOES NOT LATCH ON THE FIRST OCCURRENCE (2026-11-04).
                      # The flood has already happened, the drain returns the water, and the next
                      # cycle's primary fill works -- that is measured, not hoped for. Latching
                      # here suspended every later flood for a condition the rig recovers from by
                      # itself, which is what produced a day of faults and the notification service while the plants
                      # went unwatered.
                      #
                      # It escalates instead: count the consecutive occurrences and latch only
                      # once the logic has DEMONSTRATED it cannot resolve them. Any fill that
                      # reaches target resets the counter, so this only fires on a genuine streak.
                      - action: counter.increment
                        target: { entity_id: counter.hydro_fill_faults_consecutive }
                      - action: input_text.set_value
                        target: { entity_id: input_text.hydro_fault_reason }
                        data: { value: "fill-timeout" }
                      - if:
                          - condition: template
                            value_template: >-
                              {{ (states('counter.hydro_fill_faults_consecutive') | int(0))
                                 >= (states('input_number.hydro_fill_max_consecutive_faults') | int(3)) }}
                        then:
                          - action: input_boolean.turn_on
                            target: { entity_id: input_boolean.hydro_fault_latch }
                          - action: input_text.set_value
                            target: { entity_id: input_text.hydro_status }
                            data:
                              value: >-
                                {{ ('FAULT — fill short of target '
                                    ~ states('counter.hydro_fill_faults_consecutive')
                                    ~ 'x in a row — needs a look') | truncate(118, true, '') }}
                          - action: system_log.write
                            data:
                              level: error
                              message: >-
                                HYDRO FILL: short of target
                                {{ states('counter.hydro_fill_faults_consecutive') }} cycles in a
                                row, so this is no longer self-resolving and the latch is set.
                                Check the reservoir level first -- a 11in flood draws ~18 gal and
                                the fill pump cannot reach the bottom of the tank.
                          - action: rest_command.hydro_alerts
                            data: {}
                            continue_on_error: true
                        else:
                          - action: input_text.set_value
                            target: { entity_id: input_text.hydro_status }
                            data:
                              value: >-
                                {{ ('CHECK — fill short of target ('
                                    ~ states('counter.hydro_fill_faults_consecutive') ~ ' of '
                                    ~ (states('input_number.hydro_fill_max_consecutive_faults') | int(3))
                                    ~ ') — draining and retrying') | truncate(118, true, '') }}
                          - action: system_log.write
                            data:
                              level: warning
                              message: >-
                                HYDRO FILL: short of target, occurrence
                                {{ states('counter.hydro_fill_faults_consecutive') }} of
                                {{ states('input_number.hydro_fill_max_consecutive_faults') | int(3) }}.
                                NOT latching -- the drain returns the water and the next cycle
                                retries. Latches if this becomes a streak.
                      # ── DRAIN BEFORE STOPPING, DO NOT JUST RELABEL THE PHASE ────────────
                      # My first attempt at this set `phase: full` and stopped. That fixed the
                      # stale-'filling' problem and created a worse one: 'full' with NO DRAIN
                      # SCHEDULED is a state the stuck-phase watchdog is watching, and it fired
                      # 446 s later against its 420 s budget for `full` --
                      #     "HYDRO WATCHDOG: phase 'full' stuck 446s (budget 420s)"
                      # -- latching the fault that the escalation had deliberately NOT latched one
                      # cycle earlier. Setting a phase string without performing the action it
                      # describes just hands the problem to whatever is watching that phase.
                      #
                      # The water is in the buckets and the cycle is over, so the correct action is
                      # the one the cycle would have taken anyway: drain it out. Bounded by the
                      # drain's own ceiling, and the drain-runaway guard still applies.
                      - action: input_select.select_option
                        target: { entity_id: input_select.hydro_phase }
                        data: { option: draining }
                      - action: switch.turn_on
                        target: { entity_id: switch.z_wave_plus_power_strip_4 }
                      - wait_template: >-
                          {{ is_state('binary_sensor.hydro_all_floats_dry','on') }}
                        timeout:
                          seconds: "{{ states('input_number.hydro_drain_max_seconds') | float(900) | round(0) | int }}"
                        continue_on_timeout: true
                      - action: switch.turn_off
                        target: { entity_id: switch.z_wave_plus_power_strip_4 }
                      - delay:
                          seconds: "{{ states('input_number.hydro_drain_settle_seconds') | int(20) }}"
                      # empty if it actually emptied, full if it did not -- either way a phase that
                      # matches reality, which is the whole point. The hourly latch-retry and the
                      # polish drain both take it from here.
                      - action: input_select.select_option
                        target: { entity_id: input_select.hydro_phase }
                        data:
                          option: >-
                            {{ 'empty' if is_state('binary_sensor.hydro_all_floats_dry','on')
                               else 'full' }}
                      - stop: "Fill short of target; drained and will retry."
                default:
                  # ── "THE SUCCESS BRANCH" IS NOW TWO DIFFERENT THINGS, AND THEY MUST SPLIT ──
                  # Reaching `default` used to mean one thing: this pass tripped the target
                  # float. Since the abort branch above stopped firing on a top-up that merely
                  # failed to RE-trip (correctly -- an 8-second column equalisation is not a
                  # failed fill), `default` is also where every such top-up lands. Two passes
                  # per cycle now arrive here having moved the water nowhere near the float.
                  #
                  # Left undivided, that re-breaks the one thing this log was built to
                  # guarantee. The comment it replaces says it: "LOGGED ON THE SUCCESS BRANCH
                  # ONLY. A timed-out fill is not a fill -- logging attempts is exactly how
                  # counter.hydro_cycles_today came to read 3 on a day with zero completed
                  # fills." With two top-ups per cycle, the fill log would carry three entries
                  # per flood and read as three floods. The status text would also assert
                  # "Filled to target depth" on a pass that added a couple of cups.
                  #
                  # So the test is explicit instead of positional: did the target float trip on
                  # THIS pass. That is the same question the removed abort branch asked; what
                  # changed is only that failing it is no longer treated as a fault.
                  - if:
                      - condition: template
                        value_template: "{{ is_state(hydro_target_float | trim, 'on') }}"
                    then:
                      - action: input_text.set_value
                        target: { entity_id: input_text.hydro_status }
                        data: { value: "Filled to target depth" }
                      # THE STREAK RESETS ONLY HERE, on a fill that actually reached the target
                      # float. Without this the counter would accumulate across unrelated days
                      # and eventually latch on a rig that is working -- the same way a retry
                      # budget that never resets becomes a time bomb.
                      - action: counter.reset
                        target: { entity_id: counter.hydro_fill_faults_consecutive }
                      - action: input_boolean.turn_on
                        target: { entity_id: input_boolean.hydro_fill_reached_target }
                      - action: script.turn_on
                        target: { entity_id: script.hydro_log_fill }
                        data:
                          variables:
                            source: "{{ 'auto' if (scheduled | default(false) | bool) else 'manual' }}"
                    else:
                      # A top-up that added water without re-tripping the float. The cycle has
                      # already succeeded -- hydro_fill_reached_target is on, which is why the
                      # abort branch passed this pass through -- so say that, and do not touch
                      # the counter, the flag or the log.
                      - action: input_text.set_value
                        target: { entity_id: input_text.hydro_status }
                        data: { value: "Topping up after reaching target" }

              # Let the buckets equalise before judging whether this pass was enough.
              - delay:
                  seconds: "{{ states('input_number.hydro_settle_seconds') | int(30) }}"
            until:
              - condition: template
                value_template: >-
                  {{ is_state(hydro_target_float, 'on')
                     or repeat.index >= (states('input_number.hydro_fill_max_topups') | int(4)) + 1 }}

        # Converged, or gave up. Distinguished, because "still short after 4 passes" is a
        # symptom — most likely a leak, or a reservoir too low to reach the target.
        - if:
            - condition: template
              # ── SUCCESS IS THAT THE TARGET FLOAT TRIPPED, NOT THAT IT IS STILL WET ─────
              # This read `is_state(hydro_target_float, 'on')` -- the float's state AFTER the 30s
              # settle. The intent was right and is documented above the loop: the floats sit in
              # the FILL bucket, which leads the others, so "still wet after settling" is the only
              # state proving the WHOLE system reached depth rather than just the sensor's bucket.
              #
              # Measured 2026-11-04, it is also unachievable on this rig. The column equalises
              # below the float within 8 SECONDS, every single time, and two top-ups do not change
              # it. The consequence was not a slightly shallow flood -- it was NO FLOOD AT ALL:
              # nine consecutive cycles from 21:45 went `filling` -> `draining` and never once
              # reached `full`, so the HOLD was skipped entirely and the roots got no dwell. The
              # phase history is unambiguous: 3 `full` in four hours against 12 fills.
              #
              # It also silently broke the flood pacing added in the same session, because
              # input_datetime.hydro_last_flood is stamped inside HOLD. Nothing reached it, the
              # timestamp stayed two days old, and the new interval gate would have read "due"
              # forever.
              #
              # So the test is now "the target float TRIPPED during this fill"
              # (hydro_fill_reached_target, set in the loop the instant the float reads wet). The
              # plant buckets may settle a little under target; they get a proper soak instead of
              # an instant drain, which is the better trade and the one the crop cares about. The
              # shortfall is still visible -- binary_sensor.hydro_fill_column_confirmed and the
              # float ladder both report it -- it is just no longer treated as a failed flood.
              value_template: >-
                {{ is_state(hydro_target_float, 'on')
                   or is_state('input_boolean.hydro_fill_reached_target', 'on') }}
          then:
            # THE TARGET FLOAT ALONE IS ONE SENSOR'S OPINION. Reaching the target depth means
            # the target float AND every float beneath it are submerged — filling to day0 should
            # be confirmed by mid, mature and both low floats. If the target reads wet while
            # something below it reads dry, water is not one surface and the cutoff we just
            # honoured came from a float that cannot be trusted.
            #
            # Checked HERE, after the top-up loop has settled, rather than during the fill:
            # mid-fill the column is legitimately inconsistent as the water line sweeps past
            # each float. This is the one moment the whole column should agree.
            #
            # Faults rather than proceeding. The alternative is a HOLD and a DRAIN scheduled
            # against a depth nobody actually verified.
            - if:
                - condition: state
                  entity_id: binary_sensor.hydro_floats_healthy
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.hydro_fill_column_confirmed
                  state: "off"
              then:
                - action: switch.turn_off
                  target: { entity_id: switch.z_wave_plus_power_strip_3 }
                - action: input_boolean.turn_on
                  target: { entity_id: input_boolean.hydro_fault_latch }
                - variables:
                    dry: >-
                      {{ state_attr('binary_sensor.hydro_fill_column_confirmed','dry_below_target')
                         | default([], true) }}
                - action: input_text.set_value
                  target: { entity_id: input_text.hydro_status }
                  data:
                    value: >-
                      {{ ('FAULT — target float wet but ' ~ (dry | count) ~
                          ' float(s) below it dry; column unconfirmed')
                         | truncate(118, true, '') }}
                - action: system_log.write
                  data:
                    level: error
                    message: >-
                      HYDRO FAILSAFE (fill column): target depth reached but {{ dry | join(', ') }}
                      still read dry — a float below the waterline cannot be dry. Fill stopped,
                      fault latched before hold/drain.
                - action: rest_command.hydro_alerts
                  data: {}
                  continue_on_error: true
                - stop: "Fill target reached but the column below it is not confirmed wet."
            - action: input_text.set_value
              target: { entity_id: input_text.hydro_status }
              data: { value: "Filled and settled at target depth — full column confirmed" }
          else:
            # ── ESCALATES, DOES NOT LATCH ON THE FIRST OCCURRENCE (2026-11-04) ─────────────────
            # Same class as the fill-timeout branch and the same reasoning: the flood has already
            # happened, the drain returns the water, and the next cycle's fill works -- measured
            # four times over two days. The owner's rule is to "only use the latch if the logic
            # can't resolve the problem", and a fill that lands below target is resolvable until
            # it proves otherwise.
            #
            # It shares counter.hydro_fill_faults_consecutive with the other resolvable fill
            # faults, so three of ANY mix of them in a row still latches -- the streak is about
            # the fill not working, not about which branch noticed.
            - action: counter.increment
              target: { entity_id: counter.hydro_fill_faults_consecutive }
            - if:
                - condition: template
                  value_template: >-
                    {{ (states('counter.hydro_fill_faults_consecutive') | int(0))
                       >= (states('input_number.hydro_fill_max_consecutive_faults') | int(3)) }}
              then:
                - action: input_boolean.turn_on
                  target: { entity_id: input_boolean.hydro_fault_latch }
                - action: input_text.set_value
                  target: { entity_id: input_text.hydro_status }
                  data:
                    value: >-
                      {{ ('FAULT — below target after top-ups '
                          ~ states('counter.hydro_fill_faults_consecutive')
                          ~ 'x in a row — check the reservoir') | truncate(118, true, '') }}
                - action: rest_command.hydro_alerts
                  data: {}
                  continue_on_error: true
              else:
                - action: input_text.set_value
                  target: { entity_id: input_text.hydro_status }
                  data:
                    value: >-
                      {{ ('CHECK — below target after top-ups ('
                          ~ states('counter.hydro_fill_faults_consecutive') ~ ' of '
                          ~ (states('input_number.hydro_fill_max_consecutive_faults') | int(3))
                          ~ ') — draining, will retry') | truncate(118, true, '') }}
            # ── RECORD THE REASON, AND DO NOT LEAVE THE PHASE LYING ───────────────────────────
            # Both added 2026-11-02 after this branch fired for real on an 11in fill and its
            # diagnosis was destroyed five minutes later.
            #
            # 1. fault_reason. The status text above is the most specific thing this system ever
            #    says -- "still below target after max top-ups (leak or low reservoir?)" names
            #    the actual physics. The phase watchdog then OVERWROTE it with the generic
            #    "WATCHDOG — filling stalled 13m, draining 295s", and fault_reason was empty, so
            #    the real cause survived nowhere. Diagnosing it meant reading home-assistant.log
            #    on the host. A reason field that is written only by some fault paths is worse
            #    than useless: it reads as "no reason recorded" rather than "not recorded here".
            #
            # 2. phase. `stop:` ended the script with phase still 'filling' and water still in
            #    the buckets, so nothing drained and nothing reset -- the cycle simply stopped
            #    existing. What eventually cleaned up was the watchdog's stuck-phase recovery at
            #    798s, i.e. an unrelated safety net catching a mess this branch deliberately
            #    walked away from. Saying 'full' is TRUE (the water is in the buckets) and hands
            #    it to the full-phase budget (hold + margin, 240s) instead of the filling budget
            #    (720s), so the water goes back ~9 minutes sooner and by the path meant for it.
            - action: input_text.set_value
              target: { entity_id: input_text.hydro_fault_reason }
              data: { value: "never-settled" }
            # ── DRAINS TOO, SAME REASONING AS THE SHORT-FILL PATH ABOVE ───────────────────────
            # This set `phase: full` and stopped, which is what the stuck-phase watchdog fired on
            # at 10:00 against its 420 s budget for `full`. Water in the buckets with no drain
            # scheduled is not a resting state, whatever the phase says.
            - action: input_select.select_option
              target: { entity_id: input_select.hydro_phase }
              data: { option: draining }
            - action: switch.turn_on
              target: { entity_id: switch.z_wave_plus_power_strip_4 }
            - wait_template: >-
                {{ is_state('binary_sensor.hydro_all_floats_dry','on') }}
              timeout:
                seconds: "{{ states('input_number.hydro_drain_max_seconds') | float(900) | round(0) | int }}"
              continue_on_timeout: true
            - action: switch.turn_off
              target: { entity_id: switch.z_wave_plus_power_strip_4 }
            - delay:
                seconds: "{{ states('input_number.hydro_drain_settle_seconds') | int(20) }}"
            - action: input_select.select_option
              target: { entity_id: input_select.hydro_phase }
              data:
                option: >-
                  {{ 'empty' if is_state('binary_sensor.hydro_all_floats_dry','on') else 'full' }}
            - stop: "Fill never settled at target depth."

      # --- HOLD (buckets full) ---
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: full }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Flooded — holding" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_last_flood }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      # THE DWELL. sensor.hydro_flood_hold resolves deep-vs-normal in one place; see its
      # definition for why all three consumers must read the same value.
      - delay: { seconds: "{{ states('sensor.hydro_flood_hold') | int(300) }}" }
      # --- DRAIN ---
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: draining }
      - action: switch.turn_off            # fill off before drain
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Draining" }
      # ── DRAIN UNTIL EMPTY, NOT FOR A DURATION ──────────────────────────────────────
      # Same change as the fill, for the same reason. This was a fixed 238s delay, which is
      # wrong in both directions: on already-empty buckets it runs the drain pump dry for
      # four minutes, and on a slow drain it stops early and leaves water standing.
      #
      # The low guard float (~3") is the emptiness signal. Waiting for it to go DRY means the
      # drain ends when the water is actually gone.
      #
      # Skipped entirely if it is already dry — there is nothing to pump, and running a pump
      # against no water is how a pump dies.
      - if:
          - condition: template
            value_template: "{{ is_state(hydro_low_guard, 'off') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "Already empty — nothing to drain" }
        else:
          - action: switch.turn_on
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
          - wait_template: "{{ is_state(hydro_low_guard, 'off') }}"
            timeout:
              seconds: "{{ states('input_number.hydro_drain_max_seconds') | int(360) }}"
            continue_on_timeout: true
          - action: switch.turn_off
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
          # LET GRAVITY FINISH BEFORE JUDGING. The float going dry is not the end of draining:
          # another 1/2"-3/4" leaves over the following 10-15s (measured 2026-08-16). Reading
          # the float the instant the pump stops is the same mistake the fill side already
          # made and fixed with its settle loop, and here it fails in the more damaging
          # direction — a drain that is nearly finished when it hits its bound reads as "water
          # still standing", latches a fault and halts auto-flooding, when a few more seconds
          # of gravity would have cleared it. That is exactly the slow-but-working drain this
          # check is least entitled to condemn.
          #
          # Costs nothing on a healthy cycle: by the time the pump stops normally the float is
          # already dry, so this delay runs against an empty bucket and changes no outcome.
          - delay:
              seconds: "{{ states('input_number.hydro_drain_settle_seconds') | int(20) }}"
          # A drain that hits its bound still has water in the buckets. That is a blocked
          # drain line or a failed pump, and it must not be reported as a completed cycle —
          # the next flood would start from a level nobody accounted for.
          - if:
              - condition: template
                value_template: "{{ is_state(hydro_low_guard, 'on') }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.hydro_fault_latch }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "FAULT — drain timed out with water still above the low float" }
              - stop: "Drain did not empty the buckets within its bound." 
      # --- EMPTY (safe) ---
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: empty }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Idle" }

automation:
  # ---------------------------------------------------------------------------
  # HARDWARE AUTO-OFF — the only failsafe that does not depend on Home Assistant.
  # ---------------------------------------------------------------------------
  # EVERY OTHER PROTECTION IN THIS FILE IS AN HA AUTOMATION, and therefore does not exist
  # while HA is down. That gap is not theoretical: a Z-Wave relay holds its state through a
  # reboot, so a fill interrupted by an HA restart leaves the pump ENERGISED with nothing
  # running that could notice. The hard-limit float cannot help — the automation that reads it
  # is not executing. At ~26 s/inch a few minutes of that is water on the floor, and the
  # reservoir holds 60 gallons.
  #
  # The Zooz ZEN20 counts down in its own firmware. No controller, no Z-Wave JS, no network,
  # no HA. The relay opens on its own silicon. That independence is the entire point: it is
  # the one layer that survives HA being the thing that failed.
  #
  #   relay 3 = fill pump   param 14 (enable) / 15 (minutes)
  #   relay 4 = drain pump  param 18 (enable) / 19 (minutes)
  #
  # SEVEN MINUTES, AND THE TUNING GOES THE OTHER WAY FROM THE USUAL. The longest legitimate
  # fill is ~234s (empty to the 9" float at 26 s/inch), bounded by hydro_fill_max_seconds at
  # 300s. 7 minutes is 79% above that, so it can never cut a real fill short — which matters,
  # because a failsafe that interferes with normal operation gets disabled by whoever is
  # annoyed by it at 2am.
  #
  # It is deliberately NOT tuned to stay under the 13" hard limit. Owner framing, and it is
  # the right one: exceeding 13" by two inches is a mopped floor, exceeding it by two feet is
  # sixty gallons through the room. Bounding the catastrophe matters; shaving the overshoot
  # does not. Optimising for the latter would have bought two inches at the cost of a timer
  # that occasionally fires mid-fill.
  #
  # IT IS A DURATION BOUND, AND ONLY EQUALS A DEPTH BOUND BECAUSE FILLS START EMPTY. The
  # scheduler refuses to fill unless the low float confirms the buckets are drained ((internal MR)).
  # Relax that and this timer stops implying any particular water level — the two are one
  # safety property, not two independent ones.
  #
  # The drain relay gets the same treatment for a different reason: running it dry does not
  # flood anything, it just destroys a pump.
  #
  # RE-ASSERTED ON EVERY START so it is declared here rather than remembered. A parameter set
  # once by hand in a UI is invisible to this repo and gone the moment the device is reset or
  # replaced; this makes the setting a fact about the config, not about somebody's afternoon.
  - id: hydro_assert_pump_autooff
    alias: Hydro — Assert hardware auto-off timers on the pump relays
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      # Re-assert daily too. A device that drops off the mesh and rejoins, or is re-included
      # after a swap, comes back with factory defaults and nothing else would notice.
      - trigger: time
        at: "03:30:00"
    actions:
      # Setting a parameter on an unavailable node is a silent no-op, the same trap the
      # startup pump-off had. Wait for the node before asserting anything.
      - wait_template: >-
          {{ states('switch.z_wave_plus_power_strip_3') not in ['unavailable','unknown']
             and states('switch.z_wave_plus_power_strip_4') not in ['unavailable','unknown'] }}
        timeout: { seconds: 180 }
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ states('switch.z_wave_plus_power_strip_3') not in ['unavailable','unknown'] }}
        then:
          # Fill pump — the dangerous one.
          - action: zwave_js.set_config_parameter
            target: { entity_id: switch.z_wave_plus_power_strip_3 }
            data: { parameter: 14, value: 1 }
            continue_on_error: true
          - action: zwave_js.set_config_parameter
            target: { entity_id: switch.z_wave_plus_power_strip_3 }
            data:
              parameter: 15
              value: "{{ states('input_number.hydro_pump_autooff_minutes') | int(7) }}"
            continue_on_error: true
          # Drain pump — protects the pump, not the room.
          - action: zwave_js.set_config_parameter
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
            data: { parameter: 18, value: 1 }
            continue_on_error: true
          - action: zwave_js.set_config_parameter
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
            data:
              parameter: 19
              value: "{{ states('input_number.hydro_pump_autooff_minutes') | int(7) }}"
            continue_on_error: true
          - action: system_log.write
            data:
              level: warning
              message: >-
                HYDRO: asserted ZEN20 hardware auto-off =
                {{ states('input_number.hydro_pump_autooff_minutes') }}min on the fill (relay 3)
                and drain (relay 4) pumps. This is the only pump cutoff that works with HA down.
        else:
          - action: system_log.write
            data:
              level: error
              message: >-
                HYDRO: could NOT assert hardware auto-off — the ZEN20 was unavailable. The
                pumps are protected only by HA automations until this succeeds.

  # ---------------------------------------------------------------------------
  # THE FAULT LATCH NOW REACHES A HUMAN.
  # ---------------------------------------------------------------------------
  # `input_boolean.hydro_fault_latch` is set from NINE places, and until now it was the
  # trigger for NOTHING. Two of those nine — the fill timeout and the drain timeout — did not
  # even call the notification service at their own call site, so the most consequential outcome in this file
  # produced no sound anywhere:
  #
  #   drain hits its bound, low float still wet  ->  latch on, status text written, `stop`
  #
  # That is a blocked drain line or a dead pump, water standing on the roots, and the latch
  # ALSO halts auto-flooding until it is cleared. So the failure mode was: watering silently
  # stops, and the only evidence is a text field nobody is looking at. That is the six-day
  # watering gap rebuilt out of different parts — a correct detection with no path to a person.
  #
  # WATCHING THE LATCH RATHER THAN PATCHING THE CALL SITES is deliberate, and is the same
  # reasoning (internal MR) used for the status text: nine sites means nine chances to forget, and the
  # tenth one added next month starts silent by default. Watching the latch means a fault
  # cannot be added without an alarm coming with it.
  - id: hydro_fault_latch_alarm
    alias: Hydro — Alarm when the fault latch trips
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_fault_latch
        from: "off"
        to: "on"
    actions:
      # THE CALL SITES SET THE LATCH BEFORE THEY WRITE THE REASON. hydro_alerts renders
      # input_text.hydro_status at send time, so firing immediately would push the PREVIOUS
      # status — a stale, probably cheerful string attached to an urgent alert, which is worse
      # than no detail at all. Waiting for the diagnosis to land costs nothing on a real fault
      # (the two actions are consecutive) and is robust to call sites written in either order,
      # which reordering nine existing sites would not be.
      - wait_template: >-
          {{ states('input_text.hydro_status') is search('^(FAULT|EMERGENCY)', ignorecase=true) }}
        timeout: { seconds: 10 }
        continue_on_timeout: true
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO: fault latch tripped — {{ states('input_text.hydro_status') }}.
            Auto-flooding is HALTED until the latch is cleared.

  # A SINGLE PUSH IS NOT A GUARANTEE OF DELIVERY, AND THE LATCH DOES NOT TIME OUT.
  #
  # While it is set the plants are not being watered. One missed notification — phone face
  # down, the notification service down for the minute it fired, alert cleared by a thumb on the way to something
  # else — turns back into a multi-day gap, which is the exact failure this system already
  # had once. So it re-states itself until somebody clears the latch.
  #
  # Suppressed during maintenance: the latch is expected to be set while working on the unit,
  # and an alarm that fires predictably during normal work is one that gets muted permanently.
  - id: hydro_fault_latch_reminder
    alias: Hydro — Re-alarm while the fault latch stays set
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/6"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "on"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # PROOF OF LIFE — record every float that actually moves.
  # ---------------------------------------------------------------------------
  # A TRANSITION IS THE ONLY THING THAT PROVES A FLOAT. Steady `off` is what a working dry
  # float and a severed wire both report. Going off -> on -> off proves the reed moved, the
  # KC868 read it, and the value arrived here — the whole path, in one event.
  #
  # `from` is constrained to on/off as well as `to`, which is the part that matters: after
  # every HA restart the floats go unavailable -> off, and counting that as a transition would
  # stamp all six as freshly proven on every single deploy. The check would then be incapable
  # of ever reporting stale, which is worse than not having it.
  - id: hydro_float_prove_on_transition
    alias: Hydro — Stamp a float as proven when it actually moves
    mode: queued
    max: 12
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hydroponics_inputs_hydro_float_low_guard
          - binary_sensor.hydroponics_inputs_hydro_float_low_second
          - binary_sensor.hydroponics_inputs_hydro_float_6_inch
          - binary_sensor.hydroponics_inputs_hydro_float_7_5_inch
          - binary_sensor.hydroponics_inputs_hydro_float_9_inch
          - binary_sensor.hydroponics_inputs_hydro_float_11_inch
        from: ["on", "off"]
        to: ["on", "off"]
    actions:
      - variables:
          suffix: >-
            {{ trigger.entity_id
               | replace('binary_sensor.hydroponics_inputs_hydro_float_', '')
               | replace('depth_', '') }}
      - action: input_text.set_value
        target:
          entity_id: "{{ 'input_text.hydro_float_proven_' ~ suffix }}"
        data:
          # isoformat() carries the UTC offset, so as_timestamp reads it back unambiguously
          # rather than guessing a zone. Local wall-clock strings silently shift by an hour
          # across a DST boundary, which on a 35-day window is invisible and wrong.
          value: "{{ now().isoformat(timespec='seconds') }}"
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # FLOAT TEST — arm, bound, confirm, expire.
  # ---------------------------------------------------------------------------
  # REFUSES TO ARM UNLESS THE SYSTEM IS IDLE. Suppressing the disagreement latch while water
  # is actually moving would remove the guard at the one moment it is load-bearing. Idle means
  # phase `empty` and both pumps off; anything else and the switch goes straight back off with
  # a reason, rather than appearing to arm and quietly doing nothing.
  - id: hydro_float_test_arm
    alias: Hydro — Arm the float test window
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_float_test
        from: "off"
        to: "on"
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('input_select.hydro_phase', 'empty')
                 or is_state('switch.z_wave_plus_power_strip_3', 'on')
                 or is_state('switch.z_wave_plus_power_strip_4', 'on') }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.hydro_float_test }
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ ('Float test REFUSED — system not idle (phase ' ~
                    states('input_select.hydro_phase') ~ ')') | truncate(118, true, '') }}
          - stop: "Float test refused: a cycle is in progress."
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_float_test_expires }
        data:
          datetime: >-
            {{ (now() + timedelta(minutes=
                 states('input_number.hydro_float_test_minutes') | int(20)))
               .strftime('%Y-%m-%d %H:%M:%S') }}
      - action: system_log.write
        data:
          level: warning
          message: >-
            HYDRO: float test ARMED for
            {{ states('input_number.hydro_float_test_minutes') | int(20) }} min. Disagreement
            latch suppressed; pump cutoff still active. Lift each unproven float until it
            reports wet, then let it fall back.

  # SELF-CLEARING, AND OFF ON EVERY START. Checked once a minute rather than scheduled at the
  # expiry instant so that a restart mid-window cannot leave it armed with no timer pending.
  - id: hydro_float_test_expire
    alias: Hydro — Expire the float test window
    mode: single
    triggers:
      - trigger: time_pattern
        id: tick
        minutes: "/1"
      - trigger: homeassistant
        id: immediate
        event: start
      # A flood starting for any reason ends the test immediately — the suppression is only
      # ever safe while nothing is moving.
      - trigger: state
        id: immediate
        entity_id: input_select.hydro_phase
        to: ["filling", "full", "draining"]
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_float_test
        state: "on"
      # trigger.id, not trigger.platform: the id is set here in this file and cannot drift
      # with a HA trigger-syntax change, and a condition that silently stops matching would
      # leave the window armed forever — failing open, which is the direction that matters.
      - condition: template
        value_template: >-
          {{ trigger.id == 'immediate'
             or as_timestamp(now())
                > as_timestamp(states('input_datetime.hydro_float_test_expires'), 0) }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_float_test }
      - action: system_log.write
        data:
          level: warning
          message: "HYDRO: float test window closed; disagreement latch active again."

  # CONFIRM EACH FLOAT FROM THE PHONE. The test happens at the rack with wet hands, not in
  # front of a dashboard, so the useful signal is a push that names the float the moment it
  # reports. Without it the only way to know a lift registered is to go and look, which is
  # how "I think I tested it" becomes the record.
  - id: hydro_float_test_confirm
    alias: Hydro — Confirm a float reported during the test
    mode: queued
    max: 12
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hydroponics_inputs_hydro_float_low_guard
          - binary_sensor.hydroponics_inputs_hydro_float_low_second
          - binary_sensor.hydroponics_inputs_hydro_float_6_inch
          - binary_sensor.hydroponics_inputs_hydro_float_7_5_inch
          - binary_sensor.hydroponics_inputs_hydro_float_9_inch
          - binary_sensor.hydroponics_inputs_hydro_float_11_inch
        from: ["on", "off"]
        to: ["on", "off"]
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_float_test
        state: "on"
    actions:
      - action: rest_command.hydro_alerts
        data:
          message: >-
            {{ trigger.entity_id
               | replace('binary_sensor.hydroponics_inputs_hydro_float_', '')
               | replace('depth_', '') }} reported
            {{ 'WET' if trigger.to_state.state == 'on' else 'dry' }} — proof stamped.
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # THE MONTHLY TOGGLE TEST, AND THE REASON IT IS NOT JUST A CALENDAR REMINDER.
  # ---------------------------------------------------------------------------
  # A bare recurring reminder to "test the floats" decays into having tested them once. What
  # makes this real is that the test is SELF-VERIFYING: lift the float by hand and the
  # transition automation above stamps it, with no button to press and nothing to record. If
  # the signal path is broken the stamp does not move and the reminder keeps coming — which is
  # the correct outcome, because a float that cannot report is exactly the thing being hunted.
  #
  # WEEKLY, NOT DAILY. The floats below the target re-prove themselves every cycle and will
  # never appear here; what does appear is the two or three above the waterline, which need a
  # human and a spare minute. A daily push for a job that takes a month to become due is how
  # an alert channel gets muted, and this shares the urgent hydro channel's audience.
  - id: hydro_float_proof_reminder
    alias: Hydro — Remind that a float has not proven itself
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: time
        weekday: [mon]
      - condition: state
        entity_id: binary_sensor.hydro_float_proof_stale
        state: "on"
      # Not while someone is already working on the unit — they are the person who would be
      # doing the test, and telling them to do the thing they are doing is noise.
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true
      - action: system_log.write
        data:
          level: warning
          message: >-
            HYDRO: unproven float(s)
            {{ state_attr('binary_sensor.hydro_float_proof_stale','unproven') | join(', ') }}
            — no observed transition inside
            {{ states('input_number.hydro_float_proof_max_days') }} days. Lift each by hand
            until it reports wet, then let it fall back.

  # ---------------------------------------------------------------------------
  # STARTUP RECOVERY — INTENT-AWARE as of 2026-08-16.
  # ---------------------------------------------------------------------------
  # This used to do one thing on every restart: drain to a known-empty state. That was the
  # only defensible move in the timer era, because after a reboot the water level was simply
  # unknowable — the system had no way to ask. Emptying was not a preference, it was the
  # absence of a measurement.
  #
  # The float array removed that constraint. The level is now a fact we can read, so throwing
  # away a half-finished flood and starting over is wasted water, wasted pump life and a crop
  # that sat unwatered for the duration. Owner direction: if a fill was interrupted at 6" and
  # the target is 9", finish the fill.
  #
  # WHAT IT DOES NOW, in order of precedence:
  #
  #   A. HARD LIMIT WET      overflow. Drain and latch, never resume. An interrupted fill that
  #                          came back above the wall is the one case where intent does not
  #                          matter.
  #   B. FLOATS UNREADABLE   no measurement, so the old behaviour is still the right one:
  #                          empty it on a calibrated timer. This is why that path is kept
  #                          rather than deleted.
  #   C. filling / full      resume the cycle. The script is already state-aware, so a wet
  #                          target skips the fill and `full` resumes at hold-then-drain,
  #                          while `filling` tops up first. Reusing it beats duplicating the
  #                          depth logic in a second place that can drift from the first.
  #   D. draining / fault    finish draining. Deliberately NOT the script, which would refill:
  #                          during a drain the target float is dry, and "dry target" reads to
  #                          the script as "needs a fill".
  #
  # RESUMES ONLY WITH THE LATCH CLEAR. A fault latched before the reboot means a human has not
  # looked yet, and resuming a flood past it would make the latch advisory. Latched -> case D.
  #
  # THE PUMPS ARE STOPPED TWICE, ON PURPOSE. `switch.turn_off` against an `unavailable` entity
  # is a SILENT no-op — it does not raise, it does not retry, it just does not happen. On the
  # 2026-07-28 restart Z-Wave initialised 15s before this ran, so the first call landed; that
  # was timing, not a guarantee. The first call is for the common case, the wait is for the
  # slow one, and the second call is the one that is actually known to have been heard.
  # ---------------------------------------------------------------------------
  - id: hydro_startup_recovery
    alias: Hydro — Startup Recovery
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # Stop first, ask questions after. A pump can hold its ON state straight through a
      # reboot: the switch is a Z-Wave device, not something HA was remembering.
      - action: switch.turn_off
        target:
          entity_id:
            - switch.z_wave_plus_power_strip_3
            - switch.z_wave_plus_power_strip_4
      - wait_template: >-
          {{ states('switch.z_wave_plus_power_strip_3') not in ['unavailable','unknown']
             and states('switch.z_wave_plus_power_strip_4') not in ['unavailable','unknown'] }}
        timeout: { seconds: 120 }
        continue_on_timeout: true
      # The one that counts — the switches can now hear it.
      - action: switch.turn_off
        target:
          entity_id:
            - switch.z_wave_plus_power_strip_3
            - switch.z_wave_plus_power_strip_4
      # Give ESPHome time to reconnect before deciding the floats are unreadable. Falling to
      # the blind path because the sensors had not finished booting would empty a crop's
      # flood for no reason at all.
      - wait_template: "{{ is_state('binary_sensor.hydro_floats_healthy','on') }}"
        timeout: { seconds: 90 }
        continue_on_timeout: true
      - variables:
          orig_phase: "{{ states('input_select.hydro_phase') }}"
          orig_status: "{{ states('input_text.hydro_status') }}"
          floats_ok: "{{ is_state('binary_sensor.hydro_floats_healthy','on') }}"
          rec_drain: >-
            {% set fs = states('input_number.hydro_fill_seconds') | float(260) %}
            {% set ds = states('input_number.hydro_drain_seconds') | float(285) %}
            {% set ratio = (ds / fs) if fs > 0 else 1.1 %}
            {% set dt = states('sensor.hydro_drain_time') | float(238) %}
            {% set started = states('input_datetime.hydro_fill_started') %}
            {% if states('input_select.hydro_phase') == 'filling'
                  and started not in ['unknown','unavailable',''] %}
              {% set ran = [ (as_timestamp(now()) - as_timestamp(started)), fs ] | min %}
              {{ [ (ran * ratio + 10) | round(0, 'ceil'), dt ] | min | int }}
            {% else %}
              {{ dt | int }}
            {% endif %}
      - choose:
          # --- A. OVERFLOW. Intent does not survive contact with the hard limit. ---
          - conditions:
              - condition: template
                value_template: >-
                  {{ floats_ok and
                     is_state('binary_sensor.hydroponics_inputs_hydro_float_11_inch','on') }}
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.hydro_fault_latch }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "RECOVERY — hard limit wet at startup; draining, auto-flood halted" }
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: draining }
              - action: switch.turn_on
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - wait_template: >-
                  {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','off') }}
                timeout:
                  seconds: >-
                    {{ [ (states('input_number.hydro_drain_max_seconds') | float(330)) - 30, 60 ] | max | int }}
                continue_on_timeout: true
              - action: switch.turn_off
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: empty }
              - action: rest_command.hydro_alerts
                data: {}
                continue_on_error: true

          # --- B. NO MEASUREMENT. The old behaviour, kept for exactly this case. ---
          - conditions:
              - condition: template
                value_template: >-
                  {{ not floats_ok and orig_phase in ['filling','full','draining','fault'] }}
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: "RECOVERY — floats unreadable, draining {{ rec_drain }}s (was {{ orig_phase }})"
              - action: rest_command.hydro_alerts
                data: {}
                continue_on_error: true
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: draining }
              - action: switch.turn_on
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - delay: { seconds: "{{ rec_drain | int }}" }
              - action: switch.turn_off
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: empty }
              - variables:
                  final_status: >-
                    {% if is_state('input_boolean.hydro_fault_latch','on') %}
                    Recovered — empty & safe; prior: {{ orig_status }}
                    {% else %}
                    Recovered — empty & safe
                    {% endif %}
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "{{ final_status | trim | truncate(118, true, '') }}" }

          # --- C. RESUME. A fill interrupted at 6" with a 9" target finishes at 9". ---
          - conditions:
              - condition: template
                value_template: >-
                  {{ floats_ok and orig_phase in ['filling','full']
                     and is_state('input_boolean.hydro_fault_latch','off') }}
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "RECOVERY — resuming the cycle from {{ orig_phase }}" }
              # The cycle script owns every depth decision. Recovery decides WHETHER to
              # resume; it does not re-implement WHAT resuming means.
              - action: script.hydro_flood_drain_cycle
                data:
                  scheduled: true   # automatic path — use the stage schema, not the manual dropdown

          # --- D. FINISH DRAINING. Never the script here: it would refill. ---
          - conditions:
              - condition: template
                value_template: >-
                  {{ floats_ok and (orig_phase in ['draining','fault']
                     or (orig_phase in ['filling','full']
                         and is_state('input_boolean.hydro_fault_latch','on'))) }}
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "RECOVERY — draining to the low float (was {{ orig_phase }})" }
              - if:
                  - condition: state
                    entity_id: binary_sensor.hydroponics_inputs_hydro_float_low_guard
                    state: "off"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.hydro_status }
                    data: { value: "RECOVERY — already empty, no drain needed" }
                else:
                  - action: input_select.select_option
                    target: { entity_id: input_select.hydro_phase }
                    data: { option: draining }
                  - action: switch.turn_on
                    target: { entity_id: switch.z_wave_plus_power_strip_4 }
                  - wait_template: >-
                      {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','off') }}
                    timeout:
                      seconds: >-
                        {{ [ (states('input_number.hydro_drain_max_seconds') | float(330)) - 30, 60 ] | max | int }}
                    continue_on_timeout: true
                  - action: switch.turn_off
                    target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: empty }
              - variables:
                  final_status: >-
                    {% if is_state('input_boolean.hydro_fault_latch','on') %}
                    Recovered — empty & safe; prior: {{ orig_status }}
                    {% else %}
                    Recovered — empty & safe
                    {% endif %}
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "{{ final_status | trim | truncate(118, true, '') }}" }

  # ---------------------------------------------------------------------------
  # TRACKER BRIDGE — the hydroponics tracker (a separate self-hosted tracker) posts here
  # whenever a maturity / harvest / discard event is logged, so the tracker button on the
  # dashboard starts the lights + flooding and the LAST harvest stops them.
  #
  # THE TRACKER SENDS A FACT, NOT A COMMAND: `buckets_occupied` is computed from the
  # WHOLE grow log, not from the event just logged. Under succession the next wave is
  # already in the buckets when the previous one is harvested, so a naive
  # "harvest -> off" would cut lights and pumps on a full set of live plants. The
  # tracker reports occupancy; every actuation decision stays here, behind the same
  # phase machine and failsafes as the manual switch.
  #
  # Nothing new can actuate: this only writes input_boolean.hydro_occupied, which
  # is exactly what ticking the switch by hand does. The fill-overflow, drain-runaway
  # and both-pumps interlocks are unchanged and still gate every pump action.
  #
  # local_only: true — the tracker reaches HA on the LAN (dev-services -> :8123
  # directly, bypassing Authelia, which would 303 a webhook to the login page).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # AMBIENT TEMP -> TRACKER SUBTITLE. Report-only: this touches no pump, no light and
  # no input_boolean, so it cannot affect a grow. See rest_command.hydro_push_climate
  # in configuration.yaml for why the data is PUSHED rather than pulled.
  #
  # The time_pattern trigger is not redundant with the state trigger. The tracker marks
  # a reading stale after 60 min, and a Z-Wave temp sensor that is simply sitting still
  # emits nothing — so on state changes alone a steady room would drift into looking
  # stale precisely when it is most stable. The heartbeat re-asserts the same value.
  # ---------------------------------------------------------------------------
  - id: hydro_push_climate_to_tracker
    alias: Hydro — Push server-room climate to the tracker
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.grow_room_air_temperature
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      # Never push unknown/unavailable. The tracker rejects a non-numeric temp anyway
      # (400, previous reading preserved), but failing here keeps that from showing up
      # as a recurring error in the HA log every time the sensor blips.
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.grow_room_air_temperature')) }}
    actions:
      - action: rest_command.hydro_push_climate

  - id: hydro_tracker_bridge
    alias: Hydro — Tracker bridge (grow log drives occupancy flag)
    mode: queued
    max: 5
    triggers:
      - trigger: webhook
        webhook_id: !secret hydro_tracker_webhook_id
        allowed_methods: [POST]
        local_only: true
    actions:
      - choose:
          # --- something is in the buckets -> make sure we are growing --------------
          - conditions: "{{ trigger.json.buckets_occupied | default(false) | bool }}"
            sequence:
              # Set the crop FIRST so the light window and flood cadence are already
              # right when the occupancy handler fires. Skipped when the tracker could
              # not map the crop to one of our options (it sends null rather than guess).
              - if:
                  - condition: template
                    value_template: >
                      {{ trigger.json.ha_crop is defined and trigger.json.ha_crop
                         and trigger.json.ha_crop in
                         state_attr('input_select.hydro_crop','options') }}
                then:
                  - action: input_select.select_option
                    target: { entity_id: input_select.hydro_crop }
                    data: { option: "{{ trigger.json.ha_crop }}" }
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.hydro_occupied }
          # --- buckets empty -> stop -------------------------------------------------
          - conditions: "{{ not (trigger.json.buckets_occupied | default(false) | bool) }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.hydro_occupied }
      # Breadcrumb so the dashboard shows where the change came from.
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >
            {% set n = trigger.json.batches_in_buckets | default(0) | int %}
            {{ 'Growing — %d batch%s in buckets (from grow log)'
               | format(n, '' if n == 1 else 'es')
               if n > 0 else 'Buckets empty (from grow log)' }}

  # ---------------------------------------------------------------------------
  # OCCUPANCY RECONCILE — closes the edge-triggered gap described at `rest:` above.
  # Every 5 min, make hydro_occupied agree with the grow log. This is not a new
  # capability: the webhook could already start and stop growing unattended. It makes
  # that existing behaviour RELIABLE instead of fire-and-forget.
  #
  # THREE GUARDS, all load-bearing:
  #  1. Only the literals `occupied`/`empty` are actionable. unavailable/unknown (tracker
  #     down, DNS dead, body garbled) mean "we do not know" -> hold current state, change
  #     nothing. A tracker outage must never read as "buckets empty".
  #  2. Never turns occupancy ON while hydro_fault_latch is set. A latched fault is a hard
  #     stop that this loop respects — necessary because hydro_occupancy_handler CLEARS the
  #     latch on an off->on edge, so without this guard reconcile would silently undo a
  #     failsafe trip.
  #  3. The OFF direction is always allowed (it is the physically safe direction).
  #
  # ⚠️ CONSEQUENCE: with this running, `hydro_occupied` is DERIVED state, not a manual
  # switch — flip it off by hand and it comes back within 5 min. To stop a grow, either
  # log the harvest on the tracker (the authority) or set hydro_fault_latch. To stop THIS
  # loop, disable this automation in the HA UI.
  # ---------------------------------------------------------------------------
  - id: hydro_occupancy_reconcile
    alias: Hydro — Reconcile occupancy from grow log
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.hydro_tracker_occupancy
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.hydro_tracker_occupancy') in ['occupied', 'empty'] }}
    actions:
      - choose:
          # --- log says occupied, HA says off -> heal ON (unless a fault is latched) ---
          #
          # THE AGE GUARD IS LOAD-BEARING AND IT COST A CROP ON 2026-10-07. Without it this
          # branch DEFEATS the day-10 flood delay, which is the single most important timing
          # rule in the file.
          #
          # The two flags do not mean the same thing. The tracker's `buckets_occupied` means
          # "a batch is physically in the buckets" and is TRUE the moment seeds are sown into
          # cubes. HA's `hydro_occupied` means "roots are down, start flooding and run full
          # photoperiod". Sowing satisfies the first and must NOT satisfy the second.
          #
          # What actually happened: script.hydro_log_planting correctly set occupancy off,
          # stage germination, sow date stamped -- then logged the sowing to the grow log. Within
          # one 300 s poll this branch read "occupied" and healed hydro_occupied back ON. That
          # off->on edge fires hydro_stage_mature, which forced the stage to `mature` on day 0,
          # so the day-3 emergence step could never run (it requires stage == germination) and
          # the flood depth dropped to the shallowest setting. The circulation fans, gated on
          # `hydro_occupied`, ran from day 0 and dried the rockwool. 10 of 12 seeds germinated
          # and then died -- cubes opened to ~1/4" of radicle and no shoot.
          #
          # The log line below said "investigate what reset it", blaming HA for drift this
          # branch had just caused. It had been doing that since auto-occupy was added.
          #
          # So: only heal ON once the batch is actually old enough to flood. Before that, HA's
          # `off` is CORRECT and the grow log is simply answering a different question. Reads
          # the existing hydro_flood_start_day knob rather than inventing a second clock -- the
          # same value auto-occupy uses, so the two cannot disagree. A batch with no usable sow
          # date does NOT heal on: unknown age is not evidence that flooding is due.
          - conditions:
              - condition: state
                entity_id: sensor.hydro_tracker_occupancy
                state: occupied
              - condition: state
                entity_id: input_boolean.hydro_occupied
                state: "off"
              - condition: state
                entity_id: input_boolean.hydro_fault_latch
                state: "off"
              - condition: template
                value_template: >
                  {% set sown = state_attr('sensor.hydro_tracker_occupancy','sown_date')
                                or states('input_datetime.hydro_sow_date') %}
                  {% set dtf = states('input_number.hydro_flood_start_day') | float(14) %}
                  {% if sown in [none,'unknown','unavailable',''] %}
                    false
                  {% else %}
                    {{ (as_timestamp(now()) - as_timestamp(sown)) >= dtf * 86400 }}
                  {% endif %}
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.hydro_occupied }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "Reconciled ON — grow log says buckets occupied" }
              - action: system_log.write
                data:
                  level: warning
                  message: >-
                    HYDRO: reconciled occupancy off->ON from grow log. HA had drifted out of
                    sync with the tracker; investigate what reset it.
          # --- log says empty, HA says on -> heal OFF (always allowed) ----------------
          - conditions:
              - condition: state
                entity_id: sensor.hydro_tracker_occupancy
                state: empty
              - condition: state
                entity_id: input_boolean.hydro_occupied
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.hydro_occupied }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "Reconciled OFF — grow log says buckets empty" }
              - action: system_log.write
                data:
                  level: warning
                  message: >-
                    HYDRO: reconciled occupancy on->OFF from grow log. HA had drifted out of
                    sync with the tracker; investigate what reset it.

  # ---------------------------------------------------------------------------
  # OCCUPANCY — the one control. On -> start growing (immediate flood
  # + lights follow the profile). Off -> stop everything, pumps + lights off.
  # ---------------------------------------------------------------------------
  - id: hydro_occupancy_handler
    alias: Hydro — Occupancy (start / stop growing)
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_occupied
    actions:
      - choose:
          - conditions: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              # DELIBERATELY DOES NOT CLEAR hydro_fault_latch.
              #
              # It used to. That meant logging a transplant or a sow on the grow log silently
              # cleared a latched hardware fault and re-armed both pumps -- the person entering
              # a crop was thinking about lettuce, not about the dead pump from three weeks ago,
              # and nothing told them what they had just done. A latch an unrelated action can
              # clear is not a latch.
              #
              # It matters more now than it did: hydro_deadlock_recovery latches a fault when it
              # cannot drain to empty, which means "water the pump cannot move". Clearing that by
              # starting a new grow would put pumps back under a condition nobody diagnosed.
              #
              # Clearing is now an explicit human act (toggle the Hydro Fault helper). If a fault
              # is latched when a crop starts, say so loudly rather than tidying it away.
              - if:
                  - condition: state
                    entity_id: input_boolean.hydro_fault_latch
                    state: "on"
                then:
                  - action: system_log.write
                    data:
                      level: warning
                      message: >-
                        HYDRO: a crop was started while a fault is LATCHED. Flooding stays
                        blocked until someone clears it deliberately —
                        {{ states('input_text.hydro_status') }}
                  - action: rest_command.hydro_alerts
                    data: {}
                    continue_on_error: true
              # stamp the stage-start date -> starts the growth-stage flood-depth clock
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.hydro_stage_started }
                data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "Growing — {{ states('input_select.hydro_crop') }}" }
              # only kick an immediate flood if we're at a known-empty, fault-free state
              - if:
                  - condition: template
                    value_template: "{{ is_state('input_select.hydro_phase','empty') and is_state('input_boolean.hydro_fault_latch','off') }}"
                then:
                  - action: script.hydro_flood_drain_cycle
                    data:
                      scheduled: true   # automatic path — stage schema, not the manual dropdown
          - conditions: "{{ trigger.to_state.state == 'off' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.z_wave_plus_power_strip_1   # both SF600s on one splitter (2026-10-02)
                    - switch.z_wave_plus_power_strip_3
                    - switch.z_wave_plus_power_strip_4
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data: { value: "Idle — no plants" }

  # ---------------------------------------------------------------------------
  # FLOOD SCHEDULER — while occupied, no fault, phase empty, inside the light
  # window, and enough time since the last flood (interval = window / floods/day).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # RECONCILE LIFECYCLE STATE FROM THE TRACKER
  # ---------------------------------------------------------------------------
  # The tracker owns what a human logged — crop, sow date, when the batch entered the buckets,
  # and therefore the growth stage. HA owns machine state: phase, fault latch, maintenance,
  # pumps. One writer per field, which is what makes conflict resolution unnecessary instead
  # of merely hard.
  #
  # WHY PULL AND NOT ONLY PUSH. The tracker already pushes on log events, and push alone means
  # a dropped webhook becomes permanent drift. Occupancy has had both since it was built; these
  # four fields had neither, which is why a stage set by hand on 2026-08-16 stayed set.
  #
  # EACH FIELD IS INDEPENDENT. A null from the tracker means "no opinion" (an adopted batch
  # with no sowing behind it genuinely has no sow date) and must never be written as a value —
  # substituting today would reset a mature crop's clock, which is the failure the tracker's
  # own _days_since guard is written to avoid.
  #
  # SUPPRESSED BY OVERRIDE OR MAINTENANCE, and it says so out loud in the status text rather
  # than silently doing nothing — "the reconciler is not running" should never have to be
  # inferred from the absence of an effect.
  - id: hydro_reconcile_lifecycle_from_tracker
    alias: Hydro — Reconcile lifecycle state from grow log
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.hydro_tracker_occupancy
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      # A failed fetch leaves this unknown/unavailable. Neither is a fact to reconcile against.
      - condition: template
        value_template: "{{ states('sensor.hydro_tracker_occupancy') in ['occupied','empty'] }}"
      - condition: state
        entity_id: input_boolean.hydro_manual_override
        state: "off"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      - variables:
          t_stage: "{{ state_attr('sensor.hydro_tracker_occupancy','derived_stage') }}"
          t_crop: "{{ state_attr('sensor.hydro_tracker_occupancy','ha_crop') }}"
          t_started: "{{ state_attr('sensor.hydro_tracker_occupancy','stage_started_date') }}"
          t_sown: "{{ state_attr('sensor.hydro_tracker_occupancy','sown_date') }}"
      - if:
          - condition: template
            value_template: >-
              {{ t_crop not in [none,'None',''] and t_crop != states('input_select.hydro_crop')
                 and t_crop in state_attr('input_select.hydro_crop','options') }}
        then:
          - action: input_select.select_option
            target: { entity_id: input_select.hydro_crop }
            data: { option: "{{ t_crop }}" }
      - if:
          - condition: template
            value_template: >-
              {{ t_stage not in [none,'None',''] and t_stage != states('input_select.hydro_growth_stage')
                 and t_stage in state_attr('input_select.hydro_growth_stage','options') }}
        then:
          - action: input_select.select_option
            target: { entity_id: input_select.hydro_growth_stage }
            data: { option: "{{ t_stage }}" }
          - action: system_log.write
            data:
              level: warning
              message: >-
                HYDRO RECONCILE: growth stage {{ states('input_select.hydro_growth_stage') }}
                -> {{ t_stage }} from the grow log.
      - if:
          - condition: template
            value_template: >-
              {{ t_started not in [none,'None','']
                 and t_started[:10] != states('input_datetime.hydro_stage_started')[:10] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.hydro_stage_started }
            data: { datetime: "{{ t_started[:10] }} 12:00:00" }
      - if:
          - condition: template
            value_template: >-
              {{ t_sown not in [none,'None','']
                 and t_sown[:10] != states('input_datetime.hydro_sow_date')[:10] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.hydro_sow_date }
            data: { datetime: "{{ t_sown[:10] }} 12:00:00" }

  # ---------------------------------------------------------------------------
  # OVERRIDE EXPIRY — reconciliation resumes on its own.
  # ---------------------------------------------------------------------------
  # Turning the override ON stamps an expiry; passing that expiry turns it back off. A manual
  # override that outlives the job it was for is indistinguishable from the drift bug it is
  # allowed to cause, so it is not allowed to be permanent.
  - id: hydro_override_stamp_expiry
    alias: Hydro — Stamp override expiry
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_manual_override
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_override_expires }
        data:
          datetime: >-
            {{ (now() + timedelta(hours=(states('input_number.hydro_override_hours') | float(4))))
               .strftime('%Y-%m-%d %H:%M:%S') }}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('Manual override until '
                ~ states('input_datetime.hydro_override_expires')[:16]
                ~ ' — tracker reconcile paused') | truncate(118, true, '') }}

  - id: hydro_override_auto_expire
    alias: Hydro — Expire manual override
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_manual_override
        state: "on"
      - condition: template
        value_template: >-
          {% set e = states('input_datetime.hydro_override_expires') %}
          {{ e not in ['unknown','unavailable',''] and as_timestamp(now()) >= as_timestamp(e) }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_manual_override }
      - action: system_log.write
        data:
          level: warning
          message: "HYDRO: manual override expired — reconciling from the grow log again."
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # DRIFT ALARM — fires even while a correction is suppressed.
  # ---------------------------------------------------------------------------
  # 15 minutes because reconciliation runs every 5: a single missed pass is not news, three
  # consecutive ones mean something is actually holding the two apart.
  - id: hydro_state_drift_alarm
    alias: Hydro — State drift alarm
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_state_drift
        to: "on"
        for: { minutes: 15 }
    actions:
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO DRIFT: HA disagrees with the grow log for >15min —
            {{ state_attr('binary_sensor.hydro_state_drift','differences') }}
            (suppressed by: {{ state_attr('binary_sensor.hydro_state_drift','suppressed_by') }})
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # HAND-WATER REMINDER — the one job the system cannot do for itself.
  # ---------------------------------------------------------------------------
  # Between sowing and the first flood the plumbing is deliberately idle, because flooding a
  # fresh rockwool cube is what killed batch 1. The cubes still need water in that window; it
  # just has to come from a pipette. Nothing surfaced that, and an automation system that goes
  # quiet is indistinguishable from one that has it covered.
  #
  # DELIBERATELY NOT GATED BY THE FAULT LATCH OR MAINTENANCE. Every other hydro automation
  # stops when those are set — correctly, because they all move water. This one asks a HUMAN to
  # move water, and the seedlings need it most on exactly the days something else has gone
  # wrong. Suppressing it there would silence the reminder precisely when it matters.
  - id: hydro_hand_water_reminder
    alias: Hydro — Hand-water reminder (pre-flood window)
    mode: single
    triggers:
      # Morning, and again mid-afternoon: a rockwool cube in a lit room dries out faster than
      # a once-a-day nudge accounts for.
      - trigger: time
        at: "08:00:00"
      - trigger: time
        at: "15:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.hydro_hand_water_due
        state: "on"
    actions:
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # HANDOVER — say when the machine takes over, once.
  # ---------------------------------------------------------------------------
  # The reminder stopping is not a message. Without this, the last hand-water nudge and the
  # first automatic flood are separated only by silence, and "did it start?" becomes something
  # to go and check.
  - id: hydro_flood_handover
    alias: Hydro — Announce flooding takeover
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_hand_water_due
        from: "on"
        to: "off"
    conditions:
      # Only when the window ENDED because the plant aged into flooding — not because the crop
      # was harvested, which also turns this off.
      - condition: state
        entity_id: input_boolean.hydro_occupied
        state: "on"
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('Flooding takes over today — hand-watering done (day '
                ~ states('sensor.hydro_plant_age') ~ ')') | truncate(118, true, '') }}
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # CLEARING THE FAULT HAS TO ACTUALLY CLEAR IT.
  #
  # The dashboard calls input_boolean.hydro_fault_latch "Fault — auto-flood halted (toggle off to
  # clear)". It was not true. NOTHING in this package triggered on that boolean going off, and the
  # scheduler below requires BOTH fault_latch off AND hydro_phase == empty. The latch trip sets
  # phase to `fault` and nothing ever set it back, so toggling the switch cleared the half you can
  # see and left the half you cannot -- auto-flooding stayed blocked with every dashboard
  # indicator reading normal.
  #
  # Found 2026-10-23 while diagnosing why the crop sown 2026-10-07 never flooded. Had the owner
  # simply toggled the fault off as the label instructs, flooding would have stayed dead and the
  # next thing to look at would have been a scheduler that appeared to have no reason to refuse.
  #
  # IT REFUSES TO LIE ABOUT AN EMPTY BUCKET. `empty` means no water, and the scheduler trusts it
  # to decide a cycle may start. After an aborted fill there IS water -- the 2026-10-21 trip cut
  # the pumps 30s into a fill and left it sitting. So this returns phase to `empty` only when the
  # floats agree the buckets are dry, and otherwise says what to do instead. Declaring `empty`
  # over standing water would start the next fill from an unknown level, which is how an overflow
  # gets made.
  - id: hydro_fault_cleared_restores_phase
    alias: Hydro — Clearing the fault returns the phase to empty
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_fault_latch
        from: "on"
        to: "off"
    conditions:
      # Only ever rewrite the phase the TRIP set. If a cycle is genuinely mid-flight, leave it be.
      - condition: state
        entity_id: input_select.hydro_phase
        state: fault
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.hydro_all_floats_dry
                state: "on"
            sequence:
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_phase }
                data: { option: empty }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: >-
                    {{ 'Fault cleared — phase returned to empty, scheduler re-armed'
                       | truncate(118, true, '') }}
        default:
          # FAILS LOUD RATHER THAN GUESSING. Water is in the buckets, so `empty` would be false;
          # drain first and the phase can be set then. Saying nothing here is what produced the
          # original bug in the first place.
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ 'Fault cleared but buckets are NOT dry — drain, then set phase to empty'
                   | truncate(118, true, '') }}

  # ---------------------------------------------------------------------------
  # A SHORT FILL RECOVERS ITSELF. DO NOT MAKE A HUMAN DO THIS.
  #
  # Owner, 2026-10-23: "if something failed, either fill to the proper depth or drain and do a
  # full fill cycle properly. i want you, HA, or the hydro tracker to handle all of this so i
  # don't have to."
  #
  # Before this, a fill that ran its budget without reaching the target float latched a fault and
  # STOPPED. The crop then waited for a human -- which on 2026-10-21 meant two days of hand
  # watering while the dashboard looked normal. A partial fill is not a watering: the 2026-10-23
  # 09:30 cycle reached 7" of a 9" target, and the owner reasonably read "it stopped" as "it
  # decided", because nothing distinguished the two.
  #
  # WHAT IT DOES: drain to a known-empty state, then run the cycle again from empty. Starting from
  # empty matters -- fill durations are computed for a fill from empty, so retrying on top of
  # standing water is how an overfill gets made.
  #
  # IT DEGRADES TO A DEPTH IT CAN ACTUALLY REACH. On the LAST retry the target drops to 7.5"
  # (float_depth_mid), which is PROVEN -- stamped 2026-09-30 -- whereas day0 (9") has never once
  # been proven and became load-bearing only on 2026-10-07. Watering the crop slightly shallow
  # beats not watering it at all, and the notification says which happened. If day0 is in fact
  # dead, this is the difference between a watered crop and a dead one.
  #
  # BOUNDED, because a short fill and a dead target float look identical from here. After
  # hydro_fill_retry_max attempts it latches and shouts, which is the old behaviour -- just no
  # longer the FIRST thing that happens.
  - id: hydro_short_fill_auto_recover
    alias: Hydro — A short fill drains and retries itself
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_text.hydro_status
        to: "FAULT — fill timed out before reaching target depth"
    conditions:
      - condition: template
        value_template: >-
          {{ (states('counter.hydro_fill_retries_today') | int(0))
             < (states('input_number.hydro_fill_retry_max') | int(2)) }}
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
      # A float that cannot be READ is an availability problem; retrying blind is not recovery.
      - condition: state
        entity_id: binary_sensor.hydro_floats_healthy
        state: "on"
    actions:
      - action: counter.increment
        target: { entity_id: counter.hydro_fill_retries_today }

      # ── TOP UP TOWARD THE TARGET. DO NOT THROW AWAY THE WATER ALREADY LIFTED. ───────────
      #
      # Corrected 2026-10-23, same day it shipped. The first version drained to empty and refilled,
      # justified as "retrying on top of standing water is how an overfill gets made". THAT
      # JUSTIFICATION WAS WRONG and contradicted the behaviour verified minutes earlier: the fill
      # waits on `target_float wet OR hard_limit wet`, so it is FLOAT-terminated, not
      # duration-terminated. It therefore stops at the target from ANY starting level -- which is
      # the same reason a manual flood on half-full buckets correctly stops at 9" total instead of
      # adding 9" more. Owner caught it from the MR title alone.
      #
      # AND DRAINING MADE THE RETRY WORSE, not just wasteful. The failure being recovered from is
      # "could not reach the target within the budget". Refilling FROM EMPTY has to re-lift every
      # inch already there, so it faces the identical budget against a longer climb and fails the
      # same way. Resuming from 7" is the attempt with an actual chance.
      #
      # So: fill again, bounded by the same two sensors, and only fall back to draining if the
      # buckets are at an UNKNOWN level -- floats contradicting each other, which is the one state
      # where "how much is in there" has no answer and starting from a known floor is the only
      # safe move.
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.hydro_floats_disagree
                state: "on"
            sequence:
              # Unknown level: drain to a known floor first.
              - action: switch.turn_off
                target: { entity_id: switch.z_wave_plus_power_strip_3 }
              - action: switch.turn_on
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
              - wait_template: "{{ is_state('binary_sensor.hydro_all_floats_dry','on') }}"
                timeout: "{{ (states('input_number.hydro_drain_max_seconds') | int(330)) + 30 }}"
                continue_on_timeout: true
              - action: switch.turn_off
                target: { entity_id: switch.z_wave_plus_power_strip_4 }
        default:
          # Level is known and below target: leave the water where it is and let the cycle resume.
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ 'Short fill — topping up toward target, water retained' | truncate(118, true, '') }}
      # NO all_floats_dry GATE HERE ANY MORE. It belonged to the drain-first design and would now
      # block the very case this recovers: 7" of water present is exactly when we want to proceed.
      # The hard limit remains the ceiling, enforced inside the fill's own wait.

      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: empty }

      # LAST ATTEMPT GOES FOR A PROVEN DEPTH.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ (states('counter.hydro_fill_retries_today') | int(0))
                     >= (states('input_number.hydro_fill_retry_max') | int(2)) }}
            sequence:
              - action: input_select.select_option
                target: { entity_id: input_select.hydro_manual_flood_depth }
                data: { option: "7.5 in" }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: >-
                    {{ 'Short fill — final retry at 7.5in (proven float)' | truncate(118, true, '') }}
        default:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ 'Short fill — drained, retrying a full cycle' | truncate(118, true, '') }}

      - action: script.turn_on
        target: { entity_id: script.hydro_flood_drain_cycle }

  # ── A PROVEN-GOOD CYCLE CLEARS THE FAULTS IT DISPROVES, AND ONLY THOSE ────────────────────
  #
  # Owner, 2026-10-24: "when we run a manual cycle and it does what we want we need to clear the
  # fault depending on what set the fault latch to begin with".
  #
  # Triggers on the completion of a cycle that actually delivered water: the counter's own
  # evidence, hydro_fill_reached_target, set only on the fill's success branch. A drain alone is
  # not evidence -- the watchdog drains too, which is how a failed day came to read as three
  # completed cycles.
  #
  # ── WHAT IT WILL AND WILL NOT CLEAR, WHICH IS THE WHOLE DESIGN ────────────────────────────
  #
  # CLEARS fill-timeout and watchdog-stall. Both are claims about the WATERING PATH -- pump,
  # plumbing, reservoir, time budget -- and a cycle that just reached depth and drained is a
  # direct refutation.
  #
  # NEVER CLEARS hard-limit or float-disagree. Both are claims about a SENSOR, and a good cycle
  # does not prove a sensor is honest. The 2026-10-21 disagreement was a drain-pump cord holding a
  # bobber wet: flooding successfully afterwards would not have unsnagged the cord, and
  # auto-clearing would have thrown away the only signal that something physical was wrong. An
  # unknown or empty reason is treated the same way -- if we cannot say what broke, we cannot say
  # it is fixed.
  #
  # ── THE REASON MUST BE CONSUMED EVEN WHEN THE LATCH IS ALREADY OFF ───────────────────────
  # This used to require `hydro_fault_latch == on` as an ENTRY condition, which meant the
  # reason was only ever consumed on the path that also cleared the latch. When a human cleared
  # the latch by hand -- the documented break-glass, and what happened on 2026-11-04 -- the
  # reason was left behind forever. Measured live on 2026-11-05, after two clean cycles:
  #
  #     input_text.hydro_fault_reason          'fill-timeout'
  #     input_boolean.hydro_fault_latch        'off'
  #
  # That stale string is not cosmetic, because THIS AUTOMATION READS IT. The sequence it opens:
  #
  #   1. reason is left at 'fill-timeout' with no fault outstanding;
  #   2. the owner later sets the latch by hand -- the break-glass path, which writes no reason;
  #   3. the next proven cycle finds latch on, reached_target on, and a reason that is in the
  #      auto-clearable list, and TURNS OFF THE LATCH THE HUMAN JUST SET.
  #
  # The old comment here claimed "it also only acts while the latch is ON, so it cannot fight a
  # human who has just set it." That has it backwards: the latch being on is precisely the
  # human's signal, so acting only while it is on is exactly when this CAN fight them. The real
  # protection was always the reason check -- and a stale reason defeats it. It also violates
  # the standing rule that the human sets and clears the latch and the logic only resolves what
  # it can prove.
  #
  # So the entry condition is now just "a proven cycle finished", and what happens next splits:
  #
  #   latch ON  + an auto-clearable reason  -> clear the latch, say so, consume the reason
  #   latch OFF                             -> consume the reason; with nothing outstanding to
  #                                            explain, any reason present can only be stale
  #   latch ON  + any other reason          -> touch NOTHING. hard-limit and float-disagree are
  #                                            claims about a SENSOR, which a good cycle does
  #                                            not disprove, and the reason is the only text
  #                                            explaining why the rig is latched. Clearing it
  #                                            would leave a latched rig with no diagnosis.
  - id: hydro_fault_auto_clear_on_proven_cycle
    alias: Hydro — A proven cycle clears the faults it disproves
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.hydro_phase
        from: draining
        to: empty
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_fill_reached_target
        state: "on"
    actions:
      - choose:
          # DISPROVED: the latch is on for something a completed cycle actually refutes.
          - conditions:
              - condition: state
                entity_id: input_boolean.hydro_fault_latch
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hydro_fault_reason') in ['fill-timeout', 'watchdog-stall'] }}
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.hydro_fault_latch }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: "{{ ('Fault cleared automatically — a cycle reached depth and drained, which disproves ' ~ states('input_text.hydro_fault_reason')) | truncate(118, true, '') }}"
              # Consumed, so a later drain cannot re-read it and clear a fault it has no
              # evidence about.
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_fault_reason }
                data: { value: "" }
          # NOTHING OUTSTANDING: a reason with the latch off describes a fault that is already
          # over, however it ended. Consuming it is what stops it being read as evidence about
          # some future fault it has nothing to do with.
          - conditions:
              - condition: state
                entity_id: input_boolean.hydro_fault_latch
                state: "off"
              - condition: template
                value_template: "{{ states('input_text.hydro_fault_reason') | trim != '' }}"
            sequence:
              # CAPTURED BEFORE IT IS CLEARED. Written the other way round first, and the log
              # line would have read "consumed a stale fault reason ''" -- a message about a
              # value it had just destroyed, which is worse than no message because it looks
              # like the reason was already empty.
              - variables:
                  stale_reason: "{{ states('input_text.hydro_fault_reason') }}"
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_fault_reason }
                data: { value: "" }
              - action: system_log.write
                data:
                  level: info
                  message: >-
                    HYDRO: consumed a stale fault reason '{{ stale_reason }}' after a proven
                    cycle with the latch already off -- most likely a human cleared the latch
                    by hand. Leaving it would let it be mistaken for evidence about a later
                    fault.
        # No default: a latch held for a sensor claim keeps both the latch and its reason.

  - id: hydro_flood_scheduler
    alias: Hydro — Flood Scheduler
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_occupied
        state: "on"
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "off"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
      - condition: state
        entity_id: input_select.hydro_phase
        state: empty
      # ROOTS MUST HAVE REACHED THE WATER. Occupancy is true from the moment a seed is sown
      # now, so this is the only thing standing between a fresh rockwool cube and a flood.
      # Batch 1 was lost to exactly that — cubes kept saturated, seedlings collapsed by ~d15.
      #
      # A negative age means "no crop"; the sensor reports -1 rather than 0 so that "unknown"
      # can never be mistaken for "sown today".
      - condition: template
        value_template: >-
          {% set age = states('sensor.hydro_plant_age') | int(-1) %}
          {{ age >= 0 and age >= (states('input_number.hydro_flood_start_day') | int(14)) }}
      # MEASURE THE BUCKET, DO NOT ASK THE VARIABLE.
      #
      # `phase == empty` above is what this package BELIEVES; the low-guard float is what the
      # bucket actually contains. They agree on a clean cycle and disagree in exactly the
      # cases that matter — a failsafe forcing the drain pump off part-way, a restart landing
      # mid-drain, a pump run by hand at the reservoir. In every one of those the phase ends
      # up `empty` with water still standing, and starting a fill from there overshoots by
      # whatever was left. The only thing between that overshoot and water on the floor is the
      # hard-limit float, which is a wall, not a working cutoff.
      #
      # The hard limit is checked here too. If it is somehow already wet, a fill must not
      # begin at all — the fill script would stop immediately on it, but it would have
      # energised the pump to learn that.
      #
      # FAILS CLOSED — REVERSED 2026-09-29 BY OWNER DECISION. This previously fell back to
      # `phase` alone when the floats were unreadable, on the reasoning that "a blind system
      # that waters on its timer is a tolerable degradation; a crop that dies of thirst
      # because a sensor dropped off wifi is not."
      #
      # The owner's answer to that trade: hold the flood and SAY SO, every time. Thirst was
      # only the better risk while the alternative was silence — a held flood that announces
      # itself is not a crop dying unnoticed, it is a crop waiting for a five-minute fix. The
      # blind fill it replaces over-floods to 10.0" against a 13" overflow line (260s at the
      # 26 s/in 6-bucket calibration) and rests entirely on that constant still being true.
      #
      # THE `off` CLAUSE BELOW STAYS, AND ITS MEANING IS NOW THE OPPOSITE. It no longer admits
      # the unreadable case so it can be watered blind — it admits it so the automation can
      # REACH `actions:` and announce a hold. A condition can only silently decline; the whole
      # point of this change is that not-flooding must be audible. The refusal itself now lives
      # in `actions:` below and, for the other three callers, in the flood script's own guard.
      #
      # AND IT MUST HAVE BEEN DRY LONG ENOUGH TO MEAN IT. The low float clears 10-15s before
      # draining actually finishes (measured 2026-08-16), so "the float is dry" briefly
      # overlaps with "water is still leaving". Filling inside that window means the fill pump
      # is working against an active gravity drain. The scheduler's 5-minute tick makes it
      # unlikely to land there, but unlikely is not prevented, and this costs nothing: in the
      # resting state the float has been dry for hours and the check passes immediately.
      #
      # ALL SIX FLOATS, not the bottom one. This used to name the low guard and the hard limit
      # and ignore the four floats in between, so a low guard stuck dry on a full bucket read
      # as "empty, go ahead and fill". Asking every float costs nothing here - in the resting
      # state they have all been dry for hours - and it is the whole reason the ladder exists.
      - condition: template
        value_template: >
          {% set low = states.binary_sensor.hydroponics_inputs_hydro_float_low_guard %}
          {% set settled = states('input_number.hydro_drain_settle_seconds') | float(20) %}
          {{ is_state('binary_sensor.hydro_floats_healthy','off')
             or (is_state('binary_sensor.hydro_all_floats_dry','on')
                 and (now() - low.last_changed).total_seconds() >= settled) }}
      # ── PACE IT. Every other condition here is about SAFETY; none was about TIME. ────────────
      # Without this the scheduler re-floods the moment a drain finishes, which on 2026-11-04
      # produced 20 floods against a target of 6 and had the pumps running ~8 minutes in every
      # 15. The faults had been hiding it by acting as an accidental brake.
      #
      # AN UNUSABLE TIMESTAMP MEANS DUE, NOT BLOCKED. hydro_last_flood read 2026-11-02 after 20
      # cycles today -- it is stamped at the HOLD step but did not survive something, so treating
      # a missing or unparseable value as "not due" would suspend watering on a bookkeeping bug.
      # The failure direction has to be toward watering the crop.
      #
      # ── IT PACES ON THE ATTEMPT, NOT ONLY ON THE SUCCESS, AND THAT IS THE WHOLE POINT ───────
      # The first version of this gate read hydro_last_flood alone. That timestamp is written at
      # the HOLD step -- i.e. only by a fill that REACHED TARGET -- so a rig whose fills were
      # failing never stamped it, the gap was computed against a two-day-old value, and this
      # condition was true on every single evaluation. Measured 2026-11-04: with the gate
      # "working" exactly as written, the rig ran TWENTY-FIVE cycles against a target of six,
      # one every fifteen minutes from 17:45 to 19:39, pumping into buckets that were already
      # full. The owner found them full and drained them by hand, twice.
      #
      # So the cadence limit was conditional on the thing being limited succeeding. A guard that
      # only engages when nothing is wrong is not a guard, and the failure direction was the bad
      # one: the harder the fills failed, the harder the rig retried. That is also how roughly
      # eight gallons ended up on the floor over three days.
      #
      # input_datetime.hydro_t_fill_start is stamped by hydro_phase_timestamps on EVERY
      # transition into `filling`, success or not. Taking the LATER of the two means the interval
      # holds whatever happens downstream of the pump: a fill that reaches target paces from the
      # flood, a fill that fails paces from the attempt, and a rig in trouble slows down instead
      # of speeding up.
      #
      # THE COST, STATED: a genuinely failed cycle now waits the full interval instead of
      # retrying in fifteen minutes. That is deliberate. At eight floods a day one missed flood
      # is not an emergency, whereas re-running a failing fill four times an hour is how the
      # reservoir emptied onto the floor. The in-cycle retry (the top-up loop) is untouched --
      # this only governs how soon a NEW cycle may start.
      - condition: template
        value_template: >-
          {% set flood = state_attr('input_datetime.hydro_last_flood','timestamp') %}
          {% set tried = state_attr('input_datetime.hydro_t_fill_start','timestamp') %}
          {% set stamps = [flood, tried] | reject('none') | list %}
          {% set gap = (states('sensor.hydro_min_flood_gap') | float(140)) * 60 %}
          {{ true if stamps | count == 0
             else ((as_timestamp(now()) - (stamps | max)) >= gap) }}
      # Reaching `actions:` now means "a flood is DUE". Whether one can be PERFORMED is decided
      # there, so that the cannot-perform case can speak instead of silently declining.
      - condition: state
        entity_id: binary_sensor.hydro_in_light_window
        state: "on"
      # HOW LONG SINCE THE LAST FLOOD — ASKED OF THE `timestamp` ATTRIBUTE, NOT OF THE STATE.
      #
      # An input_datetime's STATE is a naive local string: "2026-09-16 16:48:52", no offset on it.
      # as_timestamp() parses that into a naive datetime and calls .timestamp(), which resolves it
      # against the PROCESS time zone — not the one HA is configured for. When those two differ,
      # every stored time reads back skewed by the offset, `now() - last` is wrong by the same
      # amount, and it is wrong in the direction that makes this gate say yes.
      #
      # Not hypothetical. The HA container carried no TZ from the 2026-09-04 host cutover until
      # 2026-09-16, so naive strings resolved as UTC on a Denver instance. This gate compares
      # against 140 minutes; the apparent gap never dropped below 372. It was never once false,
      # and the scheduler ran 35 flood/drain cycles in a day against a target of 6 — mature
      # lettuce flooded about every twelve minutes for eleven days.
      #
      # The container now sets TZ, which is the actual fix. This is the second lock: the
      # `timestamp` attribute is derived by HA from the entity's own date and time in HA's zone,
      # so it is correct no matter what the process believes, and a future host whose clock
      # disagrees cannot quietly hold the watering schedule open again. `none` is the unknown
      # case — the same "nothing recorded, go ahead and flood" the string comparison meant.
      - condition: template
        value_template: >
          {% set p = state_attr('sensor.hydro_active_profile','profile') %}
          {% set on = as_timestamp(today_at(p['on'])) %}
          {% set off = as_timestamp(today_at(p['off'])) %}
          {% set span = (off - on) if off > on else (off + 86400 - on) %}
          {% set interval = span / (p['floods'] | int(6)) %}
          {% set last = state_attr('input_datetime.hydro_last_flood','timestamp') %}
          {{ last is none or (as_timestamp(now()) - last) >= interval }}
    actions:
      # The flood interval, recomputed here because the hold branch needs it to notify ONCE PER
      # MISSED FLOOD rather than once per 5-minute tick. Same arithmetic as the interval
      # condition above; if that changes, change this with it.
      - variables:
          flood_interval: >-
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {% set on = as_timestamp(today_at(p['on'])) %}
            {% set off = as_timestamp(today_at(p['off'])) %}
            {% set span = (off - on) if off > on else (off + 86400 - on) %}
            {{ ((span / (p['floods'] | int(6))) | int) if p is mapping else 7200 }}
      - choose:
          # ── CANNOT MEASURE ⇒ DO NOT POUR ───────────────────────────────────────────────
          # The flood was due and we are declining it. The script would refuse anyway; this
          # branch exists to COUNT and ANNOUNCE, which the script cannot do without spamming
          # once per caller.
          - conditions:
              - condition: state
                entity_id: binary_sensor.hydro_floats_healthy
                state: "off"
            sequence:
              - action: counter.increment
                target: { entity_id: counter.hydro_floods_held_today }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: >-
                    HELD — floats unreadable, flood skipped
                    ({{ states('counter.hydro_floods_held_today') }} today)
              # ONE NOTICE PER MISSED FLOOD, NOT PER TICK. This automation re-evaluates every
              # 5 minutes and nothing here stamps hydro_last_flood — correctly, since no flood
              # happened — so the due-ness condition above stays true for the whole slot and
              # this branch would otherwise fire ~28 times per missed flood.
              #
              # QUIET HOURS 00:00-07:00, the same window hydro_cycle_observer_alarm honours and
              # for the same reason: these rest_commands POST straight to the notification service-home and bypass
              # the notification service-router, so the estate's quiet hours only apply if the automation applies
              # them. A held flood is news, not damage — explicitly NOT worth a 2 a.m. page
              # (owner, 2026-09-29). Mostly moot, since every profile's light window sits
              # inside 06:00-22:00 and a flood is never due at 02:00, but a future 24h profile
              # would make it load-bearing and this costs one condition.
              #
              # NOTHING IS LOST TO THE SUPPRESSION: the counter keeps climbing through the
              # quiet window and the first notice after 07:00 carries the running total. Same
              # idiom the watchdog-recovery tally already uses — one message saying "7" beats
              # seven messages.
              - if:
                  - condition: not
                    conditions:
                      - condition: time
                        after: "00:00:00"
                        before: "07:00:00"
                  # `timestamp` attribute, NOT as_timestamp(state). An input_datetime's state
                  # is a naive local string resolved against the PROCESS timezone; that exact
                  # trap ran 35 cycles in a day against a target of 6 (see the flood-interval
                  # condition above).
                  - condition: template
                    value_template: >-
                      {% set last = state_attr('input_datetime.hydro_last_held_notice','timestamp') %}
                      {{ last is none or (as_timestamp(now()) - last) >= (flood_interval | float(7200)) }}
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.hydro_last_held_notice }
                    data: { timestamp: "{{ as_timestamp(now()) | int }}" }
                  - action: rest_command.hydro_alerts
                    data: {}
                    continue_on_error: true
        # Floats readable and the bucket confirmed empty and settled — flood normally.
        default:
          - action: script.hydro_flood_drain_cycle
            data:
              scheduled: true   # automatic path — stage schema, not the manual dropdown

  # ---------------------------------------------------------------------------
  # GROW LIGHTS — follow the profile window whenever there are live plants. Reconcile
  # every 5 min + immediately on occupancy/crop/stage change (dynamic times, so no
  # static trigger).
  # "Live plants" = buckets occupied OR a batch still in germination/seedling, which is
  # sown straight into the bucket and so has no occupancy event of its own to flip.
  # ---------------------------------------------------------------------------
  - id: hydro_lights_reconcile
    alias: Hydro — Grow Lights
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_boolean.hydro_occupied
          - input_select.hydro_crop
          - input_select.hydro_growth_stage
          - binary_sensor.hydro_in_light_window
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state('input_boolean.hydro_occupied','on')
                     or states('input_select.hydro_growth_stage') in ['germination','seedling'] }}
              - condition: state
                entity_id: binary_sensor.hydro_in_light_window
                state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.z_wave_plus_power_strip_1   # both SF600s share one splitter on port 1
        default:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.z_wave_plus_power_strip_1   # port 2 freed — both lights on port 1

  # ---------------------------------------------------------------------------
  # CIRCULATION FANS (ZEN20 port 5) — same reconcile shape as the grow lights.
  #
  # NOT ON FROM DAY 0, deliberately. Germination wants still, humid air: a fan over freshly
  # sown cubes dries the surface and a rockwool cube that dries once mid-germination does not
  # reliably recover. The risk fans EXIST to manage -- damping-off, and stagnant wet air over
  # the canopy -- only starts once there is a seedling to rot. So the fans come on at the
  # germination -> seedling step, which is a boundary the package already computes
  # (hydro_stage_emergence, day 3), rather than inventing a second clock to disagree with it.
  #
  # Tied to the LIGHT WINDOW rather than run 24/7: lights-off is the cool, low-transpiration
  # part of the cycle, the canopy is not producing much moisture, and the room is next to a
  # bedroom. If mould ever shows up in the dark hours this is the line to revisit.
  #
  # Reconcile, not edge-triggered, for the same reason the lights are: a missed state change
  # or an HA restart self-corrects within 5 minutes instead of leaving the fans stuck.
  # That is also why startup recovery is NOT modified to force fans off -- it is
  # safety-critical code handling a flood risk, fans are not one, and this loop already
  # converges on its own.
  # ---------------------------------------------------------------------------
  - id: hydro_fans_reconcile
    alias: Hydro — Circulation Fans
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_boolean.hydro_occupied
          - input_boolean.hydro_fans_enabled
          - input_select.hydro_growth_stage
          - binary_sensor.hydro_in_light_window
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hydro_fans_enabled
                state: "on"
              - condition: template
                # GERMINATION IS EXCLUDED EXPLICITLY. This cost a crop on 2026-10-07: 10 of 12
                # seeds failed to sprout because the fans ran from the moment of sowing.
                #
                # The comment above has always said fans must not run from day 0, but the
                # condition did not enforce it. `hydro_occupied` was meant to carry the MATURE
                # case -- except occupancy is derived from the grow log, and sowing puts seeds
                # IN THE BUCKETS, so the tracker reports occupied on day 0 and the occupancy
                # reconcile actively heals the flag back ON. The stage was `germination` the
                # whole time and nothing consulted it.
                #
                # CORRECTED 2026-10-11 -- the three lines that used to sit here described a gate
                # this automation does not have. They claimed "the stage test is now the gate:
                # fans run at `seedling` and `mature` only" and that the `hydro_occupied` term
                # was kept as an AND. Read the conditions below: there is NO growth-stage
                # condition and NO occupied condition. The gate is the days-since-sow template,
                # and that is the whole of it.
                #
                # Both entities still appear in `triggers:` -- which is correct and is probably
                # what the old comment was looking at. A trigger re-runs the reconcile; it does
                # not vote on the outcome. That distinction is what made the stale claim
                # plausible, and it is also what made the DASHBOARD label wrong in the same way
                # ("on from seedling"), which is how this was finally caught.
                value_template: >
                  {# ── FANS RUN ONLY ONCE THE CROP IS WELL ESTABLISHED ──────────────
                     Owner's call 2026-10-07, and it is grounded in this rig's own history:
                     the FIRST planting had no fans at all and grew fine; the SECOND had fans
                     from day 0 and 10 of 12 seeds germinated and then died of desiccation
                     . Against a demonstrated crop loss, the benefit these provide --
                     damping-off and stagnant canopy air -- is marginal and SLOW to bite.
                     Erring very late costs almost nothing; erring early costs the crop.

                     AGE IS COMPUTED FROM THE SOW DATE, NOT FROM sensor.hydro_plant_age. That
                     sensor returns -1 whenever hydro_occupied is off, and since (internal tracker)/(internal MR)
                     occupancy deliberately stays OFF until flooding is due -- so it reads -1
                     across exactly the window this gate has to measure. Using it would have
                     compared -1 against the threshold and kept the fans off forever, which
                     happens to be safe and would have hidden the bug for a long time.

                     NO SOW DATE => NO FANS. Unknown age is not evidence the crop is mature.
                     A dedicated knob rather than reusing hydro_flood_start_day: these are
                     genuinely different decisions with different risks, so they get one clock
                     each. The bug fixed in (internal MR) was two knobs for the SAME concept, which is
                     a different thing. #}
                  {% set sd = states('input_datetime.hydro_sow_date') %}
                  {% set fsd = states('input_number.hydro_fan_start_day') | float(21) %}
                  {% if sd in ['unknown','unavailable',''] %}
                    false
                  {% else %}
                    {{ (as_timestamp(now()) - as_timestamp(sd)) >= fsd * 86400 }}
                  {% endif %}
              - condition: state
                entity_id: binary_sensor.hydro_in_light_window
                state: "on"
            sequence:
              - action: switch.turn_on
                target: { entity_id: switch.z_wave_plus_power_strip_5 }
        default:
          - action: switch.turn_off
            target: { entity_id: switch.z_wave_plus_power_strip_5 }

  # ---------------------------------------------------------------------------
  # AUTO-OCCUPY — the step that used to be a human ticking "Buckets Occupied".
  #
  # Flipping hydro_occupied is what starts flooding, moves the lights to full photoperiod
  # (via hydro_stage_mature) and brings the fans up outside the seedling window. Until now
  # that was manual, so the whole crop schedule waited on someone remembering. This closes
  # the loop: sow, and the system arms itself N days later.
  #
  # Guarded four ways, because this one action starts pumping water:
  #   - only from `seedling`, never straight out of germination, so a mis-set stage cannot
  #     start a flood on day 0
  #   - honours hydro_stage_manual_hold, same as the light steps
  #   - refuses while a fault is latched or maintenance is on -- if the system is already
  #     unhappy, do not add water to it
  #   - refuses if phase is not `empty`, matching the flood scheduler's own precondition
  # ---------------------------------------------------------------------------
  - id: hydro_auto_occupy
    alias: Hydro — Arm Flooding After Maturity Delay
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_occupied
        state: "off"
      - condition: state
        entity_id: input_select.hydro_growth_stage
        state: seedling
      - condition: state
        entity_id: input_boolean.hydro_stage_manual_hold
        state: "off"
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "off"
      - condition: state
        entity_id: input_select.hydro_phase
        state: empty
      - condition: template
        value_template: >
          {% set s = states('input_datetime.hydro_sow_date') %}
          {% set d = states('input_number.hydro_flood_start_day') | float(14) %}
          {{ s not in ['unknown','unavailable','']
             and (as_timestamp(now()) - as_timestamp(s)) >= d * 86400 }}
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_occupied }
      - action: system_log.write
        data:
          level: info
          message: >-
            HYDRO: auto-occupy fired — {{ states('input_number.hydro_flood_start_day') }} days
            since sow ({{ states('input_datetime.hydro_sow_date') }}). Flooding, full
            photoperiod and fans are now armed.
      - action: script.hydro_notify_health
        data: {}

  # ---------------------------------------------------------------------------
  # DIRECT-SOW LIGHT STAGING — advances hydro_growth_stage across the three
  # photoperiods. Only ever moves the LIGHTS; touches no pump, no depth, no
  # failsafe. A batch that is already mature never leaves `mature` and so never
  # executes any of this.
  # ---------------------------------------------------------------------------
  - id: hydro_sow_stamp
    alias: Hydro — Stamp Sow Date
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.hydro_growth_stage
        to: germination
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_sow_date }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: "Germination — short photoperiod in the room's coolest hours, pumps off"

  # Emergence step, day 3 after sow. Deliberately CALENDAR-driven, not observed:
  # being a day early costs nothing (a seed that hasn't emerged doesn't use the extra
  # photons) while being late causes etiolation, which is irreversible. Err early.
  # Also honours hydro_stage_manual_hold — see hydro_stage_mature for why the hold exists.
  - id: hydro_stage_emergence
    alias: Hydro — Growth Stage Germination to Seedling
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_stage_manual_hold
        state: "off"
      - condition: state
        entity_id: input_select.hydro_growth_stage
        state: germination
      - condition: template
        value_template: >
          {% set s = states('input_datetime.hydro_sow_date') %}
          {{ s not in ['unknown','unavailable','']
             and (as_timestamp(now()) - as_timestamp(s)) >= 3 * 86400 }}
    actions:
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_growth_stage }
        data: { option: seedling }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Seedling — photoperiod up to 10h (DLI ~9); watch for roots at cube bottom" }
      - action: system_log.write
        data:
          level: info
          message: "HYDRO: light stage germination -> seedling (day 3 after sow)."

  # Mature. Fires on EITHER edge of Buckets Occupied, and that is deliberate:
  #   on  -> roots are down / flooding starts => full photoperiod.
  #   off -> buckets are empty => stage must return to `mature`, otherwise a
  #          stage left at seedling would keep the lights running over an empty system.
  - id: hydro_stage_mature
    alias: Hydro — Growth Stage to Mature
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.hydro_occupied
        to: "on"
      - trigger: state
        entity_id: input_boolean.hydro_occupied
        to: "off"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.hydro_growth_stage
            state: mature
      # IGNORE RESTART CHURN. On restart every entity goes unavailable -> restored, and that
      # counts as a state change, so this fired on EVERY Home Assistant restart and forced the
      # crop back to `mature` -- the SHALLOWEST flood. Observed directly 2026-08-22: the stage
      # was set to `seedling`, HA restarted, and it was `mature` again 75 seconds later.
      #
      # That is almost certainly why the current crop sat at `mature` for its whole life. The
      # design is "deepest early, shallower as roots grow down to meet the water", so forcing
      # the shallowest depth on a seedling is the exact inversion of it: young roots in a cube
      # seated above a ~6" flood may never have reached the water at all.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown','unavailable']
             and trigger.to_state.state not in ['unknown','unavailable'] }}
      # A human pinned the depth deliberately; do not quietly undo it.
      - condition: state
        entity_id: input_boolean.hydro_stage_manual_hold
        state: "off"
    actions:
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_growth_stage }
        data: { option: mature }
      - action: system_log.write
        data:
          level: info
          message: "HYDRO: growth stage -> mature (Buckets Occupied changed state)."

  # ---------------------------------------------------------------------------
  # PHASE WATCHDOG — recovers a cycle that STALLED rather than overran.
  #
  # THE GAP THIS CLOSES. The three failsafes below all key on a pump being ON TOO LONG.
  # They are blind to the opposite failure: a pump command that was never delivered. The
  # cycle is a linear delay: script, so if the Z-Wave strip is unreachable at the instant
  # `switch.turn_on` fires, the call is a no-op, the script keeps counting down, and the
  # phase advances over a physical state that never changed. The dangerous shape is a lost
  # DRAIN: phase sits at `full`, the buckets stay flooded, no pump is on, so nothing trips
  # — and roots sit submerged with no air until a human happens to look.
  # hydro_startup_recovery only covers an HA RESTART; a Z-Wave dropout is not one.
  #
  # Level-triggered on purpose: it asks "has this phase lasted longer than it physically
  # can?", which catches a lost command, a killed script and a stalled cycle alike, without
  # needing to know which happened.
  #
  # STRIP UNREACHABLE => SURFACE, DO NOT THRASH. Firing pump commands into a device that is
  # not answering cannot help and muddies the state; it waits and says so instead.
  # ---------------------------------------------------------------------------
  - id: hydro_phase_watchdog
    alias: Hydro — Phase Watchdog (stuck-cycle recovery)
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/2"
    conditions:
      - condition: template
        # NOT a stall when a human parked it. hydro_fill_only sets hydro_fill_parked and leaves
        # the water on purpose; without this the watchdog drains the calibration run it was
        # supposed to be measuring (2026-10-24, 511s against a 420s budget).
        value_template: >-
          {{ states('input_select.hydro_phase') in ['filling','full','draining']
             and not is_state('input_boolean.hydro_fill_parked', 'on') }}
    actions:
      - variables:
          phase: "{{ states('input_select.hydro_phase') }}"
          age: >-
            {{ (as_timestamp(now())
                - as_timestamp(states.input_select.hydro_phase.last_changed)) | int(0) }}
          # ── THE WATCHDOG MUST NEVER FIRE BEFORE THE PHASE'S OWN TIMEOUT ──────────────────
          # Fixed 2026-11-02. The budget was the EXPECTED duration plus the margin, with no
          # reference to the cap the phase actually runs under. On the morning of 2026-11-02 the
          # fill cap went 330 -> 600s and the drain cap 330 -> 900s (measured: fills were taking
          # 332s against a 330s cap), and the margin was left at 120. So:
          #
          #     fill cap          600s   what the fill script waits for
          #     watchdog budget   406s   fill_time 286 + margin 120
          #
          # -- a 194s window in which the watchdog drains a fill that is still inside its own
          # budget, and LATCHES A FAULT for it. Measured live the same day: "phase 'filling'
          # stuck 419s (budget 406s)", twice, which exhausted the 2/day autoclear allowance and
          # halted auto-flooding.
          #
          # THIS FILE ALREADY DOCUMENTED THE SAME BUG and I reintroduced it from the other side.
          # See hydro_fill_parked: "on 2026-10-24 it drained the owner's fill-only run after 511s
          # against a 420s budget and latched a fault. So the calibration tool could not be used
          # at all. The watchdog cannot tell INTENT from FAILURE."
          #
          # So take the LATER of the two: a phase is stuck only once it has outrun both what we
          # expect AND what we permit. The watchdog stays useful -- it still catches a phase that
          # never terminates, just not one that is merely slower than the estimate.
          #
          # test-hydro-watchdog-outlasts-phase-caps.py fails if any budget can land below its
          # phase's cap, so raising a cap without raising this cannot ship again.
          budget: >-
            {% set m = states('input_number.hydro_phase_stuck_margin') | float(120) %}
            {% set p = states('input_select.hydro_phase') %}
            {% if p == 'filling' %}
              {{ ([ states('sensor.hydro_fill_time') | float(208),
                    states('input_number.hydro_fill_max_seconds') | float(600) ] | max + m) | int }}
            {% elif p == 'full' %}{{ (states('sensor.hydro_flood_hold') | float(300) + m) | int }}
            {% else %}
              {{ ([ states('sensor.hydro_drain_time') | float(238),
                    states('input_number.hydro_drain_max_seconds') | float(900) ] | max + m) | int }}
            {% endif %}
          unreachable: >-
            {{ states('switch.z_wave_plus_power_strip_3') in ['unavailable','unknown']
               or states('switch.z_wave_plus_power_strip_4') in ['unavailable','unknown'] }}
      - condition: template
        value_template: "{{ age | int > budget | int }}"
      - choose:
          # --- strip is not answering: report, wait, change nothing -----------------
          - conditions: "{{ unreachable }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: "STALLED — Z-Wave strip unreachable, phase {{ phase }} for {{ (age | int / 60) | round(0) }}m"
              - action: system_log.write
                data:
                  level: error
                  message: >-
                    HYDRO WATCHDOG: phase '{{ phase }}' stuck {{ age }}s (budget {{ budget }}s) and the
                    Z-Wave strip is unreachable. Cannot actuate; holding. If phase is 'full' the buckets
                    are STILL FLOODED.
              - action: rest_command.hydro_alerts
                data: {}
                continue_on_error: true
        # --- strip is answering, so the cycle genuinely stalled: drain to known-empty --
        default:
          - action: switch.turn_off
            target: { entity_id: switch.z_wave_plus_power_strip_3 }
          - variables:
              # Same proportional rule hydro_startup_recovery uses: a stall during `filling`
              # only put in as much water as the fill actually ran, so draining the full
              # calibrated time would run the drain pump dry for minutes.
              wd_drain: >-
                {% set fs = states('input_number.hydro_fill_seconds') | float(260) %}
                {% set ds = states('input_number.hydro_drain_seconds') | float(285) %}
                {% set ratio = (ds / fs) if fs > 0 else 1.1 %}
                {% set dmax = states('input_number.hydro_drain_max_seconds') | float(330) %}
                {% set dt = states('sensor.hydro_drain_time') | float(238) %}
                {% set started = states('input_datetime.hydro_fill_started') %}
                {% if phase == 'filling' and started not in ['unknown','unavailable',''] %}
                  {% set ran = [ (as_timestamp(now()) - as_timestamp(started)), fs ] | min %}
                  {{ [ (ran * ratio + 10) | round(0, 'ceil'), dmax ] | min | int }}
                {% else %}
                  {{ dt | int }}
                {% endif %}
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: "WATCHDOG — {{ phase }} stalled {{ (age | int / 60) | round(0) }}m, draining {{ wd_drain }}s"
          - action: system_log.write
            data:
              level: error
              message: >-
                HYDRO WATCHDOG: phase '{{ phase }}' stuck {{ age }}s (budget {{ budget }}s) with the strip
                reachable — a pump command was almost certainly lost. Draining {{ wd_drain }}s to a known
                -empty state and latching a fault.
          - action: input_select.select_option
            target: { entity_id: input_select.hydro_phase }
            data: { option: draining }
          - action: switch.turn_on
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
          # DRAIN TO THE FLOAT WHEN THERE IS ONE. This was the last timed drain left in the
          # package that ran with the floats readable, and it had the same defect the recovery
          # drain was fixed for in (internal MR): it pumps for a COMPUTED duration while the dry-running
          # failsafe watches the same pump against a MEASUREMENT. On a bucket that empties
          # early the guard force-stops the pump and latches partway through, while this
          # branch keeps counting down to a number that stopped meaning anything.
          #
          # wd_drain survives as the bound and as the blind path, because the watchdog fires
          # precisely when something has already gone wrong — the floats being unreadable is
          # one of the ways that happens, and it must still reach a safe state without them.
          - if:
              - condition: state
                entity_id: binary_sensor.hydro_floats_healthy
                state: "on"
            then:
              - wait_template: >-
                  {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','off') }}
                timeout: { seconds: "{{ wd_drain | int }}" }
                continue_on_timeout: true
            else:
              - delay: { seconds: "{{ wd_drain | int }}" }
          - action: switch.turn_off
            target: { entity_id: switch.z_wave_plus_power_strip_4 }
          - action: input_select.select_option
            target: { entity_id: input_select.hydro_phase }
            data: { option: empty }
          # Latch AFTER recovering. A stalled cycle means a command was lost, which is
          # exactly when auto-flooding should stop until someone has looked at why.
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.hydro_fault_latch }
          - action: counter.increment
            target: { entity_id: counter.hydro_watchdog_recoveries_today }
          # A RECOVERY THAT REACHED A SAFE STATE IS NEWS. The buckets are empty, both pumps are
          # off, and the latch has already stopped auto-flooding — nothing is on fire, and the
          # urgent tone is reserved for the cases where the system could NOT fix itself (the
          # strip-unreachable branch above keeps it). Eleven urgent pages in 2.5 hours on
          # 2026-09-16 for a fault that self-healed every time is what this change is for; the
          # comment on hydro_alerts in configuration.yaml already says the fault channel
          # "stays urgent precisely because it is rare".
          - action: script.hydro_notify_health

  # ---------------------------------------------------------------------------
  # FAILSAFE — fill overflow guard (INDEPENDENT of the cycle).
  #
  # SENSOR-FIRST as of 2026-08-16. This guard used to be a pure timer, because until the
  # float array was installed there was no way to measure depth and elapsed time was the only
  # available proxy for it. A proxy that tight is a liability once a real measurement exists:
  # it fires on a slow fill that is perfectly safe, and it stays silent on a fast one that is
  # not. The hard-limit float measures the thing we actually care about, so it is the cutoff
  # now and the timers have been demoted to covering the cases where measurement is missing.
  #
  # THREE TRIGGERS, ONE PER FAILURE MODE:
  #   hard_limit    the float is wet. Actual overflow. Fires regardless of float health,
  #                 because a float reading 'on' is evidence even if a SIBLING is unreadable.
  #   blind_timeout the floats cannot be read at all, so time is all that is left. Keeps the
  #                 old tight bound, because with no measurement there is nothing better.
  #   stuck_float   the floats look healthy but the pump has run long enough to have passed
  #                 the hard limit from empty. Availability is not honesty: a float jammed by
  #                 scale reports a healthy 'off' forever, and that is the mode that puts
  #                 water on the floor. This bound is deliberately far out — it should never
  #                 fire during a legitimate fill, and if it does, a float has failed.
  # ---------------------------------------------------------------------------
  # ── HARD INTERLOCK: THE FILL PUMP MAY NEVER RUN WITH THE 11in FLOAT WET ────────────────────
  #
  # Owner 2026-11-04: "there absolutely needs to be logic that says the fill pump can never be on
  # while the 11in sensor shows wet even if it shows wet in error."
  #
  # WHY THIS DID NOT ALREADY EXIST FOR AN 11in FLOOD. hydro_fill_overflow_guard DOES trigger on
  # the 11in float, but its own condition is
  #     tripped > sensor.hydro_target_depth
  # and on an 11in flood that is 11.0 > 11.0 = FALSE. So at the deep-soak depth the rig runs at
  # today, the top float had no automation behind it at all. The only thing stopping the fill was
  # the cycle script's wait_template -- a sequence step, not an interlock. If the script is not
  # running, dies mid-run, or the relay is turned on by hand or by a recovery path, nothing was
  # watching the top float.
  #
  # DELIBERATELY NOT A FAULT. Owner, same message: "the 11in sensor should no longer trigger the
  # fault latch since it's no longer just a failsafe condition. on an 11in flood the 11in sensor
  # should go wet and isn't a problem." So this sets no latch, writes no fault reason and does not
  # touch the phase. It opens the relay and says nothing. On a normal flood it fires right after
  # the script's own turn_off and is a harmless no-op; the script still sequences the cycle.
  #
  # NO `for:` DEBOUNCE AND NO EXTRA CONDITIONS, deliberately -- and this is the one place in the
  # file where that is right. Every other guard debounces because every other guard has to tell a
  # real condition from a sensor artefact. The requirement here is that the pump cannot run with
  # that float wet EVEN IF IT IS WET IN ERROR. A false positive costs an under-filled bucket that
  # the next top-up corrects; a false negative is water on the floor. There is no symmetry to
  # balance.
  - id: hydro_fill_interlock_top_float
    alias: Hydro — Fill pump may never run with the 11in float wet
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_11_inch
        to: "on"
      - trigger: state
        entity_id: switch.z_wave_plus_power_strip_3
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_11_inch
        state: "on"
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_3
        state: "on"
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }

  # ── THE 11in FLOAT'S CROSS-CHECK: 9in WET BOUNDS HOW LONG THE FILL MAY CONTINUE ─────────────
  #
  # Owner 2026-11-04: "if the 11in sensor fails, our backup logic is that if the 9in sensor goes
  # wet we cannot run for more than the time we know it to take for the 11in sensor to also go
  # wet ... if we know it takes 30 seconds to go from 9in wet to 11in wet and the pump runs for
  # 4 minutes, obviously the 11in sensor isn't reporting properly and we've put 3m30s on the
  # floor."
  #
  # Exactly right, and the transit is measured rather than assumed: 147, 149, 151 and 150 s
  # across four consecutive cycles -> hydro_9_to_11_transit_seconds = 165 (149 + the 15 s margin,
  # which is ~4x the 4 s observed spread).
  #
  # THE ONLY FILL GUARD THAT DOES NOT DEPEND ON THE 11in FLOAT, which is the entire point: it
  # fires precisely when that float has failed. 9in trips ~183 s into a fill, so this fires at
  # ~348 s -- under the 360 s relay auto-off and 41 s short of the 389 s overflow. A stuck-dry
  # top float costs about an inch of over-fill instead of a flooded floor.
  #
  # MEASURED FROM THE 9in FLOAT, NOT FROM PUMP START. Measuring from pump start would fire on
  # every normal fill, because the pump has already been on for 333 s when 11in trips. The
  # `pump.last_changed < nine.last_changed` clause -- the pump was ALREADY running when 9in went
  # wet -- is what makes the 9in reference safe, and it also excludes TOP-UPS, where the pump
  # starts with 9in already wet. Those are bounded to 90 s by hydro_fill_topup_max_seconds and
  # covered by the hard interlock above.
  #
  # UNLIKE THE INTERLOCK, THIS LATCHES. A dry-reading top float is a real sensor failure and
  # flooding must not resume on it until someone has looked.
  - id: hydro_fill_top_float_failed
    alias: Hydro — Stop the fill if 11in has not confirmed within the measured transit
    mode: single
    triggers:
      - trigger: template
        id: transit_exceeded
        value_template: >-
          {% set p = states.switch.z_wave_plus_power_strip_3 %}
          {% set nine = states.binary_sensor.hydroponics_inputs_hydro_float_9_inch %}
          {{ is_state('switch.z_wave_plus_power_strip_3', 'on')
             and is_state('binary_sensor.hydroponics_inputs_hydro_float_9_inch', 'on')
             and is_state('binary_sensor.hydroponics_inputs_hydro_float_11_inch', 'off')
             and p.last_changed < nine.last_changed
             and (now() - nine.last_changed).total_seconds()
                 > (states('input_number.hydro_9_to_11_transit_seconds') | float(165)) }}
        for: { seconds: 5 }
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
      - condition: state
        entity_id: input_boolean.hydro_float_test
        state: "off"
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_fault_reason }
        data: { value: "11in-float-no-confirm" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('FAULT — 9in wet but 11in never confirmed within '
                ~ (states('input_number.hydro_9_to_11_transit_seconds') | float(165) | round(0) | int)
                ~ 's — top float suspect') | truncate(118, true, '') }}
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO TOP FLOAT: the 9in float went wet
            {{ (now() - states.binary_sensor.hydroponics_inputs_hydro_float_9_inch.last_changed).total_seconds()
               | round(0) | int }}s ago and the 11in float has still not confirmed, against a
            MEASURED transit of 149s (147/149/151/150 across four cycles). The fill pump has been
            stopped before the buckets could reach the overflow line. Either the 11in float is
            stuck dry or the flow has dropped far below the 29.9 s/inch this rig fills at.
      - action: notify.persistent_notification
        data:
          title: Hydroponics — 11in float did not confirm
          message: >-
            The 9in float went wet and the 11in float never followed within the measured transit
            time, so the fill was stopped before the buckets could reach the overflow line. Check
            the 11in float: on this rig 9in to 11in takes about 149s and has never varied by more
            than 4s.
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  - id: hydro_fill_overflow_guard
    alias: Hydro — Fill Overflow Failsafe
    mode: single
    triggers:
      # ── ONE TRIGGER PER FLOAT ABOVE THE SHALLOWEST TARGET ─────────────────────────────────
      # Was a single trigger on the 11in float. That left a hole the owner named on 2026-11-02:
      # "if 9in is the target depth and 11in goes wet we still use that as a failure metric? ...
      # what happens at 7in target? 9in wet should be an alert condition ... it should be ALERT
      # ON SENSOR+1". With only the 11in float wired, a fill aiming at 7.5in could overshoot to
      # 9in -- an inch and a half past target, water above the net pots -- and NOTHING fired,
      # because the one float that could fault was still 2in further up.
      #
      # The 6in float is deliberately absent: it is the shallowest target, so there is never a
      # target BELOW it for it to be an overshoot of. Its trip is always either the target being
      # reached or water on the way to a deeper one.
      - trigger: state
        id: float_7_5_inch
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_7_5_inch
        to: "on"
      - trigger: state
        id: float_9_inch
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_9_inch
        to: "on"
      - trigger: state
        id: float_11_inch
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_11_inch
        to: "on"
      - trigger: template
        id: blind_timeout
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_3', 'on')
             and is_state('binary_sensor.hydro_floats_healthy', 'off')
             and (now() - states.switch.z_wave_plus_power_strip_3.last_changed).total_seconds()
                 > ((states('sensor.hydro_fill_time') | float(208)) + 45) }}
      - trigger: template
        id: stuck_float
        value_template: >-
          {% set cs = states('input_number.hydro_fill_seconds') | float(260) %}
          {% set cd = states('input_number.hydro_cal_depth_in') | float(10) %}
          {# 11, matching the knob's own `initial:` and the only other fallback in this file
             (line ~1482). It said 13 until 2026-11-02 -- the last survivor of (internal tracker), where
             this file stated three different overflow heights. 13in is impossible: the buckets
             are 12in deep and the top float is tape-measured at 11in. The error was not inert.
             This trigger computes `hl * rate + 90`, so a 13 pushed the STUCK-FLOAT bound ~18%
             further out, and during a deep soak -- where there is no float above the target --
             that bound is the last backstop there is. #}
          {% set hl = states('input_number.hydro_hard_limit_depth_in') | float(11) %}
          {% set rate = (cs / cd) if cd > 0 else 26 %}
          {#- CAPPED AT THE OVERFLOW LINE, 2026-11-04. `hl * rate + 90` is derived from the fill
              calibration, so when hydro_fill_seconds went 260 -> 313 for ACCURACY this bound
              moved 376 s -> 434 s = 14.5in, i.e. 1.5in PAST the 13in overflow. The comment above
              already warns that inflating this bound is not inert, and a rate change inflated it
              by 20% a few hours later -- same defect, opposite input. min() with the overflow
              time means a future re-calibration can tighten this bound but never loosen it past
              the point where the buckets spill. -#}
          {% set ovf = (states('input_number.hydro_overflow_depth_in') | float(13)) * rate %}
          {{ is_state('switch.z_wave_plus_power_strip_3', 'on')
             and (now() - states.switch.z_wave_plus_power_strip_3.last_changed).total_seconds()
                 > ([ hl * rate + 90, ovf - 30 ] | min) }}
    conditions:
      # A float trigger is a state change on the float, which also fires when someone is filling
      # by hand with the pump off, or when a bucket is topped up. Only act when the fill pump is
      # actually running. Time triggers are exempt -- they already test the pump themselves.
      - condition: template
        value_template: >-
          {{ trigger.id in ['blind_timeout', 'stuck_float']
             or is_state('switch.z_wave_plus_power_strip_3', 'on') }}
      # ── THE HARD-LIMIT FLOAT IS A TARGET NOW, NOT ONLY A CEILING ──────────────────────────
      # Added 2026-11-02. The deep-soak regime floods TO the hard-limit float by design (owner:
      # "the first stage of our flooding [should] be to the sensor we're currently calling the
      # hard stop ... for like the first 2 weeks", extended to week 3 and forced on for this
      # crop via hydro_stage_manual_hold). So the float going wet during a scheduled fill is
      # the fill SUCCEEDING, and treating it as overflow did real harm rather than just being
      # noisy: it cut the pump, latched hydro_fault_latch, set phase=fault and HALTED ALL
      # AUTO-FLOODING. Found live -- fault_latch on, phase fault, status "FAULT — hard limit
      # tripped during fill", and latch_autoclears_today at 2 against a cap of 2, so the
      # self-clearing budget was exhausted and the crop was not being watered. The owner's
      # whole reason for this regime is to stop hand-watering.
      #
      # THE TEST IS "WAS THIS DEPTH THE TARGET", not "which float tripped". sensor
      # .hydro_target_depth returns the hard-limit depth exactly when the scheduled fill is
      # aiming at the hard-limit float -- the two are held in lockstep by
      # tests/test-hydro-hold-forces-deep-soak.py, which exists so this comparison stays
      # truthful. So:
      #     target_depth <  hard_limit_depth  -> the fill was aiming LOWER and overshot. FAULT.
      #     target_depth >= hard_limit_depth  -> the fill was aiming here. Expected. No fault.
      #
      # WHAT THIS GIVES UP, STATED PLAINLY: during the deep soak there is no float above the
      # target, so a runaway past 11" has no SENSOR to catch it. That is not new and it is not
      # introduced here -- hydro_target_float's own comment already says "the float ladder has
      # no step above the target ... it is a time bound, not a sensor bound, and that is
      # strictly weaker". The two TIME triggers below (blind_timeout, stuck_float) are
      # untouched and remain the backstop for exactly this case. The alternative -- keep
      # faulting on every successful deep-soak fill -- protects nothing and stops the watering.
      #
      # ── THE MANUAL '11 in' FLOOD IS ONLY COVERED WHILE THE SCHEDULED TARGET IS ALSO 11in ──
      # Being precise, because the first version of this comment claimed the manual path was
      # handled and it is not. The test reads sensor.hydro_target_depth, which is derived from
      # the SCHEDULED regime (sow age, deep-soak window, hydro_stage_manual_hold) and does NOT
      # look at input_select.hydro_manual_flood_depth at all.
      #
      # So: while the hold is on (today) the scheduled target IS the hard-limit depth, and a
      # manual 11in flood is covered by the same comparison. The day the hold comes off and the
      # scheduled target drops to 9in, a manual 11in flood will reach the hard-limit float with
      # target_depth=9 and WILL latch a spurious fault.
      #
      # Not papered over with `manual_flood_depth == '11 in'`: that input_select PERSISTS after a
      # manual run, so a scheduled 9in fill would silently lose its overflow protection for as
      # long as the selector happened to be left on 11in. Trading a real guard for a cosmetic
      # one is the wrong direction, and a fragile match on the status TEXT is not better.
      #
      # What stops a manual 11in fill is its TIMEOUT, not this guard -- that is the bound
      # tests/test-hydro-manual-11-is-bounded.py exists to keep, because at 11in the wait
      # collapses to `hard_limit or hard_limit` and a stuck-dry float would otherwise run the
      # pump unbounded. So the spurious fault would be noise plus a halt, not a safety loss.
      # Tracked rather than fixed here.
      # ── ALERT ON SENSOR+1: ANY FLOAT STRICTLY ABOVE THE TARGET IS AN OVERSHOOT ────────────
      # Generalised 2026-11-02 from a single hard-limit comparison, at the owner's request. The
      # old form asked only "is the target shallower than the HARD LIMIT", which made the 11in
      # float the sole thing able to fault and left every intermediate overshoot unguarded.
      #
      # The test is now the float's OWN depth against the target, so each rung guards the rung
      # below it and the nearest float above the target is the one that fires first -- "9in
      # should really be the measuring stick" for a 7.5in target:
      #
      #     target 6in    -> 7.5in wet faults   (9in and 11in too, if it gets that far)
      #     target 7.5in  -> 9in wet faults
      #     target 9in    -> 11in wet faults
      #     target 11in   -> no float above it. Time bounds only; see below.
      #
      # STRICTLY GREATER, so the target float going wet is never a fault -- that is the fill
      # succeeding, which is the bug this started as. And a shallower float going wet on the way
      # up to a deeper target is not a fault either: filling to 11in necessarily wets 7.5in and
      # 9in first, and 7.5 > 11 is false, so the pass-through falls out of the comparison rather
      # than needing a special case.
      #
      # The depths are written here as literals rather than read from input_numbers because they
      # are a fact about where the floats are BOLTED -- tape-measured, and the only number that
      # was ever wrong came from a config default (13in) rather than the hardware.
      # tests/test-hydro-float-ladder-sensor-plus-one.py renders THIS template over every
      # (target x tripped float) pair and asserts the whole matrix, so the literals cannot drift
      # from the ladder without failing the pipeline.
      - condition: template
        value_template: >-
          {% set tripped = {'float_7_5_inch': 7.5,
                            'float_9_inch': 9.0,
                            'float_11_inch': 11.0}.get(trigger.id) %}
          {{ tripped is none
             or tripped > (states('sensor.hydro_target_depth') | float(9)) }}
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: fault }
      - variables:
          # Name the DEPTH that tripped and the depth we were aiming at. "hard-limit float wet"
          # was the old message and it was actively misleading once that float became a target:
          # it reported the ceiling rather than the overshoot, and said nothing about intent.
          # Both numbers matter -- 9in wet is a success at an 11in target and a fault at 7.5in.
          why: >-
            {% set d = {'float_7_5_inch': 7.5,
                        'float_9_inch': 9.0,
                        'float_11_inch': 11.0}.get(trigger.id) %}
            {% if d is not none %}{{ d }}in float wet, target was
            {{ states('sensor.hydro_target_depth') }}in — fill overshot
            {% elif trigger.id == 'blind_timeout' %}floats unreadable, fill timer expired
            {% else %}filled past hard-limit depth with floats reading dry — float may be stuck
            {% endif %}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        # `why` is a folded scalar, so it carries a trailing space that an outer trim cannot
        # reach once it is concatenated mid-string. Trim it before joining, not after.
        data: { value: "{{ ('FAULT — ' ~ (why | trim) ~ '; auto-flood halted') | truncate(118, true, '') }}" }
      - action: system_log.write
        data:
          level: error
          message: "HYDRO FAILSAFE (fill): {{ why | trim }} — pump forced off, fault latched."
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # FAILSAFE — drain runaway (dry-run guard for the drain pump).
  #
  # SENSOR-FIRST as of 2026-08-16, and here the sensor is not merely more correct than the
  # timer — it is FASTER. What damages the pump is running it with no water, and the low-guard
  # float reports exactly that. The old timer could only say "a full drain should have
  # finished by now", which on a half-full bucket meant a minute or more of dry-running before
  # the guard would admit anything was wrong.
  #
  #   dry_running   low float dry AND pump still on. The 45s grace is measured from whichever
  #                 happened LATER — pump start or the float going dry — so that starting the
  #                 pump on an already-empty bucket gets a full grace period rather than
  #                 faulting instantly on a float that went dry hours ago.
  #   blind_timeout floats unreadable; fall back to the calibrated proxy.
  #   stuck_float   floats healthy but the low float never went dry. Either it is jammed wet
  #                 or the bucket genuinely is not emptying; both need a human.
  # ---------------------------------------------------------------------------
  # ── FILL PUMP DRY-RUN FAILSAFE ────────────────────────────────────────────────────────────
  #
  # THE MISSING HALF OF A GUARD THAT ALREADY EXISTED. hydro_drain_runaway_guard has stopped the
  # DRAIN pump on low wattage since 2026-08; the FILL pump had no equivalent, so on 2026-11-04 it
  # ran at 13.5 W -- below even the drain's 16 W dry threshold -- for 358 seconds, and the only
  # thing that eventually stopped it was the phase watchdog killing the entire cycle. The
  # watchdog then reported "a pump command was almost certainly lost", which is how an empty
  # suction line got diagnosed as a Z-Wave problem twice (2026-10-23 and 2026-11-03).
  #
  # WHAT THIS CHANGES ABOUT THE DIAGNOSIS, which matters more than the pump protection: a dry
  # fill pump is the signature of the reservoir being below the pump intake. Naming it directly
  # turns an unexplainable stall into "the fill pump is pulling air -- check the reservoir
  # level", which is the one thing the rig cannot currently see for itself .
  #
  # The 25 s floor and `for: 15s` are copied deliberately from the drain guard for the same two
  # reasons stated there: the ZEN20 reports power on change rather than continuously, so a single
  # sample can be stale, and a just-started pump reads 0 W until its first report lands. Without
  # both, every fill would trip this in its first second.
  #
  # Defaults to 99 on an unreadable sensor, also copied, so a MISSING reading can never look like
  # a dry pump -- the failure mode that would stop every flood on a flaky sensor.
  - id: hydro_fill_dry_run_guard
    alias: Hydro — Fill Pump Dry-Run Failsafe
    mode: single
    triggers:
      - trigger: template
        id: fill_dry_by_power
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_3', 'on')
             and (now() - states.switch.z_wave_plus_power_strip_3.last_changed).total_seconds() > 25
             and (states('sensor.z_wave_plus_power_strip_electric_consumption_w_3')
                  | float(99)) < (states('input_number.hydro_fill_dry_watts') | float(15)) }}
        for: { seconds: 15 }
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      # STOP THE PUMP FIRST, then explain. The drain guard does the same -- an explanation that
      # runs before the relay opens is an explanation delivered while the damage continues.
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_3 }
      # WHICH FAILURE, not just THAT one happened. Below the no-current threshold the pump is
      # drawing nothing at all, which cannot be a supply problem -- a dry pump still spins at
      # 13.5-16.8 W on this rig. Naming them apart is the whole point of this branch: on
      # 2026-11-21 a 0.0 W reading was reported as "lost its supply, check the reservoir" while
      # the reservoir held 36 gallons and the buckets were dry.
      - variables:
          _fill_w: >-
            {{ states('sensor.z_wave_plus_power_strip_electric_consumption_w_3') | float(99) }}
          _no_current: >-
            {{ (states('sensor.z_wave_plus_power_strip_electric_consumption_w_3') | float(99))
               < (states('input_number.hydro_fill_no_current_watts') | float(5)) }}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_fault_reason }
        data:
          value: "{{ 'fill-pump-no-current' if _no_current else 'fill-pump-dry' }}"
      # NO LATCH (corrected 2026-11-04, same day I added it in (internal MR)). A dry fill pump is
      # RESOLVABLE: stopping the pump IS the resolution, the flood has usually already reached
      # target, and the drain returns the water so the next cycle can try again. Latching here
      # suspended every later flood for a condition the rig recovers from, against the rule that
      # the latch is only for what the logic cannot resolve.
      #
      # It counts toward the same streak as a short fill, so a pump that is dry cycle after cycle
      # still escalates to a latch -- just on evidence rather than on the first occurrence.
      - action: counter.increment
        target: { entity_id: counter.hydro_fill_faults_consecutive }
      - if:
          - condition: template
            value_template: >-
              {{ (states('counter.hydro_fill_faults_consecutive') | int(0))
                 >= (states('input_number.hydro_fill_max_consecutive_faults') | int(3)) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ (('FAULT — fill pump drawing no current at ' ~ _fill_w
                 ~ 'W — relay, cord or pump, NOT the reservoir') if _no_current
                else ('FAULT — fill pump pulling air at ' ~ _fill_w
                      ~ 'W — check the reservoir level')) | truncate(118, true, '') }}
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO FILL DRY-RUN: relay 3 drawing
            {{ states('sensor.z_wave_plus_power_strip_electric_consumption_w_3') }} W, under the
            {{ states('input_number.hydro_fill_dry_watts') }} W threshold, after running
            {{ (now() - states.switch.z_wave_plus_power_strip_3.last_changed).total_seconds()
               | round(0) | int }}s. The pump is moving no water.
            {% if _no_current %}
            NO CURRENT IS REACHING THE MOTOR -- a dry pump still spins at 13.5-16.8 W on this
            rig, so zero is a relay, cord or pump failure, NOT the reservoir. Pump stopped.
            {% else %}
            The usual cause is the RESERVOIR BELOW THE PUMP INTAKE -- a loaded fill draws ~21 W
            on this rig. Pump stopped; this is not a Z-Wave or pump-command fault.
            {% endif %}
      - action: notify.persistent_notification
        data:
          title: >-
            {{ 'Hydroponics — fill pump drawing no current' if _no_current
               else 'Hydroponics — fill pump is pulling air' }}
          message: >-
            {% if _no_current %}
            The fill pump relay is ON but the pump drew {{ _fill_w }} W — essentially nothing —
            for the full 40 s this check waits. THIS IS NOT A WATER PROBLEM: a pump pulling air
            still spins and draws 13.5-16.8 W on this rig, measured. Zero means no current is
            reaching the motor. Check, in order: the pump is plugged into outlet 3 and the cord
            is seated; the outlet actually energises (another appliance will show); the pump
            itself still runs when powered directly. The reservoir and the buckets are not the
            cause and do not need checking first.
            {% else %}
            The fill pump ran at {{ _fill_w }} W, under the ~21 W it draws when moving water but
            above the no-current floor, so it is spinning without moving water and has been
            stopped. Check the reservoir level first: a 11in flood draws about 18 gallons and the
            pump cannot reach the bottom of the tank. If the reservoir has water in it, the pump
            has lost prime or its intake is blocked.
            {% endif %}
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  - id: hydro_drain_runaway_guard
    alias: Hydro — Drain Runaway Failsafe
    mode: single
    triggers:
      - trigger: template
        id: dry_running
        value_template: >-
          {% set pump = states.switch.z_wave_plus_power_strip_4 %}
          {% set low = states.binary_sensor.hydroponics_inputs_hydro_float_low_guard %}
          {{ is_state('switch.z_wave_plus_power_strip_4', 'on')
             and is_state('binary_sensor.hydro_floats_healthy', 'on')
             and is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard', 'off')
             and [ (now() - pump.last_changed).total_seconds(),
                   (now() - low.last_changed).total_seconds() ] | min > 45 }}
      - trigger: template
        id: blind_timeout
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_4', 'on')
             and is_state('binary_sensor.hydro_floats_healthy', 'off')
             and (now() - states.switch.z_wave_plus_power_strip_4.last_changed).total_seconds()
                 > ((states('sensor.hydro_drain_time') | float(238)) + 45) }}
      # POWER, NOT FLOATS - the only dry-run detector that does not depend on the thing under
      # suspicion. Every other trigger here asks a float whether there is water; if that float
      # is stuck WET, none of them fire and the pump grinds dry until the 330s runaway bound.
      # The pump's own current draw cannot be stuck.
      #
      # Thresholds MEASURED, not guessed. Across the 2026-08-16 drains and two probes on
      # 2026-08-22 this pump draws 20-23 W moving water and falls to 12.7-16.5 W once it starts
      # pulling air. 16 W sits in that gap.
      #
      # `for: 15s` plus the 25s floor because the ZEN20 reports power on change/threshold rather
      # than continuously, so one sample can be stale, and because a just-started pump reads 0 W
      # until its first report lands. Defaults to 99 on an unreadable sensor so a missing
      # reading can never look like a dry pump.
      - trigger: template
        id: dry_by_power
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_4', 'on')
             and (now() - states.switch.z_wave_plus_power_strip_4.last_changed).total_seconds() > 25
             and (states('sensor.z_wave_plus_power_strip_electric_consumption_w_4')
                  | float(99)) < (states('input_number.hydro_drain_dry_watts') | float(16)) }}
        for: { seconds: 15 }
      # The float clause is NEW (2026-08-22) and the message above always claimed it. This used
      # to be a bare time bound that fired whenever the drain ran long, then reported "with the
      # low float still wet" without ever having looked. Now it asks, and it asks ALL the
      # floats: a drain that ran past max while anything on the ladder is still wet is a bucket
      # that is not emptying. If every float has gone dry the drain worked and the overrun is a
      # timing question, not a failure to empty.
      - trigger: template
        id: stuck_float
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_4', 'on')
             and is_state('binary_sensor.hydro_all_floats_dry', 'off')
             and (now() - states.switch.z_wave_plus_power_strip_4.last_changed).total_seconds()
                 > (states('input_number.hydro_drain_max_seconds') | float(330)) }}
    actions:
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fault_latch }
      - variables:
          why: >-
            {% if trigger.id == 'dry_running' %}drain pump running dry, bucket already empty
            {% elif trigger.id == 'dry_by_power' %}drain pump drawing
              {{ states('sensor.z_wave_plus_power_strip_electric_consumption_w_4') }} W — pulling
              air while
              {% if is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','on')
                    and is_state('binary_sensor.hydroponics_inputs_hydro_float_6_inch','off')
                    and is_state('binary_sensor.hydroponics_inputs_hydro_float_7_5_inch','off')
                    and is_state('binary_sensor.hydroponics_inputs_hydro_float_9_inch','off')
              %}only low_guard reads wet and every depth float is dry, so there is little or no
                water left and GO LOOK AT THE DRAIN PUMP FIRST. It has caused this twice, by two
                different mechanisms: (1) 2026-10-29 — all four suction cups came off the housing,
                the pump walked around the bucket as it vibrated, and the HOUSING ITSELF came to
                rest against low_guard and physically held it wet, with the bucket EMPTY;
                (2) tipped on its side it drains only down to its intake and then pulls air,
                leaving the last inch behind with low_guard legitimately wet. Check the cups are
                attached and the pump is clear of the float, then that it is upright and seated.
                If the pump is clear and the bucket is dry, low_guard has failed
              {% else %}a float reads wet ABOVE a dry one, which is physically impossible, so that
                float is stuck{% endif %}
            {% elif trigger.id == 'blind_timeout' %}floats unreadable, drain timer expired
            {% else %}drained past max with {{ state_attr('binary_sensor.hydro_all_floats_dry','wet')
              | default([], true) | count }} float(s) still wet — not emptying, or float stuck
            {% endif %}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "{{ ('FAULT — ' ~ (why | trim)) | truncate(118, true, '') }}" }
      - action: system_log.write
        data:
          level: error
          message: "HYDRO FAILSAFE (drain): {{ why | trim }} — pump forced off, fault latched."
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # RECOVERY — break the empty-but-wet DEADLOCK.
  #
  # THE BUG THIS EXISTS FOR. Draining only ever happens as a STAGE OF A CYCLE. So if a cycle's
  # drain ends with any water still above the low float, the system locks solid:
  #   * the scheduler will not flood, because its precondition is "the bucket is empty", and
  #   * nothing will ever drain again, because draining only runs inside a cycle it cannot start.
  # Both halves are individually correct, which is why neither looked wrong. The plants simply
  # stop being watered, silently, forever.
  #
  # That is not hypothetical: the last flood before 2026-08-22 was 2026-08-16 01:30. Six days,
  # 31-day-old plants, no alert, nothing in a log. It was broken by accident, by a human running
  # the drain pump by hand while investigating something else entirely.
  #
  # A drain is the safe direction — it cannot overflow anything — so the recovery is simply
  # "finish the drain that never finished".
  #
  # BOUNDED, because self-healing that cannot stop is worse than the fault:
  #   * at most once an hour (hydro_t_recovery_drain), so a float stuck WET cannot turn this
  #     into an hourly dry-run that destroys the pump
  #   * only when both pumps are already off and the floats are readable
  #   * hydro_drain_runaway_guard stays armed underneath, including its power-based dry check
  # ---------------------------------------------------------------------------
  - id: hydro_deadlock_recovery
    alias: Hydro — Recover from empty-but-wet deadlock
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_phase_contradicts_floats
        to: "on"
        for: { minutes: 15 }
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_occupied
        state: "on"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "off"
      - condition: state
        entity_id: binary_sensor.hydro_floats_healthy
        state: "on"
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_3
        state: "off"
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_4
        state: "off"
      - condition: template
        value_template: >-
          {% set last = states('input_datetime.hydro_t_recovery_drain') %}
          {{ last in ['unknown','unavailable','']
             or (as_timestamp(now()) - as_timestamp(last)) > 3600 }}
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_t_recovery_drain }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      - action: system_log.write
        data:
          level: warning
          message: >-
            HYDRO RECOVERY: phase was empty with
            {{ state_attr('binary_sensor.hydro_all_floats_dry','wet') | default([], true) | count }}
            float(s) wet — the flood scheduler cannot start from here. Draining to clear it.
      # Enter `draining` so the drain runaway guard and the phase watchdog both apply to this
      # run exactly as they would to a scheduled one. Recovery must not be a privileged path.
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: draining }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "Recovering — draining residual water so flooding can resume" }
      - action: switch.turn_on
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - wait_template: "{{ is_state('binary_sensor.hydro_all_floats_dry','on') }}"
        timeout:
          seconds: "{{ states('input_number.hydro_drain_max_seconds') | int(330) }}"
        continue_on_timeout: true
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      - if:
          - condition: state
            entity_id: binary_sensor.hydro_all_floats_dry
            state: "on"
        then:
          - action: input_select.select_option
            target: { entity_id: input_select.hydro_phase }
            data: { option: empty }
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "Recovered — drained to empty, flooding can resume" }
        else:
          # Could not reach empty within the drain bound. That is no longer a deadlock, it is a
          # fault: something is holding water that the pump cannot move, or a float is stuck wet.
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.hydro_fault_latch }
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data: { value: "FAULT — recovery drain could not reach empty; check floats/plumbing" }
          - action: rest_command.hydro_alerts
            data: {}
            continue_on_error: true

  # ---------------------------------------------------------------------------
  # OBSERVER — stamp every stage of a cycle, so a missing stage is evidence.
  #
  # Records rather than intervenes. Every other automation in this file decides something; this
  # one only writes down what happened, because the 2026-08-22 incident was not a wrong decision
  # — it was a cycle that left no trace. A flood reached `full` at 14:33:48, a config deploy
  # restarted HA ~90s later, and afterwards phase read `empty` with the buckets still flooded.
  # No guard fired, because nothing was stuck: the cycle had simply been erased.
  #
  # Stamps go to input_datetime (persisted, survives the restart) AND to the logbook (readable
  # timeline). The logbook line is what a human reads at 6am; the stamps are what the
  # Cycle Incomplete sensor reasons over.
  # ---------------------------------------------------------------------------
  - id: hydro_cycle_recorder
    alias: Hydro — Cycle Observer (stamp each stage)
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: input_select.hydro_phase
    conditions:
      # Ignore restart churn: HA replays states on startup and would stamp a stage that never
      # physically happened, which is worse than no stamp at all.
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown','unavailable']
             and trigger.to_state.state != trigger.from_state.state }}
    actions:
      - variables:
          stamp: >-
            {% set p = trigger.to_state.state %}
            {% if p == 'filling' %}input_datetime.hydro_t_fill_start
            {% elif p == 'full' %}input_datetime.hydro_t_full
            {% elif p == 'draining' %}input_datetime.hydro_t_drain_start
            {% elif p == 'empty' %}input_datetime.hydro_t_empty
            {% else %}{% endif %}
      - if:
          - condition: template
            value_template: "{{ stamp | trim != '' }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: "{{ stamp | trim }}" }
            data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      # A COMPLETED cycle is draining -> empty. A flood that never drained must NOT count as
      # watering delivered, which is the whole reason the day's tally is kept from transitions
      # rather than from "the scheduler fired".
      - if:
          - condition: template
            value_template: >-
              {{ trigger.from_state.state == 'draining' and trigger.to_state.state == 'empty'
                   and is_state('input_boolean.hydro_fill_reached_target', 'on') }}
        then:
          - action: counter.increment
            target: { entity_id: counter.hydro_cycles_today }
          # Counted; disarm so the NEXT drain cannot reuse this fill's success. A watchdog
          # drain after a FAILED fill now finds the flag off and counts nothing.
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.hydro_fill_reached_target }
      - action: logbook.log
        data:
          name: Hydro cycle
          message: >-
            {{ trigger.from_state.state }} -> {{ trigger.to_state.state }}
            (floats wet: {{ state_attr('binary_sensor.hydro_all_floats_dry','wet')
               | default([], true) | count }},
            fill {{ states('sensor.z_wave_plus_power_strip_electric_consumption_w_3') }} W,
            drain {{ states('sensor.z_wave_plus_power_strip_electric_consumption_w_4') }} W)
          entity_id: input_select.hydro_phase

  # ---------------------------------------------------------------------------
  # MIRROR — keep the free-text status honest by rewriting it from derived state.
  #
  # input_text.hydro_status is written from 42 places and revisited by none of them, so it holds
  # whatever the last automation to touch it said, forever. That is how it came to read
  # "Idle - no plants" beside a 31-day-old crop, and how that string came to be believed.
  #
  # Rewriting it from sensor.hydro_status on every relevant change (and every 5 minutes
  # regardless) makes staleness impossible without touching a single one of those 42 call sites.
  #
  # HOLDS OFF WHENEVER ANYTHING IS SHOUTING. A guard or the observer writes a specific, diagnosed
  # message there; overwriting that with a cheerful summary would destroy the only text that
  # explains what went wrong. Silence from every alarm is the precondition for asserting "all
  # normal" — the mirror never invents calm.
  # ---------------------------------------------------------------------------
  - id: hydro_status_mirror
    alias: Hydro — Keep the status text honest
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_select.hydro_phase
          - input_boolean.hydro_occupied
          - input_boolean.hydro_maintenance
          - counter.hydro_cycles_today
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "off"
      - condition: state
        entity_id: binary_sensor.hydro_cycle_incomplete
        state: "off"
      - condition: state
        entity_id: binary_sensor.hydro_phase_contradicts_floats
        state: "off"
      - condition: state
        entity_id: binary_sensor.hydro_watering_overdue
        state: "off"
      - condition: state
        entity_id: binary_sensor.hydro_cycle_deficit
        state: "off"
      # Nothing to do if it already matches; avoids a pointless write every 5 minutes forever.
      - condition: template
        value_template: >-
          {{ states('input_text.hydro_status') | trim != states('sensor.hydro_status') | trim }}
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "{{ states('sensor.hydro_status') | trim | truncate(118, true, '') }}" }

  # ---------------------------------------------------------------------------
  # END OF DAY VERDICT — at lights-off, did the plants actually get watered?
  #
  # Owner's requirement, 2026-08-22: "if we shut down the system for the day and turn the lights
  # off, but we have only had 3 fill cycles or less that day, I want to know about it."
  #
  # Triggered by the LIGHT WINDOW CLOSING, not by a wall-clock time, so it follows the crop
  # profile: lettuce goes dark at 20:00, herbs and basil at 22:00. Hard-coding 22:00 would fire
  # two hours late for lettuce and would silently break the day a profile changes.
  #
  # ALWAYS logs the tally, even a perfect day. A number that only appears when something is
  # wrong gives you nothing to compare against, and no way to notice a slow decline from 6 to 5
  # to 4 - each of which passes the "half" test on its own.
  #
  # This is the DEFINITIVE daily check. hydro_cycle_deficit is the early warning during the day;
  # this one is the verdict, and it is the one that would have shouted on 2026-08-17, the first
  # full day of the six-day outage, when the tally was zero.
  # ---------------------------------------------------------------------------
  - id: hydro_end_of_day_report
    alias: Hydro — End-of-day watering report
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_in_light_window
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_occupied
        state: "on"
    actions:
      - variables:
          actual: "{{ states('counter.hydro_cycles_today') | int(0) }}"
          target: "{{ states('sensor.hydro_cycle_cadence') | int(6) }}"
          # What the tally window can FAIRLY demand. Identical to `target` on any normal day,
          # because expected_by_now reaches the full profile count at lights-off. It is lower
          # only when the counter started watching late, and judging a partial tally against a
          # whole day's quota is exactly the false alarm this change exists to stop.
          owed: "{{ state_attr('sensor.hydro_cycle_cadence','expected_by_now') | float(0) }}"
          partial: >-
            {% set ts = state_attr('sensor.hydro_cycle_cadence','tally_since') %}
            {{ ' [partial tally — counting only since ' ~ ts ~ ']'
               if (owed | float(0)) < (target | int(6)) - 0.1 else '' }}
          # SUPPRESSED, NOT MERELY ZERO. `owed` comes from `| float(0)`, so a cadence sensor that
          # is unavailable, unknown, or has lost its attributes also yields 0 -- and "owed is 0"
          # alone would then read a BROKEN SENSOR as "nothing was due tonight" and go quiet on
          # exactly the night something is wrong. This fails closed: a zero is only treated as a
          # pass when the sensor is alive AND is actively saying why it suppressed pace.
          suppressed: >-
            {{ states('sensor.hydro_cycle_cadence') not in
                 ['unknown', 'unavailable', 'none', '']
               and (owed | float(0)) <= 0
               and (state_attr('sensor.hydro_cycle_cadence', 'pace_suppressed')
                    | default('', true) | trim | length) > 0 }}
      # NOTHING OWED IS A PASS, NOT A FAILURE, and `<=` made it a failure.
      #
      # 2677b76 taught the cadence sensor to suppress pace before the first flood is due, which
      # it does by reporting expected_by_now = 0. That is correct. But this verdict asks
      # `actual <= owed / 2`, and with owed = 0 that is `0 <= 0` -- TRUE. So the fix that stopped
      # the daytime deficit warning turned the nightly verdict into an alarm that fires EVERY
      # night of the pre-flood window, saying "UNDER-WATERED — only 0 of 6 cycles today" about a
      # crop that is not due any water yet.
      #
      # It was invisible on the dashboard: hydro_keep_the_status_text_honest rewrites
      # input_text.hydro_status five minutes later, so the UNDER-WATERED string never survives
      # anywhere a human looks. The the notification service is the only artefact that outlives it, which is why this
      # reads as "the pace alerts are still firing" while every pace ENTITY is correctly off.
      #
      # Guarding the notify alone would not be enough -- the log level is computed from the same
      # comparison and would keep filing warnings that a log-based alert could pick up later.
      - action: system_log.write
        data:
          level: >-
            {{ 'warning' if (not suppressed and (actual | int) <= (owed | float(0) / 2))
               else 'info' }}
          message: >-
            HYDRO END OF DAY: {{ actual }} of {{ target }} fill/drain cycles completed
            ({{ states('sensor.hydro_plant_age') }}d old crop,
            window {{ state_attr('sensor.hydro_cycle_cadence','window') }}){{ partial }}{{
              ' — no cycles were owed yet ('
              ~ (state_attr('sensor.hydro_cycle_cadence','pace_suppressed') | default('pre-flood window'))
              ~ '), so this is a PASS'
              if suppressed else '' }}.
      - if:
          - condition: template
            value_template: >-
              {{ not suppressed and (actual | int) <= (owed | float(0) / 2) }}
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ ('UNDER-WATERED — only ' ~ actual ~ ' of ' ~ target ~
                    ' cycles today') | truncate(118, true, '') }}
          - action: rest_command.hydro_alerts
            data: {}
            continue_on_error: true

  # ---------------------------------------------------------------------------
  # Reset the day's tally. Midnight is safe for every crop profile in this file (earliest light
  # on 06:00, latest off 22:00), so it never splits a light window. If a profile is ever added
  # that runs past midnight, this has to move to that profile's `on` time instead.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # THE LATCH CAN NOW CLEAR ITSELF, BUT ONLY ON PROOF.
  # ---------------------------------------------------------------------------
  # WHY. On 2026-10-29 the drain pump was knocked onto its side. It drained down to its intake and
  # then pulled air, leaving the bottom inch behind, so low_guard stayed wet and the drain-runaway
  # failsafe latched -- correctly. The physical fault was fixed within the hour, and the latch then
  # sat set, suspending every flood, purely because nothing was willing to re-test the condition.
  # A latch that outlives its cause is its own outage.
  #
  # WHAT IT DOES. Once an hour, if the latch is set and it is safe to move water, run the drain for
  # ten seconds and then LOOK. If every float has gone dry the condition is genuinely gone and the
  # latch clears. If anything is still wet, the latch stays exactly where it is. The probe proves
  # the clear; it never assumes it.
  #
  # WHY THIS IS NOT "RETRY UNTIL IT WORKS", which is the dangerous version of this feature.
  # Self-healing that silently succeeds is how a mechanical fault becomes permanent: had this
  # existed on 2026-10-29 with no limit, it would have nudged the latch clear every hour, the pump
  # would have stayed sideways, and the crop would have taken partial drains indefinitely with the
  # dashboard green. So auto-clears are COUNTED, and after hydro_latch_autoclears_max_today the
  # latch stays set and says why. A fault that needs an hourly nudge is a fault that needs hands.
  #
  # TIME_PATTERN, NOT A STATE TRIGGER. The latch is already on when this becomes relevant, so an
  # edge trigger would have spent itself before there was anything to retry -- the same lesson the
  # polish drain learned. Level re-evaluation is the only shape that works.
  #
  # THE CONDITIONS ARE ALL OBSERVABLE STATE, deliberately. The latch is set from nine places and
  # records no machine-readable cause; adding one at nine call sites is nine chances to forget, and
  # the tenth added next month starts silent -- the same reasoning the latch alarm used for watching
  # the latch instead of the call sites. So eligibility asks "is it safe to move water right now,
  # and is there water to move", which is true of exactly the faults a drain can clear.
  - id: hydro_latch_retry_drain
    alias: Hydro — Retry the drain hourly and clear the latch only on proof
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "7"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "on"
      # Never while a fill is running: draining into a fill is a fight, and the fill pump's own
      # Z-Wave auto-off timer is what bounds it.
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_3
        state: "off"
      # Never while the drain is already running -- that is a cycle in progress, not a stuck latch.
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_4
        state: "off"
      # Float Test means someone is lifting floats by hand. Their readings are deliberately
      # unphysical for the duration, so a probe would be measuring the tester, not the tank.
      - condition: state
        entity_id: input_boolean.hydro_float_test
        state: "off"
      # THERE MUST BE WATER REPORTED. If every float already reads dry, the latch is held by
      # something a drain cannot fix, and probing would be dry-running for no information.
      - condition: state
        entity_id: binary_sensor.hydro_all_floats_dry
        state: "off"
      - condition: template
        value_template: >-
          {{ (states('counter.hydro_drain_probes_today') | int(0))
             < (states('input_number.hydro_drain_probes_max_today') | float(12) | round(0) | int) }}
      - condition: template
        value_template: >-
          {{ (states('counter.hydro_latch_autoclears_today') | int(0))
             < (states('input_number.hydro_latch_autoclears_max_today') | float(2) | round(0) | int) }}
    actions:
      - action: counter.increment
        target: { entity_id: counter.hydro_drain_probes_today }
      - action: switch.turn_on
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      # ── WAIT FOR PROOF, DO NOT DOSE BLINDLY (2026-11-03) ─────────────────────────────────
      # This was `delay: hydro_drain_probe_seconds`, a fixed 10 seconds, so the whole 12-probe
      # daily budget amounted to 120s of pumping -- roughly a third of ONE ordinary drain
      # (hydro_drain_seconds 285s; sensor.hydro_drain_time measures 324s) delivered in
      # ten-second dribbles across twelve hours. Probe 12 was identical to probe 1: no
      # escalation, no proof, just the same dose that had already failed eleven times.
      #
      # THE TIMIDITY BOUGHT NOTHING. A wait_template is not a timer -- it returns the instant
      # low_guard reads dry, so raising the bound does not mean a longer pump run in the normal
      # case. It only removes the cap on succeeding. The dry case is already covered by
      # hydro_drain_runaway_guard, which stops the pump on any of three independent triggers:
      # running dry >45s with low_guard off, a blind timeout past drain_time+45, or power under
      # hydro_drain_dry_watts (16 W) for 25s.
      #
      # Bounded by hydro_drain_seconds (285s) and NOT hydro_drain_max_seconds (900s), because
      # the relay carries a hydro_pump_autooff_minutes hardware auto-off of 6 minutes. 285s
      # leaves 75s of headroom; a 900s software bound would let the hardware cut the pump
      # mid-drain while this automation went on believing it had run to completion -- the same
      # shape as the six-minute auto-off deliberately sitting above HA's fill ceiling rather
      # than at it.
      - wait_template: >-
          {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','off') }}
        timeout:
          seconds: "{{ states('input_number.hydro_drain_seconds') | float(285) | round(0) | int }}"
        continue_on_timeout: true
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      # Floats are mechanical and the water needs a moment to stop moving. Reading them the instant
      # the pump stops measures the slosh, not the level.
      - delay: { seconds: 45 }
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.hydro_all_floats_dry
                state: "on"
            sequence:
              - action: counter.increment
                target: { entity_id: counter.hydro_latch_autoclears_today }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.hydro_last_latch_autoclear }
                data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.hydro_fault_latch }
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: >-
                    {{ 'OK — latch auto-cleared; drain ran to proof, all floats dry'
                       | truncate(118, true, '') }}
              - action: notify.persistent_notification
                data:
                  title: Hydroponics — fault latch auto-cleared
                  message: >-
                    The drain ran until the bottom float proved dry and every float now reads
                    dry, so the fault latch has cleared and flooding resumes. Probe
                    {{ states('counter.hydro_drain_probes_today') }} today; auto-clear
                    {{ states('counter.hydro_latch_autoclears_today') }} of
                    {{ states('input_number.hydro_latch_autoclears_max_today') | float(2) | round(0) | int }}.
                    {% if (states('counter.hydro_latch_autoclears_today') | int(0))
                          >= (states('input_number.hydro_latch_autoclears_max_today') | float(2) | round(0) | int) %}
                    THAT WAS THE LAST ONE ALLOWED TODAY. A fault that keeps needing an hourly nudge
                    is mechanical -- check the drain pump is upright and seated on the bottom, and
                    that the line is clear. Further trips stay latched until someone looks.
                    {% endif %}
          - conditions: []
            sequence:
              # Deliberately quiet. The latch alarm and its reminder already shout about the fault
              # itself; a failed probe means "still broken", which is not news every hour.
              - action: system_log.write
                data:
                  level: info
                  message: >-
                    HYDRO LATCH RETRY: probe {{ states('counter.hydro_drain_probes_today') }} of
                    {{ states('input_number.hydro_drain_probes_max_today') | float(12) | round(0) | int }}
                    ran the drain until the bottom float proved dry or
                    {{ states('input_number.hydro_drain_seconds') | float(285) | round(0) | int }}s
                    elapsed, and the floats are still not all dry — latch HELD. This is the
                    correct outcome while the cause is still present.

  # ---------------------------------------------------------------------------
  # IF THE CONDITION IS ALREADY GONE, NO PROBE IS NEEDED.
  # ---------------------------------------------------------------------------
  # THE GAP THIS CLOSES, found the night the probe shipped. hydro_latch_retry_drain requires
  # hydro_all_floats_dry to be OFF before it will run -- deliberately, so it never dry-runs the pump
  # when there is nothing to drain. But that means the clear-check only ever happens AFTER a probe,
  # so a fault that resolves by any OTHER means is never noticed and the latch sits set forever.
  #
  # That is exactly what happened on 2026-10-29. The drain pump's four suction cups came off, the
  # pump walked around the empty bucket as it vibrated, and its housing came to rest against
  # low_guard, holding it wet with no water present. The 00:07 probe ran and correctly held the
  # latch -- a drain cannot free a float that is mechanically pinned. The owner then freed the pump
  # by hand and low_guard released at 00:30:41, every float went dry... and the probe would now
  # SKIP, because there is no longer any water to justify running it. Condition gone, latch stuck.
  #
  # So: all floats dry while the latch is set IS the proof. It is the same evidence the probe looks
  # for, arrived at without the probe. Clearing on it needs no pump run at all.
  #
  # BOTH TRIGGER SHAPES, on purpose. The state trigger catches the transition the moment it happens.
  # The time_pattern catches the case where the transition was missed -- HA restarted, the automation
  # was reloaded, or the floats went dry while this was not listening. The latch outliving its cause
  # is the failure being fixed, so it must not depend on having observed a single edge.
  #
  # IT COUNTS AGAINST THE SAME AUTO-CLEAR BUDGET as the probe. A fault that keeps resolving itself is
  # the flapping case worth catching, whether a probe or a human resolved it, and the budget is what
  # stops self-healing from hiding a recurring mechanical problem.
  - id: hydro_latch_clear_when_already_dry
    alias: Hydro — Clear the latch when every float is already dry
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_all_floats_dry
        to: "on"
        for: { seconds: 60 }
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.hydro_fault_latch
        state: "on"
      # THE PROOF: nothing anywhere reads wet.
      - condition: state
        entity_id: binary_sensor.hydro_all_floats_dry
        state: "on"
      # Not mid-fill and not mid-drain. With the latch set neither should be running, but the whole
      # point of a guard is to not assume that.
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_3
        state: "off"
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_4
        state: "off"
      # Float Test makes readings deliberately unphysical; "all dry" during a test proves nothing.
      - condition: state
        entity_id: input_boolean.hydro_float_test
        state: "off"
      # ── NO AUTOCLEAR BUDGET ON THIS PATH (2026-11-04). THE CAP WAS ON THE WRONG ONE. ──────────
      #
      # The condition removed from here was:
      #     counter.hydro_latch_autoclears_today < hydro_latch_autoclears_max_today
      # and on 2026-11-04 it was the ONLY thing keeping the rig latched. Measured at 15:17:
      # latch on, binary_sensor.hydro_all_floats_dry ON, both pumps off, float test off -- every
      # other condition satisfied, buckets empty, nothing running. Blocked solely because the
      # counter read 2 of 2.
      #
      # THAT BUDGET EXISTS TO RATION PUMP CYCLES, AND THIS PATH DOES NOT USE THE PUMP. It shared
      # the counter with hydro_latch_retry_drain, which RUNS THE DRAIN to try to force the floats
      # dry. Rationing that one is right, and its own alarm text says why: "A fault that keeps
      # needing an hourly nudge is mechanical." This automation nudges nothing -- its own
      # notification says "the latch has cleared without running the pump."
      #
      # So a free, zero-risk reconciliation -- the fault condition is objectively gone, clear the
      # flag -- was rationed by a budget designed to limit pump wear. The result was a rig sitting
      # latched with empty buckets and every float dry, which is exactly the state the owner said
      # the system should resolve by itself: "only use the latch if the logic can't resolve the
      # problem."
      #
      # DEBOUNCE IS UNCHANGED AND IS WHAT PREVENTS THRASH: the state trigger still requires
      # all_floats_dry for 60 s, so this cannot flap on a bouncing float. The counter is still
      # incremented for the record and the dashboard; it simply no longer gates.
    actions:
      - action: counter.increment
        target: { entity_id: counter.hydro_latch_autoclears_today }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_last_latch_autoclear }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ 'OK — latch auto-cleared: every float dry, no probe needed' | truncate(118, true, '') }}
      - action: notify.persistent_notification
        data:
          title: Hydroponics — fault latch auto-cleared
          message: >-
            Every float now reads dry with the latch still set, so the fault condition is gone and
            the latch has cleared without running the pump. Flooding resumes. Auto-clear
            {{ states('counter.hydro_latch_autoclears_today') }} of
            {{ states('input_number.hydro_latch_autoclears_max_today') | float(2) | round(0) | int }}
            today.
            {% if (states('counter.hydro_latch_autoclears_today') | int(0))
                  >= (states('input_number.hydro_latch_autoclears_max_today') | float(2) | round(0) | int) %}
            THAT WAS THE LAST ONE ALLOWED TODAY. A fault that keeps resolving and returning is
            mechanical -- check the drain pump's suction cups are attached and that it cannot walk
            into a float while it vibrates. Further trips stay latched until someone looks.
            {% endif %}

  # ── SAY SO WHEN AUTOMATED RECOVERY IS SPENT ──────────────────────────────────────────────
  # Fires once on the rising edge of the exhausted state, after five minutes to avoid shouting
  # about the moment between the last probe finishing and its drain settling. Deliberately
  # high-priority and deliberately ONE alert: the fault latch alarm and its hourly reminder
  # already cover "there is a fault", and this is the different, worse fact -- the system has
  # run out of ways to fix it on its own and will do nothing further until someone acts or the
  # counters reset at midnight.
  - id: hydro_recovery_exhausted_alarm
    alias: Hydro — Alarm when automated recovery is spent and the tank is still wet
    mode: single
    triggers:
      # THREE WAYS IN, AND THE DEDUPE IS NOT IN THE TRIGGER. The edge alone could not fire when
      # the condition was already true at startup -- measured 2026-11-04, sensor 'on' at
      # 02:22:30 after a config restart, alarm last_triggered None. A wet tank persists across a
      # restart, so "already true at startup" is the NORMAL case for this alarm, not an edge
      # case. All three are safe because the once-a-day condition below bounds them.
      - trigger: state
        entity_id: binary_sensor.hydro_recovery_exhausted
        to: "on"
        for: { minutes: 5 }
      - trigger: homeassistant
        event: start
      # The sweep is the backstop for both of the above: a missed edge, a restart during the
      # five-minute debounce, or a reload. Half-hourly is frequent enough that the worst delay
      # is 30 minutes and cheap enough to be unconditional.
      - trigger: time_pattern
        minutes: "/30"
    conditions:
      - condition: state
        entity_id: binary_sensor.hydro_recovery_exhausted
        state: "on"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
      # ONCE A DAY, ENFORCED ON STATE RATHER THAN ON THE TRIGGER SHAPE. Without this the
      # time_pattern would re-alarm every half hour while the tank stayed wet, which is how an
      # alert trains someone to ignore it. The stamp survives a restart; last_triggered does
      # not, so this also prevents a restart loop from re-alarming each time.
      - condition: template
        value_template: >-
          {% set last = states('input_datetime.hydro_recovery_alarm_last') %}
          {{ last in ['unknown','unavailable','']
             or (as_datetime(last) | as_local).date() != now().date() }}
    actions:
      # STAMPED FIRST, DELIBERATELY. If the notify or the the notification service call raises, the stamp is already
      # written and the next sweep will not re-alarm. The failure mode that matters here is a
      # half-hourly repeat, not a single missed alert -- the status text and the system_log
      # entry below both still record it, and the next day's sweep will try again.
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_recovery_alarm_last }
        data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          value: >-
            {{ ('FAULT — automated drain recovery spent ('
                ~ states('counter.hydro_drain_probes_today')
                ~ ' probes), tank still wet — needs hands') | truncate(118, true, '') }}
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO RECOVERY EXHAUSTED:
            {{ state_attr('binary_sensor.hydro_recovery_exhausted','detail') }}
            No further drain attempts will run until the counters reset at 00:00. The flood
            scheduler needs binary_sensor.hydro_all_floats_dry to read on, so flooding stays
            stopped until the water is gone.
      - action: notify.persistent_notification
        data:
          title: Hydroponics — automated recovery is spent
          message: >-
            Every drain probe for today has been used and the tank is still wet, so nothing
            further will be attempted automatically until 00:00.
            {{ state_attr('binary_sensor.hydro_recovery_exhausted','detail') }}
            Flooding stays stopped while a low float reads wet, so the crop will keep missing
            cycles until this is cleared. Run the drain pump until the bottom float reads dry,
            then clear the fault latch -- and if that works by hand but not automatically, the
            drain pump is probably not seated on the bottom or the line is partly blocked.
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  - id: hydro_cycles_daily_reset
    alias: Hydro — Reset the daily cycle counter
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: system_log.write
        data:
          level: info
          message: >-
            HYDRO TALLY: {{ states('counter.hydro_cycles_today') }} of
            {{ states('sensor.hydro_cycle_cadence') }} cycles completed yesterday,
            {{ states('counter.hydro_watchdog_recoveries_today') }} watchdog recovery(ies),
            {{ states('counter.hydro_floods_held_today') }} flood(s) held for unreadable floats.
      - action: counter.reset
        target: { entity_id: counter.hydro_cycles_today }
      # Reset alongside the cycle counter: a morning that burned its retries must not leave the
      # afternoon unable to recover. Claimed in the hydro_short_fill_auto_recover comment, so it
      # has to actually happen.
      - action: counter.reset
        target: { entity_id: counter.hydro_fill_retries_today }
      # Per-day rate, same as the tallies below. Reset AFTER the log line above has reported it,
      # so a day that held floods says so once in the record before the count goes.
      - action: counter.reset
        target: { entity_id: counter.hydro_floods_held_today }
      # The polish tally is a PER-DAY rate, so it resets with the day it counts. Without this
      # it climbs forever and crosses hydro_polish_max_per_day once, on some arbitrary future
      # afternoon, for reasons that have nothing to do with that day's inflow.
      - action: counter.reset
        target: { entity_id: counter.hydro_polish_drains_today }
      # Same per-day-rate reasoning as the polish tally above: "the watchdog saved us N times
      # TODAY" is the sentence worth acting on, and a counter that climbs forever would announce
      # a threshold crossing on some arbitrary afternoon for reasons unrelated to that day.
      - action: counter.reset
        target: { entity_id: counter.hydro_watchdog_recoveries_today }
      # Both latch-retry tallies are per-day rates, same as the ones above. The probe budget must
      # reopen each day, or a morning that spent it leaves the evening unable to re-test a latch
      # whose cause has since been fixed -- which is the exact outage this feature exists to end.
      # The auto-clear budget reopens for the same reason: "two clears yesterday" should not
      # permanently disable self-clearing.
      - action: counter.reset
        target: { entity_id: counter.hydro_drain_probes_today }
      - action: counter.reset
        target: { entity_id: counter.hydro_latch_autoclears_today }
      # The consecutive-failure streak is NOT reset here. It is a "has the drain stopped
      # working" signal, and a drain that is broken at 23:59 is still broken at 00:01 —
      # zeroing it at midnight would hand a stuck system a fresh set of free failures.
      # Only a successful polish clears it.
      # Reopen the tally window in the same breath as zeroing the tally. These two must move
      # together — a counter reset without a window reset leaves yesterday's late `tally_since`
      # in place and under-expects all day; a window reset without a counter reset does the
      # reverse. Set to the profile's lights-on, which is when cycles start being owed.
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_tally_since }
        data:
          datetime: >-
            {% set p = state_attr('sensor.hydro_active_profile','profile') %}
            {{ today_at(p['on']).strftime('%Y-%m-%d %H:%M:%S')
               if p is mapping else today_at('06:00').strftime('%Y-%m-%d %H:%M:%S') }}

  # ---------------------------------------------------------------------------
  # THE TALLY ADMITS WHAT IT DID NOT SEE.
  #
  # counter.hydro_cycles_today can only count `draining -> empty` transitions that happened while
  # it existed and HA was observing. When it comes up at zero with a flood ALREADY on today's
  # record, that is proof of cycles it never saw — the counter's own history is incomplete, and
  # measuring pace from lights-on would bill it for a period it was absent. This advances the
  # measuring window to that flood instead.
  #
  # Zero is ambiguous on its own: it means either "nothing has happened yet" (which SHOULD alarm)
  # or "the tally lost its memory" (which should not). input_datetime.hydro_last_flood settles it,
  # because it persists independently of the counter. No flood on today's record means the zero is
  # real and the deficit alarm is left free to fire — this guard narrows the alarm, it never
  # silences it.
  #
  # The remaining overlap is a flood that filled today and never drained: the counter is rightly
  # at zero and this will still advance the window. That case is not lost, it is REASSIGNED —
  # hydro_cycle_incomplete names it precisely, which is a better alert than a vague pace deficit.
  # ---------------------------------------------------------------------------
  - id: hydro_tally_trust_guard
    alias: Hydro — Keep the cycle tally's window honest
    mode: single
    triggers:
      # Counter creation, a counter reload, or any other route back to zero.
      - trigger: state
        entity_id: counter.hydro_cycles_today
        to: "0"
      - trigger: homeassistant
        event: start
      # Backstop: entity creation on a package reload produces no state transition to catch.
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: "{{ states('counter.hydro_cycles_today') | int(-1) == 0 }}"
      - condition: template
        value_template: >-
          {% set lf = states('input_datetime.hydro_last_flood') %}
          {% if lf in ['unknown','unavailable',''] %}
            false
          {% else %}
            {% set ts = states('input_datetime.hydro_tally_since') %}
            {% set tst = as_timestamp(ts) if ts not in ['unknown','unavailable',''] else 0 %}
            {{ as_timestamp(lf) > tst
               and as_timestamp(lf) > as_timestamp(today_at('00:00')) }}
          {% endif %}
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.hydro_tally_since }
        data:
          datetime: "{{ states('input_datetime.hydro_last_flood') }}"
      - action: system_log.write
        data:
          level: warning
          message: >-
            HYDRO TALLY WINDOW: counter reads 0 but a flood is on today's record at
            {{ states('input_datetime.hydro_last_flood') }} — the tally missed cycles it was
            not present for. Measuring pace from that flood rather than from lights-on.

  # ---------------------------------------------------------------------------
  # ALARM — a stage went missing, or the phase disagrees with the water.
  #
  # REPORTS, DOES NOT LATCH. Both conditions it watches mean "the plants may not be getting
  # watered"; latching a fault would block the scheduler and make that worse. The six-day gap
  # was already a silent no-watering state — the fix for that class is a human being told, not
  # a deeper interlock.
  #
  # 15-minute re-check rather than trigger-once, so an unattended fault keeps surfacing instead
  # of scrolling past in a notification history nobody re-reads.
  # ---------------------------------------------------------------------------
  - id: hydro_cycle_observer_alarm
    alias: Hydro — Cycle Observer Alarm
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.hydro_cycle_incomplete
          - binary_sensor.hydro_phase_contradicts_floats
          - binary_sensor.hydro_watering_overdue
          - binary_sensor.hydro_cycle_deficit
        to: "on"
        for: { minutes: 2 }
      # HOURLY, NOT EVERY 15 MINUTES. Nothing this alarm reports gets worse in a quarter hour.
      # Re-notifying four times an hour trains the recipient to swipe it away, which costs more
      # than the delay ever saves.
      - trigger: time_pattern
        minutes: "0"
    conditions:
      # QUIET HOURS 00:00-07:00, matching scripts/the notification service-router.py -- which has implemented this
      # policy for the estate all along. These alerts simply never went through it: they POST
      # straight to the notification service and bypass the tiering and the quiet window entirely.
      #
      # Everything this alarm reports can wait for morning: watering overdue, behind pace, a
      # cycle that did not complete, phase disagreeing with the floats. None get worse for being
      # reported at 07:00, and none are actionable at 03:00.
      #
      # WHAT DELIBERATELY DOES NOT RESPECT QUIET HOURS: rest_command.hydro_alerts -- the
      # overflow guard, dry-pump cutoff, both-pumps interlock and fault latch. Those are where
      # something breaks, they are a separate channel, and they are untouched here. Wake someone
      # for damage, not for news.
      - condition: not
        conditions:
          - condition: time
            after: "00:00:00"
            before: "07:00:00"
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.hydro_cycle_incomplete
            state: "on"
          # THE RAW CONTRADICTION IS NO LONGER WORTH REPORTING ON ITS OWN.
          # Measured twice on 2026-08-25: an idle, drained bucket collects enough water to
          # trip the low float in roughly an hour, and FIVE SECONDS of drain clears it
          # (16:46:08 -> dry at 16:46:13; 18:13:45 -> dry at 18:13:50). Alarming on that is
          # noise, and noise on the channel that also carries overflow is how a real fault
          # gets scrolled past. The polish-drain automation now handles it and only sets
          # hydro_polish_failed when pumping did NOT clear the float, which is the version of
          # this condition that actually means something is wrong.
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.hydro_phase_contradicts_floats
                state: "on"
              - condition: state
                entity_id: input_boolean.hydro_polish_failed
                state: "on"
          - condition: state
            entity_id: binary_sensor.hydro_watering_overdue
            state: "on"
          - condition: state
            entity_id: binary_sensor.hydro_cycle_deficit
            state: "on"
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      - variables:
          why: >-
            {% if is_state('binary_sensor.hydro_cycle_deficit','on') %}
            BEHIND PACE — {{ states('counter.hydro_cycles_today') }} of
            {{ state_attr('sensor.hydro_cycle_cadence','expected_by_now') }} cycles expected by now
            (target {{ states('sensor.hydro_cycle_cadence') }}/day)
            {% elif is_state('binary_sensor.hydro_watering_overdue','on') %}
            NOT WATERING — {{ state_attr('binary_sensor.hydro_watering_overdue','hours_since_flood') }}h
            since the last flood, with plants in the buckets
            {% elif is_state('binary_sensor.hydro_cycle_incomplete','on') %}
            incomplete cycle — {{ state_attr('binary_sensor.hydro_cycle_incomplete','missing_stage') | trim }}
            (full at {{ states('input_datetime.hydro_t_full') }},
            last empty {{ states('input_datetime.hydro_t_empty') }})
            {% else %}
            phase says empty but {{ state_attr('binary_sensor.hydro_phase_contradicts_floats','wet')
              | default([], true) | count }} float(s) are wet
            {% endif %}
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "{{ ('CHECK — ' ~ (why | trim)) | truncate(118, true, '') }}" }
      - action: system_log.write
        data:
          level: warning
          message: "HYDRO OBSERVER: {{ why | trim }}"
      - action: script.hydro_notify_health

  # ---------------------------------------------------------------------------
  # POLISH DRAIN — an idle bucket that has collected water again.
  #
  # WHAT THIS IS FOR, measured rather than assumed. On 2026-08-25 the fault channel fired twice
  # with "phase says empty but 1 float(s) are wet". Neither was settling, and neither was a
  # cycle:
  #
  #   17:05:29  low float dry, cycle 4's drain finishes
  #   17:06:10  phase -> empty
  #      ...    65 minutes idle, BOTH PUMPS OFF the whole time
  #   18:10:37  low float WET again
  #   18:13:45  drain on -> 18:13:50 low float DRY (five seconds), pump off at 18:14:10
  #
  # The same shape at 16:31 -> 16:46. So an idle, drained bucket collects enough water to reach
  # the LOWEST float in roughly an hour, and a few seconds of pumping removes it. That is a
  # slow inflow — a fill line that weeps, or the reservoir equalising — not a failure, and not
  # something a person needs to be told about at 10:33 in the morning.
  #
  # WHY PUMP RATHER THAN JUST SUPPRESS THE ALERT. Widening the tolerance would have been the
  # cheap fix and the wrong one: the water is really there, it really is rising, and the float
  # is telling the truth. Removing it keeps the bucket in the state the phase machine claims it
  # is in, so every OTHER guard that trusts "empty" stays honest.
  #
  # WHY IT IS NOT ALLOWED TO RUN QUIETLY FOREVER. counter.hydro_polish_drains_today exists so
  # the COUNT is visible, and crossing hydro_polish_max_per_day alarms — a seep that needs
  # pumping every hour is a different fact from one that needs it twice a day, and an automation
  # that silently absorbs a worsening leak is worse than the noise it replaced.
  - id: hydro_polish_drain
    alias: Hydro — Polish drain when an idle bucket collects water
    mode: single
    triggers:
      # Persistence, not debounce. Mid-cycle the water line sweeps past this float constantly;
      # three minutes of it standing still while the phase says empty is what separates "the
      # bucket is filling with nothing running" from "water is moving".
      - trigger: state
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_low_guard
        to: "on"
        for: { minutes: 3 }
      # AND A LEVEL TRIGGER, because the edge trigger above SPENDS ITSELF. A state trigger with
      # `to: "on"` does not fire when the entity is ALREADY on, so if that float goes wet while
      # any condition below happens to be false -- a pump still settling, the phase not yet back
      # to empty -- the edge is consumed and can never recur, because the float never goes
      # dry->wet again. The bucket then holds water forever, the Flood Scheduler refuses to fill
      # into it (its gate needs all floats dry), and NOTHING FAULTS. Measured 2026-10-27: phase
      # empty, fault_latch off, floats healthy, all_floats_dry off, 0 of 5.1 expected cycles, and
      # the owner asking why nothing had watered.
      #
      # Re-evaluating on a clock is how the Flood Scheduler itself avoids this -- it triggers on
      # time_pattern /5 rather than on an edge. Water settling back into an inch after a drain is
      # ROUTINE on this rig, not exceptional, so the clearing step has to be routine too.
      #
      # mode: single already prevents overlap, so a tick that lands while a polish is running is
      # dropped rather than queued.
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      # THERE MUST ACTUALLY BE WATER. Mandatory now that a clock drives this: without it the
      # time_pattern above would run the drain pump every ten minutes forever against an empty
      # bucket. The edge trigger implied this condition; a level trigger has to state it.
      - condition: state
        entity_id: binary_sensor.hydroponics_inputs_hydro_float_low_guard
        state: "on"
      # Only when the machine believes it is empty and nothing is driving water anywhere.
      - condition: state
        entity_id: input_select.hydro_phase
        state: empty
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_3
        state: "off"
      - condition: state
        entity_id: switch.z_wave_plus_power_strip_4
        state: "off"
      - condition: state
        entity_id: script.hydro_flood_drain_cycle
        state: "off"
      # ── THE FAULT LATCH IS DELIBERATELY NO LONGER A CONDITION HERE (2026-11-03) ───────────
      # It required the latch OFF, which locked the only PROOF-DRIVEN drain out of the exact
      # state it exists to clear. The two recovery paths were mutually exclusive on the latch,
      # and the capable one was the one disabled when something was actually wrong:
      #
      #   this automation         latch OFF required. Pumps, then WAITS for low_guard to read
      #                           dry (up to hydro_polish_max_seconds). Budget 8/day.
      #   hydro_latch_retry_drain latch ON required.  Pumped a BLIND fixed 10s. Budget 12/day.
      #
      # Measured on 2026-11-03: latch set 09:19, cleared by hand at 23:04.
      # counter.hydro_polish_drains_today ended the day at 0 of 8 -- never once allowed to run
      # -- while the 10s path spent all 12 probes and cleared nothing. The owner fixed it with
      # the drain pump by hand, which is precisely what this automation does automatically.
      #
      # DRAINING WHILE LATCHED IS NOT A NEW RISK: hydro_latch_retry_drain already did exactly
      # that, so "unsafe while latched" cannot be the rationale. The latch's job is to stop
      # FLOODING until there is proof, and a drain is how that proof gets made. Every real
      # interlock is still above this line -- both pumps off, phase empty, no cycle script
      # running -- and hydro_drain_runaway_guard still cuts the pump if it runs dry.
      - condition: state
        entity_id: input_boolean.hydro_maintenance
        state: "off"
    actions:
      # RUNG TWO IS A DIFFERENT FACT FROM RUNG ONE, and it is captured BEFORE pumping because
      # pumping destroys the evidence. The low guard going wet while idle is the known trickle.
      # Water reaching the SECOND float means the inflow has outrun what an hourly polish
      # absorbs, and that is a definite problem whether or not this drain clears it. The ladder
      # is what makes the distinction available at all — one float could only ever have said
      # "wet".
      - variables:
          ladder_escalation: >-
            {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_second','on')
               or is_state('binary_sensor.hydroponics_inputs_hydro_float_6_inch','on')
               or is_state('binary_sensor.hydroponics_inputs_hydro_float_7_5_inch','on')
               or is_state('binary_sensor.hydroponics_inputs_hydro_float_9_inch','on')
               or is_state('binary_sensor.hydroponics_inputs_hydro_float_11_inch','on') }}
      - action: counter.increment
        target: { entity_id: counter.hydro_polish_drains_today }
      - action: switch.turn_on
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      # Stop on the float, not on a timer. Five seconds is what it has taken both times
      # observed; the bound exists for the case where that stops being true.
      - wait_template: >-
          {{ is_state('binary_sensor.hydroponics_inputs_hydro_float_low_guard','off') }}
        timeout:
          seconds: "{{ states('input_number.hydro_polish_max_seconds') | int(45) }}"
        continue_on_timeout: true
      - action: switch.turn_off
        target: { entity_id: switch.z_wave_plus_power_strip_4 }
      # Same gravity lag the main drain respects. Judging the float the instant the pump stops
      # is the mistake the drain path already made once and fixed.
      - delay:
          seconds: "{{ states('input_number.hydro_drain_settle_seconds') | int(20) }}"
      - choose:
          # IT DID NOT CLEAR. Water that pumping cannot remove is a blocked line, a dead pump,
          # or an inflow faster than the drain. Counted rather than alarmed on the first
          # occurrence: one failure is within the noise of a float settling or a pump not
          # catching, and paging on it would rebuild the hair-trigger this replaced. Three in a
          # row is not noise.
          - conditions:
              - condition: state
                entity_id: binary_sensor.hydroponics_inputs_hydro_float_low_guard
                state: "on"
            sequence:
              - action: counter.increment
                target: { entity_id: counter.hydro_polish_consecutive_failures }
              - if:
                  - condition: template
                    value_template: >-
                      {{ (states('counter.hydro_polish_consecutive_failures') | int(0))
                         >= (states('input_number.hydro_polish_max_consecutive_failures') | int(3)) }}
                then:
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.hydro_polish_failed }
                  - action: input_text.set_value
                    target: { entity_id: input_text.hydro_status }
                    data:
                      value: >-
                        {{ ('FAULT — ' ~ states('counter.hydro_polish_consecutive_failures')
                           ~ ' polish drains in a row left the low float wet') | truncate(118, true, '') }}
                  - action: system_log.write
                    data:
                      level: error
                      message: >-
                        HYDRO POLISH: {{ states('counter.hydro_polish_consecutive_failures') }}
                        consecutive failures. Blocked drain, failed pump, or inflow faster than
                        the drain.
                  - action: rest_command.hydro_alerts
                    data: {}
                    continue_on_error: true
                else:
                  # Below the threshold: recorded, visible in the log and the counter, silent.
                  - action: system_log.write
                    data:
                      level: warning
                      message: >-
                        HYDRO POLISH: pumped and the low float stayed wet
                        ({{ states('counter.hydro_polish_consecutive_failures') }} in a row,
                        alarming at {{ states('input_number.hydro_polish_max_consecutive_failures') }}).
        default:
          # It cleared. Reset the streak — this counter measures consecutive failures, and a
          # success is what makes them non-consecutive.
          - action: counter.reset
            target: { entity_id: counter.hydro_polish_consecutive_failures }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.hydro_polish_failed }
          - action: system_log.write
            data:
              level: info
              message: >-
                HYDRO POLISH: idle bucket had collected water; drained it.
                {{ states('counter.hydro_polish_drains_today') }} polish drain(s) today.
          # THE COUNT IS THE SIGNAL. One alert when the rate crosses the threshold, not one per
          # polish — the whole point was to stop paging about each individual occurrence.
          - if:
              - condition: template
                value_template: >-
                  {{ (states('counter.hydro_polish_drains_today') | int(0))
                     == (states('input_number.hydro_polish_max_per_day') | int(8)) }}
            then:
              - action: input_text.set_value
                target: { entity_id: input_text.hydro_status }
                data:
                  value: >-
                    {{ ('CHECK — ' ~ states('counter.hydro_polish_drains_today')
                       ~ ' polish drains today; the seep is getting worse') | truncate(118, true, '') }}
              - action: rest_command.hydro_alerts
                data: {}
                continue_on_error: true

      # RUNG TWO ALARMS EITHER WAY, and it is deliberately outside the choose above.
      #
      # If water reached the second float, clearing it does not make it fine — it means the
      # inflow got past the rung that an hourly polish is sized for. Putting this on the success
      # path only would produce the worst possible behaviour: the pump quietly keeps up with a
      # growing leak, and the first anyone hears of it is when it finally outruns the drain.
      #
      # Reported once per occurrence rather than latched, because the polish genuinely did its
      # job; what is being reported is HOW HIGH the water got, not that the machine is stuck.
      - if:
          - condition: template
            value_template: "{{ ladder_escalation }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hydro_status }
            data:
              value: >-
                {{ ('CHECK — idle bucket filled past the low guard to '
                   ~ (state_attr('binary_sensor.hydro_phase_contradicts_floats','wet')
                      | default([], true) | count) ~ ' float(s); drained') | truncate(118, true, '') }}
          - action: system_log.write
            data:
              level: error
              message: >-
                HYDRO POLISH: water reached the SECOND float or higher while idle. The trickle
                this automation absorbs has grown past the rung it is sized for.
          - action: rest_command.hydro_alerts
            data: {}
            continue_on_error: true

  # ---------------------------------------------------------------------------
  # FAILSAFE — the floats contradict each other.
  #
  # Every other guard here trusts what a float says and bounds how long it may say it. This one
  # asks whether the floats can all be telling the truth at once, which is the only way to catch
  # the failure the rest of the design explicitly cannot: a float stuck DRY. `Floats Healthy`
  # detects a float that stopped answering; nothing detected a float that answers confidently
  # and wrongly, and a low guard stuck dry on a full bucket is the reading that gets a fill pump
  # started into water that never left.
  #
  # 30s of persistence because the ladder is legitimately inconsistent MID-CYCLE: during a fill
  # or drain the water line sweeps past each float and they change state at different instants.
  # Requiring the contradiction to hold still is what separates "water is moving" from "one of
  # these is lying". It is not a debounce for noise.
  #
  # NOT gated on the pumps being off - a contradiction is worth knowing about whenever it holds,
  # and the actions below are safe to take at any time.
  # ---------------------------------------------------------------------------
  - id: hydro_float_disagreement_guard
    alias: Hydro — Float Disagreement Failsafe
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hydro_floats_disagree
        to: "on"
        # 360s, NOT 30. The 30 assumed a float reports within half a minute of water reaching it,
        # and that is measurably false on this rig: it halted the crop sown 2026-10-07 on its very
        # first scheduled flood and left it halted for two days.
        #
        # WHAT HAPPENED, to the second, from core.restore_state:
        #     00:00:00  fill_started           (day 14, the first flood this crop was due)
        #     06:00:24Z all_floats_dry -> off  (water arriving, floats beginning to lift)
        #     06:00:54Z fault_latch    -> ON   (this trigger, after 30s of held contradiction)
        #     06:00:57Z floats_disagree-> off  (3s after the guard cut both pumps)
        #
        # I READ THAT SELF-HEAL WRONG, and the correction matters more than the number.
        #
        # The actions below cut switch 3 and 4, the water line froze, and the contradiction cleared
        # three seconds later. I concluded a float was merely LATE rather than lying, and wrote
        # that here as established fact.
        #
        # THE OWNER FOUND THE ACTUAL CAUSE ON 2026-10-24: the DRAIN PUMP'S POWER CORD had snagged a
        # bobber and was holding it in the raised position, forcing a permanent false WET. That is
        # a genuinely stuck float -- precisely the fault this guard exists to catch -- and the cord
        # releasing once flow stopped explains the same three seconds just as well.
        #
        # SO THE 2026-10-21 TRIP WAS PROBABLY TRUE, AND THIS CHANGE MAKES IT SLOWER TO CATCH.
        # 360s is still right, because a 260s fill sweeping six floats WILL hold a transient
        # contradiction for longer than 30s and false-trip -- but it is a trade, not a free win,
        # and the honest statement is that it costs ~5.5 minutes of detection on a real stuck
        # float. Do not read the comment below as evidence that trips here are false alarms.
        #
        # PHYSICAL LESSON WORTH MORE THAN THE CONSTANT: cable routing near the floats is part of
        # the sensor's reliability. A power cord resting against a bobber is a sensor fault waiting
        # to happen, and no amount of debounce tuning detects it.
        #
        # SO THE CONSTANT MUST OUTLAST MOVING WATER, which is what the reasoning above always said
        # and what 30s did not deliver. Measured from the helpers on the running system:
        #     fill_max_seconds  260   (fill_seconds 260, last measured fill_time 234)
        #     drain_max_seconds 330   (drain_seconds 285, last measured drain_time 266)
        # A fill sweeps six floats over roughly four minutes, so the line can sit between two
        # adjacent floats for far longer than 30s. 360 clears the longer limit (the drain, 330)
        # with margin, so a contradiction still standing cannot be explained by water in motion --
        # exactly the distinction this guard exists to make.
        #
        # THIS DOES NOT WEAKEN THE FLOOR PROTECTION. Fill-overflow, drain-runaway and the
        # both-pumps interlock are untouched and still trip on their own terms. This guard detects
        # a mis-reporting SENSOR; the cost of a false trip is a halted crop, and the cost of
        # waiting 360s is nothing, because the fill guard cuts power long before then.
        # 360 -> 960, FORCED BY RAISING THE DURATION CEILINGS, and the gate caught it:
        # test-hydro-float-debounce-outlasts-water asserts this must strictly exceed BOTH
        # hydro_fill_max_seconds and hydro_drain_max_seconds, which are now 600 and 900.
        #
        # THE RULE IS NOT ARBITRARY. A wet-above-dry contradiction that outlives the longest
        # possible water movement is the only kind that cannot be explained by water movement.
        # Set below the drain ceiling, this latches the fault during a NORMAL cycle and halts all
        # auto-flooding until a human clears it -- which is exactly what happened on 2026-10-21
        # with a 30s hold, and cost two days of hand-watering while the BEHIND PACE alerts were
        # read as the false alarms they resembled.
        #
        # THE COST IS REAL AND IS THE POINT OF THIS COMMENT: a genuinely stuck float -- the drain
        # pump's power cord snagging a bobber, found 2026-10-24 -- now takes 16 minutes to detect
        # instead of 6. That is a deliberate trade, taken because the owner's stated goal is to
        # stop hand-watering entirely, and a false latch stops watering while a slow detection
        # only delays an alert. Anyone tightening this is buying detection with false latches.
        for: { seconds: 960 }
    conditions:
      # An unreadable float is an availability problem, already reported elsewhere. Do not turn
      # every ESPHome reconnect into a hardware fault.
      - condition: state
        entity_id: binary_sensor.hydro_floats_healthy
        state: "on"
    actions:
      # UNCONDITIONAL, AND DELIBERATELY BEFORE THE TEST-MODE BRANCH. Cutting power is the
      # protective half of this guard and it runs whether or not somebody is testing. During
      # a test the pumps are already off, so this costs nothing; the day the test mode is
      # armed while something is genuinely wrong, it is still the first thing that happens.
      - action: switch.turn_off
        target:
          entity_id:
            - switch.z_wave_plus_power_strip_3
            - switch.z_wave_plus_power_strip_4
      # DELIBERATE DISAGREEMENT IS NOT A FAULT. Lifting an upper float by hand is exactly the
      # wet-above-dry signature this guard hunts, so during an armed test the latch, the phase
      # change and the urgent page are all suppressed — they mean "stop everything until a
      # human looks", and the human is standing at the rack holding the float. Protection is
      # untouched; only the summons is. See input_boolean.hydro_float_test for the bounds.
      - if:
          - condition: state
            entity_id: input_boolean.hydro_float_test
            state: "on"
        then:
          - action: system_log.write
            data:
              level: warning
              message: >-
                HYDRO: float disagreement during an ARMED float test —
                {{ state_attr('binary_sensor.hydro_floats_disagree','primary_suspect') }}.
                Pumps forced off; latch suppressed because this is expected.
          - stop: "Disagreement expected during float test."
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_select.select_option
        target: { entity_id: input_select.hydro_phase }
        data: { option: fault }
      - variables:
          wet: "{{ state_attr('binary_sensor.hydro_floats_disagree','wet_above_dry') | default([], true) }}"
          dry: "{{ state_attr('binary_sensor.hydro_floats_disagree','dry_below_wet') | default([], true) }}"
          suspect: "{{ state_attr('binary_sensor.hydro_floats_disagree','primary_suspect') | default('unknown', true) }}"
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data:
          # NAMES THE FLOAT AND THE DIRECTION, NOT A COUNT. "2 floats wet above a dry one"
          # sends you to the rack with nothing to check; "low_guard (stuck dry)" sends you to
          # the one float worth pulling out and wiping off. The direction comes from the
          # attribute rather than being assumed here — either side of the ladder can be the
          # one that is lying.
          value: >-
            {{ ('FAULT — floats disagree; suspect ' ~ suspect) | truncate(118, true, '') }}
      - action: system_log.write
        data:
          level: error
          message: >-
            HYDRO FAILSAFE (floats): {{ dry | join(', ') }} read DRY while
            {{ wet | join(', ') }} above read wet — water is one surface, so the dry float(s)
            below are stuck. Primary suspect: {{ suspect }}. Both pumps forced off, fault
            latched.
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true

  # ---------------------------------------------------------------------------
  # INTERLOCK — both pumps must never run at once. Force both off, latch fault.
  # ---------------------------------------------------------------------------
  - id: hydro_both_pumps_interlock
    alias: Hydro — Both-Pumps Interlock
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('switch.z_wave_plus_power_strip_3', 'on')
             and is_state('switch.z_wave_plus_power_strip_4', 'on') }}
    actions:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.z_wave_plus_power_strip_3
            - switch.z_wave_plus_power_strip_4
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hydro_fault_latch }
      - action: input_text.set_value
        target: { entity_id: input_text.hydro_status }
        data: { value: "FAULT — both pumps on; interlock forced off" }
      - action: system_log.write
        data:
          level: error
          message: "HYDRO FAILSAFE: fill AND drain both on — interlock forced both off, fault latched."
      - action: rest_command.hydro_alerts
        data: {}
        continue_on_error: true
